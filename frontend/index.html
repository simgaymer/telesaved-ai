                      <label className="tag-check"><input type="checkbox" checked={profile.preserve_sender !== false} onChange={e => updateProfile(ref, {preserve_sender: e.target.checked})} /> Sender</label>
                      <label className="tag-check"><input type="checkbox" checked={profile.preserve_forwards !== false} onChange={e => updateProfile(ref, {preserve_forwards: e.target.checked})} /> Forwards</label>
                      <label className="tag-check"><input type="checkbox" checked={profile.preserve_replies !== false} onChange={e => updateProfile(ref, {preserve_replies: e.target.checked})} /> Replies</label>
                      <label className="tag-check"><input type="checkbox" checked={profile.preserve_reactions !== false} onChange={e => updateProfile(ref, {preserve_reactions: e.target.checked})} /> Reactions</label>

                    <div className="form-grid">

                      <div><label className="label">Media Filter</label><select className="field" value={profile.media_filter || "videos"} onChange={e => updateProfile(ref, {media_filter: e.target.value})}><option value="videos">Videos only</option><option value="video_documents">Videos and video documents</option></select></div>
                      <div><label className="label">Max Messages Per Run</label><input className="field" value={profile.max_messages_per_run || ""} onChange={e => updateProfile(ref, {max_messages_per_run: e.target.value})} placeholder="blank = startup unlimited; manual uses 500" /></div>

                      <div><label className="label">Source Tag</label><input className="field" value={profile.source_tag || ""} onChange={e => updateProfile(ref, {source_tag: e.target.value})} placeholder="optional source tag" /></div>
                      <div><label className="label">Pipeline Notes</label><input className="field" value={profile.pipeline_notes || ""} onChange={e => updateProfile(ref, {pipeline_notes: e.target.value})} /></div>

                    <div className="stats" style={{marginTop:"12px"}}>
                      <div className="stat">Videos: <strong>{pipelineRow(ref).videos || 0}</strong></div>
                      <div className="stat">Telegram metadata: <strong>{pipelineRow(ref).telegram_metadata || 0}</strong></div>
                      <div className="stat">Captions: <strong>{pipelineRow(ref).caption_count || 0}</strong></div>
                      <div className="stat">Sidecars: <strong>{pipelineRow(ref).sidecar_count || 0}</strong></div>
                    </div>
                    <div className="controls-row">
                      <button className="btn secondary" disabled={pipelineRunning === ref} onClick={() => runPipeline(ref)}>{pipelineRunning === ref ? "Starting…" : "Run This Source Pipeline"}</button>
                    </div>
                  </div>

                  <div className="form-grid">
                    <div><label className="label">Display Name</label><input className="field" value={profile.title || ""} onChange={e => updateProfile(ref, {title: e.target.value})} /></div>
                    <div><label className="label">Destination Subfolder</label><input className="field" value={profile.destination_subdir || ""} onChange={e => updateProfile(ref, {destination_subdir: e.target.value})} placeholder="Sources/My Channel" /></div>
                    <div><label className="label">Start Date</label><input className="field" type="date" value={profile.start_date || ""} onChange={e => updateProfile(ref, {start_date: e.target.value})} /></div>
                    <div><label className="label">Minimum Size MB</label><input className="field" value={profile.min_size_mb || ""} onChange={e => updateProfile(ref, {min_size_mb: e.target.value})} placeholder="optional" /></div>
                    <div><label className="label">Maximum Size MB</label><input className="field" value={profile.max_size_mb || ""} onChange={e => updateProfile(ref, {max_size_mb: e.target.value})} placeholder="optional" /></div>
                    <div><label className="label">Notes</label><input className="field" value={profile.notes || ""} onChange={e => updateProfile(ref, {notes: e.target.value})} /></div>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="panel">
            <div className="section-title">Available Chats, Groups, and Channels</div>
            {loading ? <div className="muted">Loading dialogs…</div> : (
              <div className="source-grid">
                {dialogs.map(dialog => {
                  const checked = sources.some(src => String(src).toLowerCase() === String(dialog.ref).toLowerCase() || String(src) === String(dialog.id));
                  return (
                    <label key={`${dialog.id}-${dialog.ref}`} className="source-option">
                      <input type="checkbox" checked={checked} onChange={() => toggleSource(dialog.ref, dialog.title)} />
                      <div>
                        <div>{dialog.title}</div>
                        <div className="source-kind">{dialog.kind} • {dialog.ref} • id {dialog.id}</div>
                      </div>
                    </label>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

      const [newTag, setNewTag] = useState("");
      const [newGroup, setNewGroup] = useState("Custom");
      const [loading, setLoading] = useState(true);

      async function load() {
        setLoading(true);
        try {
          const res = await api("/api/tags");
          setData(res);
        } catch (e) {
          setFlash(e.message);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => { load(); }, []);

      async function createTag() {
        if (!newTag.trim()) {
          setFlash("Enter a tag name");
          return;
        }
        try {
          await api("/api/tags", {
            method: "POST",
            body: JSON.stringify({ tag: newTag, group: newGroup })
          });
          setNewTag("");
          setNewGroup("Custom");
          await load();
          await refreshTags();
          setFlash("Custom tag created");
        } catch (e) {
          setFlash(e.message);
        }
      }

        try {
          const res = await api(`/api/tags/${encodeURIComponent(tag)}`, { method: "DELETE" });
          await load();
          await refreshTags();

          setFlash(e.message);

          <div className="panel">
            <div className="section-title">Tag System</div>

            <div className="form-grid">
              <div>
                <label className="label">New Custom Tag</label>

              <div>

                <input className="field" value={newGroup} onChange={e => setNewGroup(e.target.value)} placeholder="Custom" />

              {(data.system_tags || []).map(tag => <span key={tag} className="badge">{tag}</span>)}
            </div>
          </div>

          <div className="panel">
            <div className="section-title">Custom Tags</div>
            <table className="settings-table">
              <thead>
                <tr><th>Tag</th><th>Group</th><th>Actions</th></tr>

              <tbody>
                {(data.custom_tags || []).length ? (data.custom_tags || []).map(tag => (

    function AdminCleanupStudio({ setFlash, setAdminTab }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [deep, setDeep] = useState(false);
      const [busyAction, setBusyAction] = useState("");

      async function load(useDeep = deep) {
        setLoading(true);
        try {
          const res = await api(`/api/admin/cleanup/studio?deep=${useDeep ? "1" : "0"}`);
          setData(res);
        } catch (e) {
          setFlash(e.message);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => { load(false); }, []);

      async function runCleanupAction(action, label) {
        if (!action) return;
        if (action === "open_duplicates") { setAdminTab("duplicates"); return; }
        if (action === "open_review") { setAdminTab("review"); return; }
        setBusyAction(action);
        try {
          const res = await api("/api/admin/cleanup/action", {
            method: "POST",
            body: JSON.stringify({ action, limit: 100 })
          });
          setFlash(`${label || action} complete${res.job_id ? ` (job ${res.job_id})` : ""}`);
          await load(deep);
        } catch (e) {
          setFlash(e.message);
        } finally {
          setBusyAction("");
        }
      }

      function openStage(stage) {
        if (stage.admin_tab) {
          setAdminTab(stage.admin_tab);
          return;
        }
        if (stage.action) runCleanupAction(stage.action, stage.action_label);
      }

      const summary = data?.summary || {};
      const issues = data?.cleanup_plan?.issues || [];

      return (
        <div className="content">
          <div className="panel">
            <div className="title-row">
              <div>
                <div className="section-title">Guided Cleanup Studio</div>
                <div className="muted">A safer cleanup workflow: backup first, exact duplicates next, then manual review for uncertain items.</div>
              </div>
              <div className="controls-row">
                <label className="tag-check"><input type="checkbox" checked={deep} onChange={e => { setDeep(e.target.checked); load(e.target.checked); }} /> Deep scan</label>
                <button className="btn secondary" onClick={() => load(deep)}>Refresh</button>
              </div>
            </div>
            <div className="stats">
              <div className="stat">Cleanup issues: <strong>{summary.issues || 0}</strong></div>
              <div className="stat">Review items: <strong>{summary.review_items || 0}</strong></div>
              <div className="stat">Exact duplicate extras: <strong>{summary.exact_duplicate_delete_candidates || 0}</strong></div>
              <div className="stat">Possible duplicate groups: <strong>{summary.possible_duplicate_groups || 0}</strong></div>
            </div>
          </div>

          {loading ? <div className="muted">Loading cleanup studio…</div> : (
            <>
              <div className="panel">
                <div className="section-title">Recommended Workflow</div>
                {(data?.stages || []).length ? (data.stages || []).map(stage => (
                  <div className="duplicate-item" key={stage.id}>
                    <div style={{width:"100%"}}>
                      <div className="title-row">
                        <div>
                          <div className="file-title">{stage.title}</div>
                          <div className="muted">Risk: {stage.risk} • Count: {stage.count || 0}{stage.reclaimable_size_human ? ` • Reclaimable ${stage.reclaimable_size_human}` : ""}</div>
                        </div>
                        <button className="btn" disabled={busyAction === stage.action} onClick={() => openStage(stage)}>{busyAction === stage.action ? "Working…" : (stage.action_label || "Open")}</button>
                      </div>
                      <div className="path-small">{stage.description}</div>
                    </div>
                  </div>
                )) : <div className="empty-state"><div className="section-title">No cleanup workflow needed</div><div className="muted">TeleSaved did not find major cleanup issues.</div></div>}
              </div>

              <div className="panel">
                <div className="section-title">Cleanup Issues</div>
                {issues.length ? issues.map(issue => (
                  <div className="duplicate-item" key={issue.id}>
                    <div style={{width:"100%"}}>
                      <div className="title-row">
                        <div>
                          <div className="file-title">{issue.title}</div>
                          <div className="muted">Severity: {issue.severity} • Count: {issue.count || 0} • Reclaimable: {issue.reclaimable_size_human || "0 B"}</div>
                        </div>
                        {issue.action && <button className="action-btn" disabled={busyAction === issue.action} onClick={() => runCleanupAction(issue.action, issue.action_label)}>{busyAction === issue.action ? "Working…" : issue.action_label}</button>}
                      </div>
                      <div className="path-small">{issue.description}</div>
                      {(issue.samples || []).length ? <div className="tag-row" style={{marginTop:"8px"}}>{(issue.samples || []).slice(0,4).map(s => <span key={s.path} className="mini-badge">{s.filename || s.path}</span>)}</div> : null}
                    </div>
                  </div>
                )) : <div className="muted">No cleanup issues to show.</div>}
              </div>
            </>
          )}
        </div>
      );
    }

    function AdminReview({ setFlash, onDetail, tagsList }) {
      const [data, setData] = useState({ items: [], count: 0, skipped_count: 0, categories: {}, priorities: {} });
      const [loading, setLoading] = useState(true);
      const [includeSkipped, setIncludeSkipped] = useState(false);
      const [category, setCategory] = useState("");
      const [selected, setSelected] = useState({});
      const [tagText, setTagText] = useState("");
      const selectedPaths = Object.keys(selected).filter(path => selected[path]);

      async function load() {
        setLoading(true);
        try {
          const params = new URLSearchParams({ limit: "250", include_skipped: includeSkipped ? "1" : "0" });
          if (category) params.set("category", category);
          const res = await api(`/api/admin/review/studio?${params.toString()}`);
          setData(res);
          setSelected({});
        } catch (e) {
          setFlash(e.message);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => { load(); }, [includeSkipped, category]);

      function toggle(path) {
        setSelected(prev => ({ ...prev, [path]: !prev[path] }));
      }

      function selectAll() {
        const next = {};
        (data.items || []).forEach(item => { next[item.path] = true; });
        setSelected(next);
      }

      async function batch(action) {
        if (!selectedPaths.length) { setFlash("Select at least one review item first"); return; }
        const tags = tagText.split(",").map(t => t.trim()).filter(Boolean);
        if (["add_tags", "set_tags", "remove_tags"].includes(action) && !tags.length) { setFlash("Enter one or more tags first"); return; }
        if (action === "trash" && !confirm(`Move ${selectedPaths.length} selected review item(s) to Trash?`)) return;
        try {
          const res = await api("/api/admin/review/batch", {
            method: "POST",
            body: JSON.stringify({ paths: selectedPaths, action, tags })
          });
          setFlash(`Review batch ${action}: changed ${res.changed || 0}, failed ${res.failed_count || 0}`);
          await load();
        } catch (e) {
          setFlash(e.message);
        }
      }

      async function accept(path) {
        try {
          await api(`/api/review/${encodeURIComponent(path)}/accept`, { method: "POST" });
          setFlash("Accepted current tags and removed item from review queue");
          load();
        } catch (e) { setFlash(e.message); }
      }

      async function skip(path) {
        try {
          await api(`/api/review/${encodeURIComponent(path)}/skip`, { method: "POST" });
          setFlash("Skipped review item");
          load();
        } catch (e) { setFlash(e.message); }
      }

      async function unskip(path) {
        try {
          await api(`/api/review/${encodeURIComponent(path)}/unskip`, { method: "POST" });
          setFlash("Review item unskipped");
          load();
        } catch (e) { setFlash(e.message); }
      }

      async function trash(path) {
        if (!confirm(`Move this review item to Trash?\n\n${path}`)) return;
        try {
          await api(`/api/item/${encodeURIComponent(path)}`, { method: "DELETE" });
          setFlash("Video moved to Trash");
          load();
        } catch (e) { setFlash(e.message); }
      }

      const categories = Object.keys(data.categories || {}).sort();
      const priorities = data.priorities || {};

      return (
        <div className="content">
          <div className="panel">
            <div className="section-title">Review Studio</div>
            <div className="muted" style={{marginBottom:"12px"}}>Prioritized queue for uncertain tags, conflicts, rule flags, missing files, and AI metadata gaps.</div>
            <div className="stats">
              <div className="stat">Needs review: <strong>{data.count || 0}</strong></div>
              <div className="stat">Critical: <strong>{priorities.Critical || 0}</strong></div>
              <div className="stat">High: <strong>{priorities.High || 0}</strong></div>
              <div className="stat">Medium: <strong>{priorities.Medium || 0}</strong></div>
              <div className="stat">Skipped hidden: <strong>{data.skipped_count || 0}</strong></div>
            </div>
            <div className="form-grid">
              <label className="tag-check"><input type="checkbox" checked={includeSkipped} onChange={e => setIncludeSkipped(e.target.checked)} /> Include skipped items</label>
              <div>
                <label className="label">Category</label>
                <select className="field" value={category} onChange={e => setCategory(e.target.value)}>
                  <option value="">All categories</option>
                  {categories.map(cat => <option key={cat} value={cat}>{cat} ({data.categories[cat]})</option>)}
                </select>
              </div>
              <div>
                <label className="label">Batch tags, comma-separated</label>
                <input className="field" list="tag-options" value={tagText} onChange={e => setTagText(e.target.value)} placeholder="Example: Favorite, Needs Review" />
                <datalist id="tag-options">{(tagsList || []).map(t => <option key={t} value={t} />)}</datalist>
              </div>
            </div>
            <div className="controls-row">
              <button className="btn secondary" onClick={selectAll}>Select Visible</button>
              <button className="btn secondary" onClick={() => setSelected({})}>Clear Selection</button>
              <button className="btn" onClick={() => batch("accept")}>Accept Selected</button>
              <button className="btn" onClick={() => batch("add_tags")}>Add Tags</button>
              <button className="btn" onClick={() => batch("set_tags")}>Set Tags</button>
              <button className="btn secondary" onClick={() => batch("skip")}>Skip Selected</button>
              <button className="btn danger" onClick={() => batch("trash")}>Trash Selected</button>
            </div>
            <div className="muted">Selected: {selectedPaths.length}</div>
          </div>

          {loading ? <div className="muted">Loading review studio…</div> : (data.items || []).length ? (
            <div className="grid">
              {(data.items || []).map(item => (
                <div className="card" key={item.path}>
                  <div className="preview-wrap"><img className="preview-img" src={item.thumb_url} alt={item.filename} /></div>
                  <div className="card-body">
                    <div className="title-row">
                      <label className="tag-check"><input type="checkbox" checked={!!selected[item.path]} onChange={() => toggle(item.path)} /> Select</label>
                      <span className="mini-badge">{item.review_priority?.label || "Low"}</span>
                    </div>
                    <div className="file-title">{item.filename}</div>
                    <div className="path-small">{item.path}</div>
                    <div className="muted">{item.duration_human || "—"} • {item.size_human || "0 B"} • Best AI: {item.best_ai_tag || "—"} {item.best_ai_confidence ? `${item.best_ai_confidence}%` : ""}</div>
                    <div className="tag-row">{(item.tags || []).map(t => <span key={t} className="badge">{t}</span>)}</div>
                    <div className="panel" style={{marginTop:"12px", marginBottom:"0"}}>
                      <div className="muted">{item.review_category} • Suggested: {item.suggested_action}</div>
                      <div className="tag-row">{(item.review_reasons || []).map(r => <span key={r} className="mini-badge">{r}</span>)}</div>
                    </div>
                    <div className="action-row">
                      <button className="action-btn" onClick={() => onDetail(item.path)}>Details</button>
                      <button className="action-btn" onClick={() => accept(item.path)}>Accept</button>
                      {item.review_skipped ? <button className="action-btn" onClick={() => unskip(item.path)}>Unskip</button> : <button className="action-btn" onClick={() => skip(item.path)}>Skip</button>}
                      <button className="action-btn danger" onClick={() => trash(item.path)}>Trash</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div className="empty-state"><div className="section-title">Nothing needs review</div><div className="muted">No uncertain or conflicting videos were found for the current filters.</div></div>
          )}
        </div>
      );
    }


    function AdminTrash({ setFlash }) {
      const [data, setData] = useState({ items: [], count: 0, trash_directory: "" });
      const [loading, setLoading] = useState(true);

      async function load() {
        setLoading(true);
        try {
          const res = await api("/api/trash");
          setData(res);
        } catch (e) {
          setFlash(e.message);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => { load(); }, []);

      async function restoreItem(id, path) {
        if (!confirm(`Restore this video back to the library?\n\n${path}`)) return;
        try {
          await api(`/api/trash/${encodeURIComponent(id)}/restore`, { method: "POST" });
          setFlash("Video restored from Trash");
          load();
        } catch (e) {
          setFlash(e.message);
        }
      }

      async function deleteForever(id, path) {
        if (!confirm(`Permanently delete this trash item? This cannot be undone.\n\n${path}`)) return;
        try {
          await api(`/api/trash/${encodeURIComponent(id)}`, { method: "DELETE" });
          setFlash("Trash item permanently deleted");
          load();
        } catch (e) {
          setFlash(e.message);
        }
      }

      async function emptyAll() {
        if (!data.items.length) {
          setFlash("Trash is already empty");
          return;
        }
        if (!confirm(`Permanently delete all ${data.items.length} trash item(s)? This cannot be undone.`)) return;
        try {
          const res = await api("/api/trash/empty", { method: "POST" });
          setFlash(`Trash emptied: deleted=${res.deleted || 0}, failed=${res.failed?.length || 0}`);
          load();
        } catch (e) {
          setFlash(e.message);
        }
      }

      return (
        <div className="content">
          <div className="panel">
            <div className="section-title">Trash</div>
            <div className="muted" style={{marginBottom:"12px"}}>
              Deleted videos are moved here first. Restore brings the video and index metadata back into the library. Permanent delete removes the trash copy.
            </div>
            <div className="stats">
              <div className="stat">Trash items: <strong>{data.count || data.items.length}</strong></div>
              <div className="stat">Trash directory: <strong>{data.trash_directory || "—"}</strong></div>
            </div>
            <div className="controls-row">
              <button className="btn secondary" onClick={load}>Refresh</button>
              <button className="btn danger" onClick={emptyAll}>Empty Trash</button>
            </div>
          </div>

          <div className="panel">
            <div className="section-title">Trashed Videos</div>
            {loading ? <div className="muted">Loading…</div> : data.items.length ? (
              <table className="settings-table">
                <thead>
                  <tr>
                    <th>Filename</th>
                    <th>Original Path</th>
                    <th>Size</th>
                    <th>Trashed At</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {data.items.map(item => (
                    <tr key={item.trash_id}>
                      <td>{item.filename || item.trash_id}</td>
                      <td>{item.original_path}</td>
                      <td>{item.size_human || "0 B"}</td>
                      <td>{item.trashed_at || "—"}</td>
                      <td>
                        <div className="controls-row">
                          <button className="action-btn" onClick={() => restoreItem(item.trash_id, item.original_path)}>Restore</button>
                          <button className="action-btn danger" onClick={() => deleteForever(item.trash_id, item.original_path)}>Delete Forever</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            ) : (
              <div className="empty-state"><div className="muted">Trash is empty.</div></div>
            )}
          </div>
        </div>
      );
    }

    function AdminBackups({ setFlash }) {
      const [data, setData] = useState({ backups: [], backup_directory: "" });
      const [loading, setLoading] = useState(true);
      const [uploadFile, setUploadFile] = useState(null);

      async function load() {
        setLoading(true);
        try {
          const res = await api("/api/admin/backups");
          setData(res);
        } catch (e) {
          setFlash(e.message);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => { load(); }, []);

      async function createBackup() {
        try {
          const res = await api("/api/admin/backups", {
            method: "POST",
            body: JSON.stringify({ label: "manual" })
          });
          setFlash(`Backup created: ${res.backup?.filename || "complete"}`);
          load();
        } catch (e) {
          setFlash(e.message);
        }
      }

      async function restoreExisting(filename) {
        if (!confirm(`Restore metadata from this backup?\n\n${filename}\n\nA safety backup will be created first. Current metadata will be replaced.`)) return;
        try {
          await api("/api/admin/backups/restore", {
            method: "POST",
            body: JSON.stringify({ filename })
          });
          setFlash("Backup restored. Refresh the library after restart if needed.");
          load();
        } catch (e) {
          setFlash(e.message);
        }
      }

      async function restoreUploaded() {
        if (!uploadFile) {
          setFlash("Choose a backup ZIP first");
          return;
        }
        if (!confirm(`Restore uploaded backup?\n\n${uploadFile.name}\n\nA safety backup will be created first. Current metadata will be replaced.`)) return;
        try {
          const form = new FormData();
          form.append("backup", uploadFile);
          const res = await fetch("/api/admin/backups/restore", { method: "POST", body: form });
          const body = await res.json();
          if (!res.ok) throw new Error(body?.error || "Restore failed");
          setFlash("Uploaded backup restored. Refresh the library after restart if needed.");
          setUploadFile(null);
          load();
        } catch (e) {
          setFlash(e.message);
        }
      }

      return (
        <div className="content">
          <div className="panel">
            <div className="section-title">Backup & Restore</div>
            <div className="muted" style={{marginBottom:"12px"}}>
              Backups include TeleSaved metadata: index state, settings, sources, manual tag feedback, and the trash index. Media files are not included.
            </div>
            <div className="stats">
              <div className="stat">Backups: <strong>{data.backups?.length || 0}</strong></div>
              <div className="stat">Backup directory: <strong>{data.backup_directory || "—"}</strong></div>
            </div>
            <div className="controls-row">
              <button className="btn" onClick={createBackup}>Create Backup Now</button>
              <button className="btn secondary" onClick={load}>Refresh</button>
            </div>
          </div>

          <div className="panel">
            <div className="section-title">Restore Uploaded Backup</div>
            <div className="muted" style={{marginBottom:"12px"}}>Use this for a backup ZIP downloaded from another TeleSaved instance or copied off-server.</div>
            <input className="field" type="file" accept=".zip" onChange={e => setUploadFile(e.target.files?.[0] || null)} />
            <div className="controls-row">
              <button className="btn danger" onClick={restoreUploaded}>Restore Uploaded Backup</button>
            </div>
          </div>

          <div className="panel">
            <div className="section-title">Available Backups</div>
            {loading ? <div className="muted">Loading…</div> : data.backups?.length ? (
              <table className="settings-table">
                <thead>
                  <tr>
                    <th>Filename</th>
                    <th>Size</th>
                    <th>Created</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {data.backups.map(backup => (
                    <tr key={backup.filename}>
                      <td>{backup.filename}</td>
                      <td>{backup.size_human}</td>
                      <td>{backup.created_at}</td>
                      <td>
                        <div className="controls-row">
                          <a className="action-btn" href={backup.download_url} target="_blank" rel="noreferrer">Download</a>
                          <button className="action-btn danger" onClick={() => restoreExisting(backup.filename)}>Restore</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            ) : (
              <div className="empty-state"><div className="muted">No backups found. Create one now.</div></div>
            )}
          </div>
        </div>
      );
    }

    function AdminImportExport({ setFlash }) {
      const [file, setFile] = useState(null);
      const [dryRun, setDryRun] = useState(true);
      const [importTags, setImportTags] = useState(true);
      const [importNotes, setImportNotes] = useState(true);
      const [result, setResult] = useState(null);
      const [busy, setBusy] = useState(false);

      async function uploadImport() {
        if (!file) {
          setFlash("Choose a CSV or JSON export file first");
          return;
        }
        const form = new FormData();
        form.append("file", file);
        form.append("dry_run", dryRun ? "1" : "0");
        form.append("tags", importTags ? "1" : "0");
        form.append("notes", importNotes ? "1" : "0");
        try {
          setBusy(true);
          const res = await fetch("/api/import/library", { method: "POST", body: form });
          const body = await res.json();
          if (!res.ok) throw new Error(body.error || "Import failed");
          setResult(body);
          setFlash(dryRun ? "Import dry run complete" : "Import complete");
        } catch (e) {
          setFlash(e.message);
          setResult({ ok: false, error: e.message });
        } finally {
          setBusy(false);
        }
      }

      return (
        <div className="content">
          <div className="panel">
            <div className="section-title">Export Library Metadata</div>
            <div className="muted">Exports include metadata, tags, notes, source, duration, size, message IDs, and paths. Media files are not included.</div>
            <div className="controls-row">
              <a className="btn" href="/api/export/library?format=csv">Download CSV Export</a>
              <a className="btn secondary" href="/api/export/library?format=json">Download JSON Export</a>
            </div>
          </div>

          <div className="panel">
            <div className="section-title">Import Library Metadata</div>
            <div className="muted">Imports match rows by existing relative path. Tags are saved as manual overrides. Notes are written back to video metadata. Keep dry run enabled first.</div>
            <div className="form-grid">
              <div>
                <label className="label">CSV or JSON export file</label>
                <input className="field" type="file" accept=".csv,.json,text/csv,application/json" onChange={e => setFile(e.target.files?.[0] || null)} />
              </div>
              <label className="tag-check"><input type="checkbox" checked={dryRun} onChange={e => setDryRun(e.target.checked)} /> Dry run only</label>
              <label className="tag-check"><input type="checkbox" checked={importTags} onChange={e => setImportTags(e.target.checked)} /> Import tags</label>
              <label className="tag-check"><input type="checkbox" checked={importNotes} onChange={e => setImportNotes(e.target.checked)} /> Import notes</label>
            </div>
            <div className="controls-row">
              <button className="btn" onClick={uploadImport} disabled={busy}>{busy ? "Importing…" : "Import Metadata"}</button>
            </div>
            {result && <pre className="import-result">{JSON.stringify(result, null, 2)}</pre>}
          </div>
        </div>
      );
    }


    function AdminDuplicates({ setFlash, onDetail }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [deletingExact, setDeletingExact] = useState(false);
      const [showExact, setShowExact] = useState(true);
      const [showPossible, setShowPossible] = useState(true);
      const [minConfidence, setMinConfidence] = useState(0);

      async function load(scan=false) {
        setLoading(true);
        try {
          const res = await api(`/api/admin/duplicates/advanced?scan=${scan ? "1" : "0"}&limit=${scan ? "5000" : "1000"}`);
          setData(res);
          if (scan) setFlash(`Advanced duplicate scan complete. Exact groups: ${res.exact_group_count}, possible groups: ${res.possible_group_count}`);
        } catch (e) {
          setFlash(e.message);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => { load(false); }, []);

      async function trashPaths(paths, label="duplicate") {
        const clean = (paths || []).filter(Boolean);
        if (!clean.length) { setFlash("No duplicate paths selected"); return; }
        if (!confirm(`Move ${clean.length} ${label} video(s) to Trash?`)) return;
        try {
          const res = await api("/api/admin/duplicates/delete", {
            method: "POST",
            body: JSON.stringify({ paths: clean })
          });
          setFlash(`Moved ${res.deleted || 0} item(s) to Trash. Failed: ${res.failed?.length || 0}`);
          await load(false);
        } catch (e) { setFlash(e.message); }
      }

      async function trashAllExactDuplicates() {
        const exactCount = Number(data?.exact_group_count || 0);
        const candidateCount = Number(data?.recommended_exact_delete_count || 0);
        const msg = exactCount
          ? `Move ${candidateCount || "all"} byte-for-byte exact duplicate copy/copies from ${exactCount} group(s) to Trash? TeleSaved will keep one recommended keeper from each exact-hash group.`
          : "Run a full exact-duplicate cleanup now? TeleSaved will scan missing hashes, keep one file from each exact-hash group, and move the extra exact copies to Trash.";
        if (!confirm(msg)) return;
        setDeletingExact(true);
        try {
          const res = await api("/api/admin/duplicates/delete-exact", { method: "POST", body: JSON.stringify({ scan: true, limit: 1000000 }) });
          setFlash(`Exact duplicate cleanup complete: moved ${res.deleted || 0} item(s), processed ${res.groups_processed || 0} group(s), failed ${res.failed_count || 0}`);
          await load(false);
        } catch (e) { setFlash(e.message); }
        finally { setDeletingExact(false); }
      }

      function Group({ group }) {
        const items = group.items || [];
        const keeper = group.recommended_keeper;
        const deleteCandidates = group.recommended_delete_paths || [];
        return (
          <div className="panel">
            <div className="title-row">
              <div>
                <div className="section-title" style={{marginTop:0}}>{group.type === "exact_hash" ? "Exact Duplicate" : "Possible Duplicate"} • {group.count} items • {group.confidence_label} {group.confidence}%</div>
                <div className="muted">Total {group.total_size_human} • Reclaimable {group.reclaimable_size_human} • Decision: {group.decision}</div>
                <div className="tag-row" style={{marginTop:"8px"}}>{(group.signals || []).map(s => <span key={s} className="mini-badge">{s}</span>)}</div>
              </div>
              <div className="action-row">
                <button className="btn secondary" onClick={() => trashPaths(items.filter(i => i.path !== keeper).map(i => i.path), "non-keeper duplicate")}>Trash All But Keeper</button>
                {deleteCandidates.length ? <button className="btn danger" onClick={() => trashPaths(deleteCandidates, "recommended duplicate")}>Trash Recommended</button> : null}
              </div>
            </div>
            {(items || []).map(item => (
              <div className="duplicate-item" key={item.path}>
                <img src={item.thumb_url} onError={e => e.currentTarget.style.display = "none"} />
                <div>
                  <div className="file-title">{item.duplicate_keeper ? "KEEPER: " : ""}{item.filename}</div>
                  <div className="muted">{item.size_human} • {item.duration_human} • {item.source} • {item.duplicate_recommended_action}</div>
                  <div className="mono-small">{item.path}</div>
                </div>
                <div className="action-row">
                  <button className="action-btn" onClick={() => onDetail(item.path)}>Open</button>
                  {!item.duplicate_keeper && <button className="action-btn danger" onClick={() => trashPaths([item.path], "duplicate")}>Trash</button>}
                </div>
              </div>
            ))}
          </div>
        );
      }

      let groups = [];
      if (data) {
        if (showExact) groups = groups.concat(data.exact_groups || []);
        if (showPossible) groups = groups.concat(data.possible_groups || []);
      }
      groups = groups.filter(group => Number(group.confidence || 0) >= Number(minConfidence || 0));

      return (
        <div className="content">
          <div className="panel">
            <div className="section-title">Advanced Duplicate Intelligence</div>
            <div className="muted">Exact matches are byte-for-byte SHA256 duplicates. Possible matches are scored with size, duration, filename, source, and visual-embedding signals when available.</div>
            <div className="controls-row">
              <button className="btn" onClick={() => load(true)}>Deep Scan / Refresh Hashes</button>
              <button className="btn danger" disabled={deletingExact} onClick={trashAllExactDuplicates}>{deletingExact ? "Cleaning Exact Duplicates…" : "Delete All Exact Duplicates"}</button>
              <button className="btn secondary" onClick={() => load(false)}>Refresh</button>
            </div>
            <div className="form-grid" style={{marginTop:"12px"}}>
              <label className="tag-check"><input type="checkbox" checked={showExact} onChange={e => setShowExact(e.target.checked)} /> Show exact groups</label>
              <label className="tag-check"><input type="checkbox" checked={showPossible} onChange={e => setShowPossible(e.target.checked)} /> Show possible groups</label>
              <div>
                <label className="label">Minimum confidence: {minConfidence}%</label>
                <input className="field" type="range" min="0" max="100" step="5" value={minConfidence} onChange={e => setMinConfidence(e.target.value)} />
              </div>
            </div>
          </div>

          {loading ? <div className="muted">Loading duplicate intelligence…</div> : (
            <>
              <div className="stats">

                <div className="stat">Very high confidence: <strong>{data?.confidence_summary?.very_high || 0}</strong></div>

    function AdminRules({ setFlash, tagsList }) {
      const emptyForm = {
        name: "",
        description: "",
        enabled: true,
        auto_apply: false,
        stop_after_match: false,
        source_contains: "",
        path_contains: "",
        tags_all: "",
        tags_any: "",
        missing_tags: "",
        duration_min: "",
        duration_max: "",
        size_min_mb: "",
        size_max_mb: "",
        exists: "",
        add_tags: "",
        remove_tags: "",
        set_tags: "",
        append_note: "",
        flag_review: false,
      };
      const [rules, setRules] = useState([]);
      const [form, setForm] = useState(emptyForm);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [runLimit, setRunLimit] = useState("0");

      function splitTags(text) {
        return String(text || "").split(/[,;|\n]+/).map(x => x.trim()).filter(Boolean);
      }

      function payloadFromForm() {
        return {
          name: form.name,
          description: form.description,
          enabled: !!form.enabled,
          auto_apply: !!form.auto_apply,
          stop_after_match: !!form.stop_after_match,
          conditions: {
            source_contains: form.source_contains,
            path_contains: form.path_contains,
            tags_all: splitTags(form.tags_all),
            tags_any: splitTags(form.tags_any),
            missing_tags: splitTags(form.missing_tags),
            duration_min: form.duration_min,
            duration_max: form.duration_max,
            size_min_mb: form.size_min_mb,
            size_max_mb: form.size_max_mb,
            exists: form.exists,
          },
          actions: {
            add_tags: splitTags(form.add_tags),
            remove_tags: splitTags(form.remove_tags),
            set_tags: splitTags(form.set_tags),
            append_note: form.append_note,
            flag_review: !!form.flag_review,
          }
        };
      }

      async function load() {
        try {
          const res = await api("/api/rules");
          setRules(res.rules || []);
        } catch (e) {
          setFlash(e.message);
        }
      }

      useEffect(() => { load(); }, []);

      async function createRule() {
        if (!form.name.trim()) {
          setFlash("Rule name is required");
          return;
        }
        setLoading(true);
        try {
          await api("/api/rules", { method: "POST", body: JSON.stringify(payloadFromForm()) });
          setForm(emptyForm);
          setFlash("Rule created");
          await load();
        } catch (e) {
          setFlash(e.message);
        } finally {
          setLoading(false);
        }
      }

      async function updateRule(rule, patch) {
        setLoading(true);
        try {
          await api(`/api/rules/${encodeURIComponent(rule.id)}`, { method: "PUT", body: JSON.stringify({ ...rule, ...patch }) });
          setFlash("Rule updated");
          await load();
        } catch (e) {
          setFlash(e.message);
        } finally {
          setLoading(false);
        }
      }

      async function deleteRule(rule) {
        if (!confirm(`Delete rule "${rule.name}"?`)) return;
        setLoading(true);
        try {
          await api(`/api/rules/${encodeURIComponent(rule.id)}`, { method: "DELETE" });
          setFlash("Rule deleted");
          await load();
        } catch (e) {
          setFlash(e.message);
        } finally {
          setLoading(false);
        }
      }

      async function runRules(rule, dryRun = true) {
        setLoading(true);
        setResult(null);
        try {
          const url = rule ? `/api/rules/${encodeURIComponent(rule.id)}/run` : "/api/rules/run";
          const res = await api(url, {
            method: "POST",
            body: JSON.stringify({ dry_run: dryRun, limit: Number(runLimit || 0) })
          });
          setResult(res);
          setFlash(dryRun ? "Rules dry run complete" : "Rules applied");
          await load();
        } catch (e) {
          setFlash(e.message);
        } finally {
          setLoading(false);
        }
      }

      function fillExample(kind) {
        if (kind === "movie") {
          setForm({ ...emptyForm, name: "Mark long videos as Movie", duration_min: "300", missing_tags: "Movie", add_tags: "Movie", auto_apply: true });
        } else if (kind === "source") {
          setForm({ ...emptyForm, name: "Flag large source files", source_contains: "@channel", size_min_mb: "1024", flag_review: true, append_note: "Large file from watched source; review storage impact." });
        } else {
          setForm({ ...emptyForm, name: "Short clips cleanup", duration_max: "60", missing_tags: "Clip", add_tags: "Clip", auto_apply: true });
        }
      }

      return (
        <div className="content">
          <div className="panel">
            <div className="section-title">Rules Engine</div>
            <div className="muted" style={{marginBottom:"12px"}}>
              Create local automation rules that match videos by source, path, tags, duration, size, and file status. Rules can add/remove/set tags, append notes, and flag videos for the Review Queue. Use dry run before applying changes.
            </div>
            <div className="stats">
              <div className="stat">Rules: <strong>{rules.length}</strong></div>
              <div className="stat">Enabled: <strong>{rules.filter(r => r.enabled).length}</strong></div>
              <div className="stat">Auto-apply: <strong>{rules.filter(r => r.auto_apply).length}</strong></div>
            </div>
            <div className="controls-row">
              <button className="btn secondary" onClick={() => fillExample("movie")}>Example: Long Movie</button>
              <button className="btn secondary" onClick={() => fillExample("clip")}>Example: Short Clip</button>
              <button className="btn secondary" onClick={() => fillExample("source")}>Example: Source Review</button>
            </div>
          </div>

          <div className="panel">
            <div className="section-title">Create Rule</div>
            <div className="form-grid">
              <div><label className="label">Rule Name</label><input className="field" value={form.name} onChange={e => setForm({...form, name:e.target.value})} placeholder="Example: Mark long videos as Movie" /></div>
              <div><label className="label">Description</label><input className="field" value={form.description} onChange={e => setForm({...form, description:e.target.value})} placeholder="Optional note about this rule" /></div>
              <label className="tag-check"><input type="checkbox" checked={form.enabled} onChange={e => setForm({...form, enabled:e.target.checked})} /> Enabled</label>
              <label className="tag-check"><input type="checkbox" checked={form.auto_apply} onChange={e => setForm({...form, auto_apply:e.target.checked})} /> Auto-apply to new downloads</label>
              <label className="tag-check"><input type="checkbox" checked={form.stop_after_match} onChange={e => setForm({...form, stop_after_match:e.target.checked})} /> Stop after this rule matches</label>
            </div>

            <div className="section-title">Conditions</div>
            <div className="form-grid">
              <div><label className="label">Source contains</label><input className="field" value={form.source_contains} onChange={e => setForm({...form, source_contains:e.target.value})} placeholder="Saved Messages, @channel, etc." /></div>
              <div><label className="label">Path contains</label><input className="field" value={form.path_contains} onChange={e => setForm({...form, path_contains:e.target.value})} /></div>
              <div><label className="label">Tags ALL</label><input className="field" value={form.tags_all} onChange={e => setForm({...form, tags_all:e.target.value})} placeholder="Movie, Gay" /></div>
              <div><label className="label">Tags ANY</label><input className="field" value={form.tags_any} onChange={e => setForm({...form, tags_any:e.target.value})} placeholder="Clip, Movie" /></div>
              <div><label className="label">Missing Tags</label><input className="field" value={form.missing_tags} onChange={e => setForm({...form, missing_tags:e.target.value})} placeholder="Adults, Movie" /></div>
              <div><label className="label">Duration min seconds</label><input className="field" value={form.duration_min} onChange={e => setForm({...form, duration_min:e.target.value})} /></div>
              <div><label className="label">Duration max seconds</label><input className="field" value={form.duration_max} onChange={e => setForm({...form, duration_max:e.target.value})} /></div>
              <div><label className="label">Size min MB</label><input className="field" value={form.size_min_mb} onChange={e => setForm({...form, size_min_mb:e.target.value})} /></div>
              <div><label className="label">Size max MB</label><input className="field" value={form.size_max_mb} onChange={e => setForm({...form, size_max_mb:e.target.value})} /></div>
              <div><label className="label">File status</label><select className="select" value={form.exists} onChange={e => setForm({...form, exists:e.target.value})}><option value="">Any</option><option value="true">Exists</option><option value="false">Missing</option></select></div>
            </div>

            <div className="section-title">Actions</div>
            <div className="form-grid">
              <div><label className="label">Add Tags</label><input className="field" value={form.add_tags} onChange={e => setForm({...form, add_tags:e.target.value})} placeholder="Movie, Clip" /></div>
              <div><label className="label">Remove Tags</label><input className="field" value={form.remove_tags} onChange={e => setForm({...form, remove_tags:e.target.value})} /></div>
              <div><label className="label">Set Tags</label><input className="field" value={form.set_tags} onChange={e => setForm({...form, set_tags:e.target.value})} placeholder="Overrides add/remove when filled" /></div>
              <div><label className="label">Append Note</label><input className="field" value={form.append_note} onChange={e => setForm({...form, append_note:e.target.value})} /></div>
              <label className="tag-check"><input type="checkbox" checked={form.flag_review} onChange={e => setForm({...form, flag_review:e.target.checked})} /> Flag for Review Queue</label>
            </div>
            <div className="controls-row">
              <button className="btn" onClick={createRule} disabled={loading}>{loading ? "Working…" : "Create Rule"}</button>
              <button className="btn secondary" onClick={() => setForm(emptyForm)}>Clear</button>
            </div>
          </div>

          <div className="panel">
            <div className="section-title">Run Rules</div>
            <div className="form-grid">
              <div><label className="label">Limit checked videos, 0 = all</label><input className="field" value={runLimit} onChange={e => setRunLimit(e.target.value)} /></div>
            </div>
            <div className="controls-row">
              <button className="btn secondary" onClick={() => runRules(null, true)} disabled={loading}>Dry Run All Enabled Rules</button>
              <button className="btn" onClick={() => runRules(null, false)} disabled={loading}>Apply All Enabled Rules</button>
            </div>
          </div>

          {result && (
            <div className="panel">
              <div className="section-title">Last Rule Run</div>
              <div className="stats">
                <div className="stat">Mode: <strong>{result.dry_run ? "Dry Run" : "Apply"}</strong></div>
                <div className="stat">Matched: <strong>{result.matched}</strong></div>
                <div className="stat">Changed: <strong>{result.changed}</strong></div>
                <div className="stat">Errors: <strong>{result.errors?.length || 0}</strong></div>
              </div>
              <div className="log-box">{(result.samples || []).slice(0, 12).map(s => `${s.rule}: ${s.path} — ${s.actions?.join(", ") || "matched"}`).join("\n") || "No sample matches."}</div>
            </div>
          )}

          <div className="section-title">Saved Rules</div>
          {rules.length ? rules.map(rule => (
            <div className="panel" key={rule.id}>
              <div className="title-row">
                <div>
                  <div className="file-title">{rule.name}</div>
                  <div className="muted">{rule.description || rule.id}</div>
                </div>
                <div className="tag-row">
                  <span className={`metric ${rule.enabled ? "" : "override"}`}>{rule.enabled ? "Enabled" : "Disabled"}</span>
                  {rule.auto_apply && <span className="metric">Auto-apply</span>}
                </div>
              </div>
              <div className="tag-row">
                {(rule.condition_summary || []).map((x, i) => <span key={`c${i}`} className="mini-badge">IF {x}</span>)}
              </div>
              <div className="tag-row">
                {(rule.action_summary || []).map((x, i) => <span key={`a${i}`} className="badge">THEN {x}</span>)}
              </div>
              <div className="metric-row">
                <span className="mini-badge">Last run: {rule.last_run_at || "Never"}</span>
                <span className="mini-badge">Last matched: {rule.last_match_count || 0}</span>
                <span className="mini-badge">Last changed: {rule.last_change_count || 0}</span>
              </div>
              <div className="controls-row">
                <button className="action-btn" onClick={() => updateRule(rule, {enabled: !rule.enabled})}>{rule.enabled ? "Disable" : "Enable"}</button>
                <button className="action-btn" onClick={() => updateRule(rule, {auto_apply: !rule.auto_apply})}>{rule.auto_apply ? "Disable Auto" : "Enable Auto"}</button>
                <button className="action-btn" onClick={() => runRules(rule, true)}>Dry Run</button>
                <button className="action-btn" onClick={() => runRules(rule, false)}>Apply</button>
                <button className="action-btn danger" onClick={() => deleteRule(rule)}>Delete</button>
              </div>
            </div>
          )) : <div className="empty-state"><div className="muted">No rules created yet.</div></div>}
        </div>
      );
    }

      const canManageSourceAcl = !!data?.can_manage_source_acl;
      const groupNames = groupOptionsFromAuthAdmin(data);
      const users = data?.users || [];
      const sources = data?.sources || [];
      const permissions = data?.permissions_catalog || [];

      async function load() {
        try {
          const res = await api("/api/auth/admin");
          setData(res);
          if (res.ldap?.settings) {
            setLdapSettings(res.ldap.settings);
            setLdapMappingText(JSON.stringify(res.ldap.settings.group_mappings || {}, null, 2));
          }
          setError("");
        } catch (e) {
          setError(e.message || String(e));
        }
      }

      useEffect(() => { load(); }, []);

      function toggleInList(list, value) {
        return list.includes(value) ? list.filter(x => x !== value) : [...list, value];
      }

      function ldapPatch(patch) {
        setLdapSettings({...ldapSettings, ...patch});
      }

      function parseLdapMappings() {
        try {
          const parsed = JSON.parse(ldapMappingText || "{}");
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("Mapping must be a JSON object");
          return parsed;
        } catch (e) {
          throw new Error("LDAP group mappings must be valid JSON, for example: {\"Domain Admins\":[\"Admin\"]}");
        }
      }

      async function saveLdapSettings(e) {
        e.preventDefault();
        try {
          const settings = {...ldapSettings, group_mappings: parseLdapMappings()};
          if (!settings.bind_password) delete settings.bind_password;
          const res = await api("/api/auth/ldap/settings", { method:"PUT", body: JSON.stringify({settings}) });
          setLdapSettings(res.settings);
          setLdapMappingText(JSON.stringify(res.settings.group_mappings || {}, null, 2));
          setFlash("LDAP settings saved.");
          load();
        } catch (e) { setFlash(e.message || String(e)); }
      }

      async function testLdapSettings() {
        try {
          const settings = {...ldapSettings, group_mappings: parseLdapMappings()};
          if (!settings.bind_password) delete settings.bind_password;
          const res = await api("/api/auth/ldap/test", { method:"POST", body: JSON.stringify({settings, test_username:ldapTestUsername, test_password:ldapTestPassword}) });
          setLdapTestResult(res.result || res);
          setFlash("LDAP test succeeded.");
        } catch (e) {
          setLdapTestResult({ok:false, error:e.message || String(e)});
          setFlash(e.message || String(e));
        }
      }

      async function syncLdapUser() {
        if (!ldapTestUsername) { setFlash("Enter an LDAP username first."); return; }
        try {
          const res = await api("/api/auth/ldap/sync-user", { method:"POST", body: JSON.stringify({username:ldapTestUsername}) });
          setFlash(`LDAP user synced: ${res.user?.username || ldapTestUsername}`);
          load();
        } catch (e) { setFlash(e.message || String(e)); }
      }

      async function createUser(e) {
        e.preventDefault();
        try {
          await api("/api/auth/users", { method:"POST", body: JSON.stringify(newUser) });
          setFlash("User created.");
          setNewUser({ username:"", display_name:"", password:"", groups:["Users"] });
          load();
        } catch (e) { setFlash(e.message || String(e)); }
      }

      async function updateUser(user, patch) {
        try {
          await api(`/api/auth/users/${encodeURIComponent(user.id)}`, { method:"PUT", body: JSON.stringify(patch) });
          setFlash("User updated.");
          load();
        } catch (e) { setFlash(e.message || String(e)); }
      }

      async function deleteUser(user) {
        if (!confirm(`Delete user ${user.username}?`)) return;
        try {
          await api(`/api/auth/users/${encodeURIComponent(user.id)}`, { method:"DELETE" });
          setFlash("User deleted.");
          load();
        } catch (e) { setFlash(e.message || String(e)); }
      }

      async function createGroup(e) {
        e.preventDefault();
        try {
          await api("/api/auth/groups", { method:"POST", body: JSON.stringify(newGroup) });
          setFlash("Group created.");
          setNewGroup({ name:"", description:"", permissions:["library.view"] });
          load();
        } catch (e) { setFlash(e.message || String(e)); }
      }

      async function saveGroup(name, group) {
        try {
          await api(`/api/auth/groups/${encodeURIComponent(name)}`, { method:"PUT", body: JSON.stringify(group) });
          setFlash("Group updated.");
          load();
        } catch (e) { setFlash(e.message || String(e)); }
      }

      async function deleteGroup(name) {
        if (!confirm(`Delete group ${name}?`)) return;
        try {
          await api(`/api/auth/groups/${encodeURIComponent(name)}`, { method:"DELETE" });
          setFlash("Group deleted.");
          load();
        } catch (e) { setFlash(e.message || String(e)); }
      }

      async function saveAcl(e) {
        e.preventDefault();
        try {
          await api("/api/auth/source-access", { method:"POST", body: JSON.stringify({ target_type: aclTargetType, target: aclTarget, source_refs: aclRefs }) });
          setFlash("Source access updated.");
          load();
        } catch (e) { setFlash(e.message || String(e)); }
      }

      function currentAclFor(type, target) {
        const access = data?.source_access || {users:{}, groups:{}};
        return type === "user" ? (access.users?.[target] || []) : (access.groups?.[target] || []);
      }

      useEffect(() => {
        if (!data) return;
        setAclRefs(currentAclFor(aclTargetType, aclTarget));
      }, [data, aclTargetType, aclTarget]);

      if (error) return <div className="content"><div className="flash error">{error}</div></div>;
      if (!data) return <div className="content"><div className="panel">Loading user management…</div></div>;

      return (
        <div className="content">
          <div className="panel">
            <div className="section-title">User Management, Groups, Source Access, and LDAP — Phase 2</div>
            <p className="muted">Local users and groups remain active. LDAP can now be enabled as an identity backend with LDAP group-to-TeleSaved group mapping. Keep at least one local Admin account as emergency access.</p>
            <div className="stats-grid">
              <div className="stat">Users: <strong>{users.length}</strong></div>
              <div className="stat">Groups: <strong>{groupNames.length}</strong></div>
              <div className="stat">Sources: <strong>{sources.length}</strong></div>
              <div className="stat">Backends: <strong>Local + LDAP / SSO later</strong></div>
            </div>
          </div>

          {canManageSecurity && ldapSettings && (
            <div className="panel">
              <div className="section-title">LDAP Identity Backend</div>
              <p className="muted">Enable LDAP login, search users, map LDAP groups into TeleSaved groups, and keep local Admin as emergency access.</p>
              {ldapSettings.ldap3_available === false && <div className="flash error">ldap3 is not installed in the TeleSaved Python environment. Run <code>sudo /opt/telesaved/install-ldap-deps.sh</code>, then restart TeleSaved.</div>}
              <form onSubmit={saveLdapSettings}>
                <div className="settings-grid">
                  <label className="check-row"><input type="checkbox" checked={!!ldapSettings.enabled} onChange={e => ldapPatch({enabled:e.target.checked})} /> Enable LDAP login</label>
                  <label className="check-row"><input type="checkbox" checked={!!ldapSettings.start_tls} onChange={e => ldapPatch({start_tls:e.target.checked})} /> StartTLS</label>
                  <label className="check-row"><input type="checkbox" checked={ldapSettings.auto_create_users !== false} onChange={e => ldapPatch({auto_create_users:e.target.checked})} /> Auto-create/sync LDAP users</label>
                  <label className="check-row"><input type="checkbox" checked={ldapSettings.sync_groups_on_login !== false} onChange={e => ldapPatch({sync_groups_on_login:e.target.checked})} /> Sync mapped groups on login</label>
                  <div><label>LDAP Server URI</label><input className="input" value={ldapSettings.server_uri || ""} onChange={e => ldapPatch({server_uri:e.target.value})} placeholder="ldap://dc.example.org:389 or ldaps://dc.example.org:636" /></div>
                  <div><label>Timeout Seconds</label><input className="input" type="number" value={ldapSettings.timeout_seconds || 8} onChange={e => ldapPatch({timeout_seconds:Number(e.target.value || 8)})} /></div>
                  <div><label>Bind DN</label><input className="input" value={ldapSettings.bind_dn || ""} onChange={e => ldapPatch({bind_dn:e.target.value})} placeholder="cn=readonly,dc=example,dc=org" /></div>
                  <div><label>Bind Password {ldapSettings.bind_password_set ? <span className="muted">(stored)</span> : null}</label><input className="input" type="password" value={ldapSettings.bind_password || ""} onChange={e => ldapPatch({bind_password:e.target.value})} placeholder={ldapSettings.bind_password_set ? "Leave blank to keep existing password" : "Bind password"} /></div>
                  <div><label>User Search Base</label><input className="input" value={ldapSettings.user_search_base || ""} onChange={e => ldapPatch({user_search_base:e.target.value})} placeholder="ou=People,dc=example,dc=org" /></div>
                  <div><label>User Filter</label><input className="input" value={ldapSettings.user_filter || ""} onChange={e => ldapPatch({user_filter:e.target.value})} placeholder="(uid={username})" /></div>
                  <div><label>Username Attribute</label><input className="input" value={ldapSettings.username_attribute || "uid"} onChange={e => ldapPatch({username_attribute:e.target.value})} /></div>
                  <div><label>Display Name Attribute</label><input className="input" value={ldapSettings.display_name_attribute || "cn"} onChange={e => ldapPatch({display_name_attribute:e.target.value})} /></div>
                  <div><label>Email Attribute</label><input className="input" value={ldapSettings.email_attribute || "mail"} onChange={e => ldapPatch({email_attribute:e.target.value})} /></div>
                  <div><label>memberOf Attribute</label><input className="input" value={ldapSettings.memberof_attribute || "memberOf"} onChange={e => ldapPatch({memberof_attribute:e.target.value})} /></div>
                  <div><label>Group Search Base</label><input className="input" value={ldapSettings.group_search_base || ""} onChange={e => ldapPatch({group_search_base:e.target.value})} placeholder="ou=Groups,dc=example,dc=org" /></div>
                  <div><label>Group Filter</label><input className="input" value={ldapSettings.group_filter || ""} onChange={e => ldapPatch({group_filter:e.target.value})} placeholder="(|(member={user_dn})(memberUid={username}))" /></div>
                  <div><label>Group Name Attribute</label><input className="input" value={ldapSettings.group_name_attribute || "cn"} onChange={e => ldapPatch({group_name_attribute:e.target.value})} /></div>
                  <div>
                    <label>Default TeleSaved Groups for LDAP Users</label>
                    {groupNames.map(name => (
                      <label key={name} className="check-row"><input type="checkbox" checked={(ldapSettings.default_groups || []).includes(name)} onChange={() => ldapPatch({default_groups:toggleInList(ldapSettings.default_groups || [], name)})} /> {name}</label>
                    ))}
                  </div>
                </div>
                <label>LDAP Group → TeleSaved Group Mappings JSON</label>
                <textarea className="input" rows="7" value={ldapMappingText} onChange={e => setLdapMappingText(e.target.value)} placeholder={'{"Domain Admins":["Admin"], "Media Managers":["Manager"], "Video Users":["Users"]}'} />
                <div className="controls-row" style={{marginTop:"12px"}}>
                  <button className="primary" type="submit">Save LDAP Settings</button>
                  <button className="secondary" type="button" onClick={testLdapSettings}>Test LDAP</button>
                </div>
              </form>
              <div className="settings-grid" style={{marginTop:"16px"}}>
                <div><label>Test / Sync Username</label><input className="input" value={ldapTestUsername} onChange={e => setLdapTestUsername(e.target.value)} placeholder="LDAP username" /></div>
                <div><label>Test Password optional</label><input className="input" type="password" value={ldapTestPassword} onChange={e => setLdapTestPassword(e.target.value)} placeholder="Only needed to verify user bind" /></div>
              </div>
              <div className="controls-row" style={{marginTop:"12px"}}>
                <button className="secondary" onClick={testLdapSettings}>Test With Username</button>
                <button className="secondary" onClick={syncLdapUser}>Sync LDAP User</button>
              </div>
              {ldapTestResult && <pre className="log-box" style={{maxHeight:"260px", marginTop:"12px"}}>{JSON.stringify(ldapTestResult, null, 2)}</pre>}
            </div>
          )}

          {canManageSecurity && (
            <div className="panel">
              <div className="section-title">Create Local User</div>
              <form onSubmit={createUser} className="settings-grid">
                <input className="input" placeholder="username" value={newUser.username} onChange={e => setNewUser({...newUser, username:e.target.value})} />
                <input className="input" placeholder="display name" value={newUser.display_name} onChange={e => setNewUser({...newUser, display_name:e.target.value})} />
                <input className="input" placeholder="temporary password" type="password" value={newUser.password} onChange={e => setNewUser({...newUser, password:e.target.value})} />
                <div>
                  {groupNames.map(name => (
                    <label key={name} className="check-row"><input type="checkbox" checked={(newUser.groups || []).includes(name)} onChange={() => setNewUser({...newUser, groups:toggleInList(newUser.groups || [], name)})} /> {name}</label>
                  ))}
                </div>
                <button className="primary" type="submit">Create User</button>
              </form>
            </div>
          )}

          <div className="panel">
            <div className="section-title">Users</div>
            <table className="settings-table">
              <thead><tr><th>User</th><th>Backend</th><th>Groups</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead>
              <tbody>
                {users.map(user => (
                  <tr key={user.id}>
                    <td><strong>{user.username}</strong><br/><span className="muted">{user.display_name}</span></td>
                    <td>{user.auth_backend || "local"}</td>
                    <td>{(user.groups || []).join(", ")}</td>
                    <td>{user.disabled ? "Disabled" : "Active"}</td>
                    <td>{user.last_login || "—"}</td>
                    <td>
                      {canManageSecurity ? <>
                        <button className="secondary" onClick={() => {
                          const value = prompt("Comma-separated groups", (user.groups || []).join(", "));
                          if (value != null) updateUser(user, {groups:value.split(",").map(v => v.trim()).filter(Boolean)});
                        }}>Groups</button>{" "}
                        {(user.auth_backend || "local") === "local" && <><button className="secondary" onClick={() => {
                          const value = prompt("New password, minimum 8 characters");
                          if (value) updateUser(user, {password:value});
                        }}>Password</button>{" "}</>}
                        <button className="secondary" onClick={() => updateUser(user, {disabled:!user.disabled})}>{user.disabled ? "Enable" : "Disable"}</button>{" "}
                        <button className="danger" onClick={() => deleteUser(user)}>Delete</button>
                      </> : <span className="muted">Security management restricted</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {canManageSecurity && (
            <div className="panel">
              <div className="section-title">Groups and Permissions</div>
              <form onSubmit={createGroup} className="settings-grid" style={{marginBottom:"16px"}}>
                <input className="input" placeholder="new group name" value={newGroup.name} onChange={e => setNewGroup({...newGroup, name:e.target.value})} />
                <input className="input" placeholder="description" value={newGroup.description} onChange={e => setNewGroup({...newGroup, description:e.target.value})} />
                <div>
                  {permissions.filter(p => p.id !== "*").map(perm => (
                    <label key={perm.id} className="check-row"><input type="checkbox" checked={(newGroup.permissions || []).includes(perm.id)} onChange={() => setNewGroup({...newGroup, permissions:toggleInList(newGroup.permissions || [], perm.id)})} /> {perm.id}</label>
                  ))}
                </div>
                <button className="primary" type="submit">Create Group</button>
              </form>
              <table className="settings-table">
                <thead><tr><th>Group</th><th>Description</th><th>Permissions</th><th>Actions</th></tr></thead>
                <tbody>
                  {groupNames.map(name => {
                    const group = data.groups[name];
                    return (
                      <tr key={name}>
                        <td><strong>{name}</strong>{group.system ? <div className="muted">System group</div> : null}</td>
                        <td>{group.description}</td>
                        <td>{(group.permissions || []).join(", ")}</td>
                        <td>
                          <button className="secondary" onClick={() => {
                            const value = prompt("Comma-separated permissions", (group.permissions || []).join(", "));
                            if (value != null) saveGroup(name, {...group, permissions:value.split(",").map(v => v.trim()).filter(Boolean)});
                          }}>Permissions</button>{" "}
                          {!group.system && <button className="danger" onClick={() => deleteGroup(name)}>Delete</button>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {canManageSourceAcl && (
            <div className="panel">
              <div className="section-title">Source Access Control</div>
              <p className="muted">Grant access to sources by user or by group. Admin and Manager currently default to all sources. Users see only sources explicitly granted to their user or group.</p>
              <form onSubmit={saveAcl}>
                <div className="settings-grid">
                  <select className="input" value={aclTargetType} onChange={e => { setAclTargetType(e.target.value); setAclTarget(e.target.value === "user" ? (users[0]?.id || "") : (groupNames[0] || "")); }}>
                    <option value="group">Group</option>
                    <option value="user">User</option>
                  </select>
                  <select className="input" value={aclTarget} onChange={e => setAclTarget(e.target.value)}>
                    {(aclTargetType === "user" ? users.map(u => u.id) : groupNames).map(value => <option key={value} value={value}>{value}</option>)}
                  </select>
                </div>
                <div style={{marginTop:"12px"}}>
                  <label className="check-row"><input type="checkbox" checked={aclRefs.includes("*")} onChange={() => setAclRefs(toggleInList(aclRefs, "*"))} /> All sources</label>
                  {sources.map(src => (
                    <label key={src.ref} className="check-row"><input type="checkbox" disabled={aclRefs.includes("*")} checked={aclRefs.includes(src.ref)} onChange={() => setAclRefs(toggleInList(aclRefs, src.ref))} /> {src.title} <span className="muted">({src.ref})</span></label>
                  ))}
                </div>
                <button className="primary" type="submit" style={{marginTop:"12px"}}>Save Source Access</button>
              </form>
            </div>
          )}
        </div>
      );
    }
