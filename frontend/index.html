    function AdminLogs() {
      const [logs, setLogs] = useState([]);
      const [feedback, setFeedback] = useState([]);

      async function load() {
        const [logData, feedbackData] = await Promise.all([
          api("/api/admin/logs"),
          api("/api/admin/feedback")
        ]);
        setLogs(logData.lines || []);
        setFeedback(feedbackData.history || []);
      }

      useEffect(() => { load(); }, []);
      useInterval(load, 10000);

      return (
        <div className="content">
          <div className="panel">
            <div className="section-title">Recent Manual Tag Corrections</div>
            <table className="settings-table">
              <thead>
                <tr>
                  <th>File</th>
                  <th>Model Tags</th>
                  <th>Manual Tags</th>
                  <th>Edited At</th>
                </tr>
              </thead>
              <tbody>
                {feedback.length ? feedback.map((item, idx) => (
                  <tr key={idx}>
                    <td>{item.path}</td>
                    <td>{(item.original_tags || []).join(", ")}</td>
                    <td>{(item.new_tags || []).join(", ")}</td>
                    <td>{item.edited_at}</td>
                  </tr>
                )) : (
                  <tr><td colSpan="4" className="muted">No manual tag edits yet.</td></tr>
                )}
              </tbody>
            </table>
          </div>

          <div className="panel">
            <div className="section-title">Recent Log Activity</div>
            <pre className="log-box">{logs.join("")}</pre>
          </div>
        </div>
      );
    }

    function App() {
      const [view, setView] = useState("library");
      const [adminTab, setAdminTab] = useState("dashboard");
      const [flash, setFlash] = useState("");
      const [tagsList, setTagsList] = useState([]);
      const [detailPath, setDetailPath] = useState("");
      const [commandOpen, setCommandOpen] = useState(false);
      const [auth, setAuth] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);

      async function refreshAuth() {
        try {
          const res = await api("/api/auth/status");
          setAuth(res);
          return res;
        } catch (e) {
          setAuth({ authenticated:false, bootstrap_required:false, error:e.message || String(e), permissions:[] });
          return null;
        } finally {
          setAuthLoading(false);
        }
      }

      async function logout() {
        try { await api("/api/auth/logout", { method:"POST", body: JSON.stringify({}) }); } catch (e) {}
        setAuth({ authenticated:false, bootstrap_required:false, permissions:[] });
      }

      async function refreshTags() {
        try {
          const res = await api("/api/tags");
          setTagsList(res.tags || []);
          return res;
        } catch (e) {
          return null;
        }
      }

      useEffect(() => {
        refreshAuth().then(res => { if (res?.authenticated) refreshTags(); });
      }, []);

      useEffect(() => {
        if (!flash) return;
        const id = setTimeout(() => setFlash(""), 4000);
        return () => clearTimeout(id);
      }, [flash]);

      useEffect(() => {
        function onKeyDown(e) {
          const tag = (e.target?.tagName || "").toLowerCase();
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            setCommandOpen(true);
            return;
          }
          if (e.key === "/" && !["input", "textarea", "select"].includes(tag)) {
            e.preventDefault();
            setCommandOpen(true);
          }
        }
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, []);

      function openDetail(path) {
        setDetailPath(path);
        setView("detail");
      }

      function backToLibrary() {
        setView("library");
      }

      if (authLoading) {
        return <div className="app" style={{display:"grid", placeItems:"center", padding:"24px"}}><div className="panel">Loading TeleSaved security…</div></div>;
      }

      if (auth?.bootstrap_required) {
        return <BootstrapPage onAuthenticated={(res) => { setAuth(res); refreshTags(); }} />;
      }

      if (!auth?.authenticated) {
        return <LoginPage onAuthenticated={(res) => { setAuth(res); refreshTags(); }} />;
      }

      if (view === "admin" && !canAdmin(auth)) {
        setTimeout(() => setView("library"), 0);
      }

      return (
        <div className="app">
          <Sidebar
            view={view}
            setView={setView}
            adminTab={adminTab}
            setAdminTab={setAdminTab}
            onCommand={() => setCommandOpen(true)}
            auth={auth}
            onLogout={logout}
          />

          <div className="main">
            {view === "library" && <LibraryPage flash={flash} setFlash={setFlash} tagsList={tagsList} onDetail={openDetail} />}
            {view === "librarian" && <LibrarianPage flash={flash} setFlash={setFlash} tagsList={tagsList} onDetail={openDetail} />}
            {view === "detail" && <VideoDetailPage path={detailPath} tagsList={tagsList} onBack={backToLibrary} onNavigate={openDetail} setFlash={setFlash} flash={flash} />}
            {view === "downloads" && <DownloadsPage flash={flash} setFlash={setFlash} />}
            {view === "admin" && adminTab === "dashboard" && <AdminDashboard flash={flash} />}
            {view === "admin" && adminTab === "health" && <AdminHealth flash={flash} />}
            {view === "admin" && adminTab === "jobs" && <AdminJobs setFlash={setFlash} />}
            {view === "admin" && adminTab === "system" && <AdminSystem setFlash={setFlash} />}
            {view === "admin" && adminTab === "scoring" && <AdminScoring setFlash={setFlash} />}
            {view === "admin" && adminTab === "tags" && <AdminTags setFlash={setFlash} refreshTags={refreshTags} />}
            {view === "admin" && adminTab === "libraryMap" && <AdminLibraryMap setFlash={setFlash} />}
            {view === "admin" && adminTab === "favorites" && <AdminPersonalLibrary setFlash={setFlash} onDetail={openDetail} />}
            {view === "admin" && adminTab === "cleanupStudio" && <AdminCleanupStudio setFlash={setFlash} setAdminTab={setAdminTab} />}
            {view === "admin" && adminTab === "review" && <AdminReview setFlash={setFlash} onDetail={openDetail} tagsList={tagsList} />}
            {view === "admin" && adminTab === "duplicates" && <AdminDuplicates setFlash={setFlash} onDetail={openDetail} />}
            {view === "admin" && adminTab === "collections" && <AdminCollections setFlash={setFlash} tagsList={tagsList} />}
            {view === "admin" && adminTab === "sources" && <AdminSources setFlash={setFlash} />}
            {view === "admin" && adminTab === "sourceIntel" && <AdminSourceIntelligence setFlash={setFlash} />}
            {view === "admin" && adminTab === "rules" && <AdminRules setFlash={setFlash} tagsList={tagsList} />}
            {view === "admin" && adminTab === "trash" && <AdminTrash setFlash={setFlash} />}
            {view === "admin" && adminTab === "backups" && <AdminBackups setFlash={setFlash} />}
            {view === "admin" && adminTab === "importExport" && <AdminImportExport setFlash={setFlash} />}
            {view === "admin" && adminTab === "audio" && <AdminAudio setFlash={setFlash} onDetail={openDetail} />}
            {view === "admin" && adminTab === "access" && <AdminUserManagement setFlash={setFlash} auth={auth} />}
            {view === "admin" && adminTab === "about" && <AdminAbout />}
            {view === "admin" && adminTab === "logs" && <AdminLogs />}
          </div>

          <CommandPalette
            open={commandOpen}
            onClose={() => setCommandOpen(false)}
            setView={setView}
            setAdminTab={setAdminTab}
            openDetail={openDetail}
            setFlash={setFlash}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
