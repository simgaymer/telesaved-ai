<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TeleSaved AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script crossorigin
    src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script crossorigin
    src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script
    src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"
    integrity="sha384-bdF7m0Y1IFKt9Q6xC8X9qkXn0OBriQWKyWwZKYsN05zF6P/g9OakjjL0G2Sd4pB4"
    crossorigin="anonymous"></script>
  <style>
    :root {
      --bg:       #0d1117;
      --panel:    #161b22;
      --panel-2:  #1c2430;
      --panel-3:  #21293a;
      --border:   rgba(255,255,255,0.07);
      --border-2: rgba(255,255,255,0.12);
      --text:     #e6edf3;
      --muted:    #7d8fa3;
      --accent:   #5b8dee;
      --accent-2: #4a7de0;
      --accent-glow: rgba(91,141,238,0.18);
      --success:  #52c17a;
      --danger:   #e05c5c;
      --warning:  #e09b2e;
      --chip:     #1c2430;
      --shadow:   0 8px 32px rgba(0,0,0,0.36);
      --shadow-sm:0 2px 8px rgba(0,0,0,0.28);
      --radius:   10px;
      --radius-lg:14px;
      --sidebar-w:240px;
    }

    * { box-sizing: border-box; }

    html, body, #root {
      margin: 0; padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* ── LAYOUT ── */
    .app { min-height: 100vh; display: flex; }

    .sidebar {
      width: var(--sidebar-w);
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      position: sticky; top: 0;
      height: 100vh;
      display: flex; flex-direction: column;
      overflow-y: auto; flex-shrink: 0;
    }

    .main { flex: 1; min-width: 0; overflow-x: hidden; }

    /* ── BRAND ── */
    .brand {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px; padding: 0 4px;
    }
    .brand-badge {
      width: 36px; height: 36px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px; flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(91,141,238,0.35);
    }
    .brand-name { font-weight: 800; font-size: 15px; line-height: 1.2; }
    .brand-ver  { font-size: 11px; color: var(--muted); }

    /* ── NAV ── */
    .nav-section { margin-bottom: 6px; }
    .nav-section-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted);
      padding: 8px 8px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 10px; border-radius: var(--radius);
      cursor: pointer; border: none;
      background: transparent; color: var(--muted);
      font-size: 13.5px; font-weight: 500;
      width: 100%; text-align: left;
      transition: background 0.13s, color 0.13s;
    }
    .nav-item:hover { background: var(--panel-2); color: var(--text); }
    .nav-item.active {
      background: var(--accent-glow);
      color: var(--accent);
      font-weight: 600;
    }
    .nav-item .ni { font-size: 15px; flex-shrink: 0; width: 18px; text-align: center; }

    .nav-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

    .user-block {
      margin-top: auto; padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .user-name { font-size: 12px; color: var(--muted); padding: 0 4px 6px; word-break: break-all; }
    .user-name strong { color: var(--text); }

    /* ── TOPBAR ── */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(13,17,23,0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .topbar-search {
      flex: 1; display: flex; gap: 8px; align-items: center; min-width: 0;
    }
    .topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* ── FORM ELEMENTS ── */
    .field, .select, .textarea {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field, .select {
      height: 38px; padding: 0 12px; min-width: 0;
    }
    .field:focus, .select:focus { border-color: var(--accent); }
    .textarea {
      padding: 9px 12px; width: 100%; resize: vertical;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; height: 38px; padding: 0 16px;
      border-radius: var(--radius); border: none;
      font-size: 13.5px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }
    .btn-secondary {
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--border-2); }
    .btn-danger {
      background: rgba(224,92,92,0.14); color: #f4a0a0;
      border: 1px solid rgba(224,92,92,0.3);
    }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid transparent;
    }
    .btn-ghost:hover { background: var(--panel-2); color: var(--text); }
    .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
    .btn-icon {
      width: 34px; height: 34px; padding: 0; border-radius: var(--radius);
      background: var(--panel-2); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; font-size: 14px;
    }
    .btn-icon:hover { color: var(--text); border-color: var(--border-2); }

    /* ── CONTENT ── */
    .content { padding: 20px; }
    .page-title {
      font-size: 18px; font-weight: 700; margin: 0 0 4px;
    }
    .page-sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

    /* ── CARDS / PANELS ── */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }
    .panel-title {
      font-size: 14px; font-weight: 700;
      margin: 0 0 14px;
    }

    /* ── VIDEO GRID ── */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .vcard {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s;
      position: relative;
    }
    .vcard:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(91,141,238,0.18);
    }
    .vcard.selected { border-color: var(--accent); background: var(--accent-glow); }
    .vcard-thumb {
      aspect-ratio: 16/9; width: 100%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #0a0e14;
      position: relative;
    }
    .vcard-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .vcard-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 55%);
      opacity: 0; transition: opacity 0.15s;
      display: flex; align-items: flex-end; padding: 10px;
    }
    .vcard:hover .vcard-overlay { opacity: 1; }
    .vcard-overlay-actions { display: flex; gap: 6px; }
    .vcard-body { padding: 12px; }
    .vcard-title {
      font-weight: 600; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .vcard-meta {
      font-size: 11.5px; color: var(--muted);
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .vcard-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .vcard-select {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent);
    }
    .missing-badge {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      background: rgba(224,92,92,0.85); color: #fff;
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 999px;
    }

    /* ── CHIP / BADGE ── */
    .chip {
      display: inline-flex; align-items: center;
      padding: 3px 9px; border-radius: 999px;
      font-size: 11.5px; font-weight: 500;
      background: rgba(91,141,238,0.12);
      color: #8bb4f8;
      border: 1px solid rgba(91,141,238,0.2);
      white-space: nowrap;
    }
    .chip-green {
      background: rgba(82,193,122,0.12);
      color: #7ddda6;
      border-color: rgba(82,193,122,0.2);
    }
    .chip-muted {
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      border-color: var(--border);
    }
    .chip-orange {
      background: rgba(224,155,46,0.12);
      color: #f0bc6e;
      border-color: rgba(224,155,46,0.2);
    }
    .chip-red {
      background: rgba(224,92,92,0.12);
      color: #f4a0a0;
      border-color: rgba(224,92,92,0.25);
    }

    /* ── LIST VIEW TABLE ── */
    .list-wrap {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: auto;
      box-shadow: var(--shadow-sm);
    }
    .lib-table { width: 100%; min-width: 960px; border-collapse: collapse; }
    .lib-table th, .lib-table td {
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      text-align: left; vertical-align: middle;
    }
    .lib-table th {
      color: var(--muted); font-size: 11.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      background: rgba(255,255,255,0.02); white-space: nowrap;
      user-select: none;
    }
    .lib-table th.sortable { cursor: pointer; }
    .lib-table th.sortable:hover { color: var(--text); }
    .lib-table th .sort-arrow { margin-left: 4px; font-size: 10px; }
    .lib-table tr:last-child td { border-bottom: none; }
    .lib-table tr:hover td { background: rgba(255,255,255,0.02); }
    .list-thumb {
      width: 88px; height: 52px; border-radius: 7px;
      object-fit: cover; background: #0a0e14; flex-shrink: 0;
    }
    .list-file-cell { display: flex; gap: 10px; align-items: center; min-width: 320px; }
    .list-fname { font-weight: 600; font-size: 13px; }
    .list-path { color: var(--muted); font-size: 11px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 400px; }

    /* ── ITEM DETAIL ── */
    .detail-hero {
      display: flex; gap: 24px; margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .detail-thumb-wrap {
      flex: 0 0 340px; max-width: 100%;
      aspect-ratio: 16/9; background: #0a0e14;
      border-radius: var(--radius-lg); overflow: hidden;
      border: 1px solid var(--border);
    }
    .detail-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .detail-info { flex: 1; min-width: 220px; }
    .detail-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; word-break: break-word; }
    .detail-meta-row {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
    }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .detail-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--muted); cursor: pointer;
      padding: 6px 0; margin-bottom: 12px;
    }
    .detail-back:hover { color: var(--text); }

    /* ── TABS ── */
    .tabs { display: flex; gap: 2px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 9px 16px; border: none; background: transparent;
      color: var(--muted); font-size: 13.5px; font-weight: 500;
      cursor: pointer; border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: color 0.13s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

    /* ── TRANSCRIPT ── */
    .transcript-seg {
      display: flex; gap: 12px; padding: 8px 0;
      border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .transcript-seg:last-child { border-bottom: none; }
    .transcript-ts { color: var(--accent); font-variant-numeric: tabular-nums; flex-shrink: 0; width: 52px; font-size: 12px; }
    .transcript-text { flex: 1; line-height: 1.55; }

    /* ── SCORE BAR ── */
    .score-bar-row { margin-bottom: 10px; }
    .score-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .score-bar-track {
      height: 6px; background: rgba(255,255,255,0.06);
      border-radius: 999px; overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 999px;
    }

    /* ── FRAMES STRIP ── */
    .frames-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
    .frame-thumb {
      flex-shrink: 0; width: 120px; height: 72px;
      border-radius: 7px; object-fit: cover; background: #0a0e14;
      border: 1px solid var(--border);
    }

    /* ── SIMILAR STRIP ── */
    .similar-strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
    .sim-card {
      flex-shrink: 0; width: 160px; cursor: pointer;
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; background: var(--panel-2);
      transition: border-color 0.13s;
    }
    .sim-card:hover { border-color: var(--accent); }
    .sim-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
    .sim-card-name {
      padding: 6px 8px; font-size: 11.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--muted);
    }

    /* ── STATS ROW ── */
    .stats-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .stat-box {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px;
      font-size: 13px; color: var(--muted);
    }
    .stat-box strong { color: var(--text); }

    /* ── FLASH / ALERTS ── */
    .flash {
      background: rgba(82,193,122,0.1); border: 1px solid rgba(82,193,122,0.2);
      color: #8de8b3; padding: 10px 14px; border-radius: var(--radius);
      margin-bottom: 14px; font-size: 13px;
    }
    .flash-error {
      background: rgba(224,92,92,0.1); border: 1px solid rgba(224,92,92,0.25);
      color: #f4a0a0;
    }

    /* ── PAGINATION ── */
    .pagination { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
    .page-btn {
      min-width: 36px; height: 34px; padding: 0 10px;
      border-radius: var(--radius); background: var(--panel-2);
      border: 1px solid var(--border); color: var(--muted);
      font-size: 12.5px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .page-btn:hover { border-color: var(--border-2); color: var(--text); }
    .page-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent; color: #fff;
    }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin-bottom: 16px;
    }

    /* ── SEARCH ADVANCED PANEL ── */
    .adv-panel {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px;
      margin-top: 10px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px;
    }
    .adv-field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    /* ── TAG EDITOR ── */
    .tag-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px;
    }
    .tag-check {
      display: flex; align-items: center; gap: 8px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 9px 12px;
      cursor: pointer; font-size: 13px;
    }
    .tag-check:hover { border-color: var(--border-2); }
    .tag-check input { accent-color: var(--accent); flex-shrink: 0; }

    /* ── PROGRESS ── */
    .progress-track {
      width: 100%; height: 8px; background: rgba(255,255,255,0.06);
      border-radius: 999px; overflow: hidden; border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    /* ── STORAGE BAR ── */
    .storage-bar {
      width: 100%; height: 12px; background: rgba(255,255,255,0.06);
      border-radius: 999px; overflow: hidden; border: 1px solid var(--border); margin: 10px 0;
    }
    .storage-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .storage-fill.low { background: linear-gradient(90deg, var(--danger), #c04040); }

    /* ── STATUS PILL ── */
    .pill { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
    .pill-green  { background: rgba(82,193,122,0.12); color: #7ddda6; border: 1px solid rgba(82,193,122,0.2); }
    .pill-red    { background: rgba(224,92,92,0.12);  color: #f4a0a0; border: 1px solid rgba(224,92,92,0.25); }
    .pill-orange { background: rgba(224,155,46,0.12); color: #f0bc6e; border: 1px solid rgba(224,155,46,0.2); }
    .pill-muted  { background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid var(--border); }

    /* ── SETTINGS TABLE ── */
    .stbl { width: 100%; border-collapse: collapse; }
    .stbl th, .stbl td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    .stbl th { color: var(--muted); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .stbl tr:last-child td { border-bottom: none; }

    /* ── FORM ── */
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .form-col { flex: 1; min-width: 180px; }
    .form-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; display: block; }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center; padding: 60px 20px; color: var(--muted);
    }
    .empty-icon { font-size: 42px; margin-bottom: 14px; }
    .empty-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }

    /* ── LOG BOX ── */
    .log-box {
      background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11.5px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-all;
      max-height: 400px; overflow-y: auto;
    }

    /* ── CONNECTIVITY BANNER ── */
    .conn-banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: rgba(224,155,46,0.92); color: #fff;
      padding: 7px 16px; font-size: 13px; text-align: center;
      pointer-events: none;
    }
    .conn-toast {
      position: fixed; bottom: 22px; right: 22px; z-index: 9999;
      background: rgba(82,193,122,0.95); color: #fff;
      padding: 10px 18px; border-radius: var(--radius-lg);
      font-size: 13px; pointer-events: none;
      box-shadow: var(--shadow);
    }

    /* ── WIZARD ── */
    .wizard-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; padding: 24px;
    }
    .wizard-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius-lg); width: 100%; max-width: 460px;
      padding: 36px 32px 28px; box-shadow: var(--shadow);
    }
    .wizard-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .wizard-logo-badge {
      width: 38px; height: 38px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; font-size: 18px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .wizard-logo-text { font-size: 17px; font-weight: 700; }
    .wizard-steps { display: flex; gap: 5px; margin-bottom: 22px; }
    .wizard-dot {
      flex: 1; height: 3px; border-radius: 2px;
      background: var(--panel-2); transition: background 0.2s;
    }
    .wizard-dot.active { background: var(--accent); }
    .wizard-dot.done   { background: var(--success); }
    .wizard-step-label { font-size: 11px; color: var(--muted); margin-bottom: 16px; }
    .wizard-title { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
    .wizard-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
    .wizard-disclaimer {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
      font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 22px;
    }
    .wizard-field { margin-bottom: 14px; }
    .wizard-field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
    .wizard-field input {
      width: 100%; background: var(--panel-2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 13.5px;
      padding: 8px 11px; outline: none; box-sizing: border-box; transition: border-color 0.15s;
    }
    .wizard-field input:focus { border-color: var(--accent); }
    .wizard-field input.err { border-color: var(--danger); }
    .wizard-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .wizard-ok   { font-size: 11px; color: var(--success); margin-top: 4px; }
    .wizard-err-box {
      background: rgba(224,92,92,0.1); border: 1px solid rgba(224,92,92,0.25);
      color: #f4a0a0; border-radius: var(--radius); padding: 9px 12px;
      font-size: 12.5px; margin-bottom: 12px;
    }
    .wizard-actions { display: flex; gap: 10px; margin-top: 22px; justify-content: space-between; }
    .wizard-btn {
      padding: 9px 20px; border-radius: var(--radius); font-size: 13.5px;
      font-weight: 600; border: none; cursor: pointer; transition: opacity 0.15s;
    }
    .wizard-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .wizard-btn-primary  { background: var(--accent); color: #fff; }
    .wizard-btn-secondary {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    }
    .wizard-validation-row {
      display: flex; align-items: center; gap: 8px; min-height: 22px;
      margin-bottom: 12px;
    }
    .wizard-spinner {
      width: 14px; height: 14px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .wizard-check { color: var(--success); }
    .wizard-restart-note {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px; font-size: 12.5px;
      color: var(--muted); line-height: 1.7; margin-top: 16px;
    }
    .wizard-restart-note strong { color: var(--text); }
    .wizard-restart-note code {
      background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px;
      font-family: monospace;
    }

    /* ── LOGIN PAGE ── */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: var(--bg); padding: 20px;
    }
    .login-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 36px 32px;
      width: 100%; max-width: 360px; box-shadow: var(--shadow);
    }

    /* ── AUDIO PANEL ── */
    .audio-status-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; flex-wrap: wrap;
    }
    .audio-waveform-placeholder {
      height: 42px; background: var(--panel-2);
      border-radius: var(--radius); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 12px; margin-bottom: 12px;
    }

    /* ── JOBS PAGE ── */
    .job-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 10px;
    }
    .job-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .job-title { font-weight: 600; font-size: 13.5px; }
    .job-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .job-actions { display: flex; gap: 6px; }

    /* ── REVIEW STUDIO ── */
    .review-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 14px;
      display: flex; gap: 0; flex-wrap: wrap;
    }
    .review-thumb {
      width: 220px; flex-shrink: 0;
      aspect-ratio: 16/9; object-fit: cover; background: #0a0e14;
    }
    .review-body { flex: 1; padding: 14px; min-width: 200px; }

    /* ── TAG MANAGEMENT ── */
    .suggestion-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .suggestion-row:last-child { border-bottom: none; }

    /* ── USER MANAGEMENT ── */
    .user-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .user-row:last-child { border-bottom: none; }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: #fff;
    }

    /* ── TRASH ── */
    .trash-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .trash-thumb {
      width: 72px; height: 44px; border-radius: 6px; object-fit: cover;
      background: #0a0e14; flex-shrink: 0;
    }

    /* ── AI LIBRARIAN ── */
    .librarian-panel {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: 420px; max-width: 100vw;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      z-index: 200;
      box-shadow: -8px 0 32px rgba(0,0,0,0.36);
    }
    .librarian-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .librarian-body {
      flex: 1; overflow-y: auto; padding: 16px 18px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .librarian-input-row {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      display: flex; gap: 8px;
      flex-shrink: 0;
    }
    .librarian-bubble {
      background: var(--panel-2);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .librarian-bubble.user {
      background: var(--accent-glow);
      color: var(--accent);
      margin-left: 32px;
    }
    .librarian-bubble.assistant {
      margin-right: 32px;
    }
    .librarian-reasons {
      font-size: 11px; color: var(--muted);
      margin-top: 6px;
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .librarian-chip {
      background: var(--panel-3); color: var(--muted);
      border-radius: 4px; padding: 2px 6px;
      font-size: 11px;
    }
    .librarian-results {
      display: flex; flex-direction: column; gap: 6px; margin-top: 8px;
    }
    .librarian-result-row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 10px; border-radius: var(--radius);
      background: var(--panel-3);
      cursor: pointer; transition: background 0.12s;
    }
    .librarian-result-row:hover { background: var(--panel-2); }
    .librarian-result-thumb {
      width: 56px; height: 34px; border-radius: 5px;
      object-fit: cover; flex-shrink: 0; background: #0a0e14;
    }
    .librarian-suggestion {
      font-size: 12px; color: var(--accent);
      cursor: pointer; padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }
    .librarian-suggestion:hover { text-decoration: underline; }
    .librarian-overlay-bg {
      position: fixed; inset: 0; z-index: 199;
      background: rgba(0,0,0,0.3);
    }

    /* ── TRANSCRIPT ── */
    .transcript-seg {
      display: flex; gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
      font-size: 13px; line-height: 1.6;
    }
    .transcript-ts {
      font-size: 11px; color: var(--accent);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0; width: 52px;
      padding-top: 2px; cursor: default;
    }
    .transcript-speaker {
      font-size: 11px; font-weight: 700;
      color: var(--muted); flex-shrink: 0;
      width: 70px; padding-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .transcript-text {
      flex: 1; min-width: 0;
    }
    .transcript-text.editing {
      background: var(--panel-2);
      border: 1px solid var(--accent);
      border-radius: 4px; padding: 2px 6px;
      outline: none; width: 100%;
      font-family: inherit; font-size: 13px;
      color: var(--text);
    }
    .speaker-badge {
      display: inline-block;
      font-size: 10px; font-weight: 700;
      padding: 1px 6px; border-radius: 20px;
      margin-right: 4px;
    }
    .speaker-1 { background: rgba(91,141,238,0.18); color: #5b8dee; }
    .speaker-2 { background: rgba(82,193,122,0.18); color: #52c17a; }
    .speaker-3 { background: rgba(224,155,46,0.18); color: #e09b2e; }
    .speaker-4 { background: rgba(224,92,92,0.18);  color: #e05c5c; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 860px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; }
      .user-block { margin-top: 0; padding-top: 0; border-top: none; }
      .video-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
      .detail-hero { flex-direction: column; }
      .detail-thumb-wrap { flex: none; width: 100%; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useEffect, useRef, useState, useCallback } = React;

  /* ─────────── helpers ─────────── */
  class AuthError extends Error { constructor(msg) { super(msg); this.name = "AuthError"; } }

  async function api(url, opts = {}) {
    const res = await fetch(url, {
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      ...opts,
    });
    const ct = res.headers.get("content-type") || "";
    const body = ct.includes("application/json") ? await res.json() : await res.text();
    if (res.status === 401) throw new AuthError(body?.error || "Session expired");
    if (!res.ok) throw new Error(body?.error || body || "Request failed");
    return body;
  }

  function useInterval(cb, delay) {
    const saved = useRef(cb);
    useEffect(() => { saved.current = cb; }, [cb]);
    useEffect(() => {
      if (delay == null) return;
      const id = setInterval(() => saved.current(), delay);
      return () => clearInterval(id);
    }, [delay]);
  }

  function fmt(seconds) {
    if (!seconds) return "—";
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    return h ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
             : `${m}:${String(s).padStart(2,"0")}`;
  }

  const LEGAL = "TeleSaved AI is a personal media archiving tool. Compliance with all applicable laws governing the downloading, possession, and use of content — including copyright, obscenity, and any other relevant statutes in your jurisdiction — is solely the responsibility of the user.";

  /* ─────────── Sidebar ─────────── */
  function Sidebar({ view, setView, adminTab, setAdminTab, currentUser, onLogout }) {
    const nav = (v, icon, label) => (
      <button className={`nav-item ${view === v ? "active" : ""}`} onClick={() => setView(v)}>
        <span className="ni">{icon}</span>{label}
      </button>
    );
    const adm = (t, icon, label) => (
      <button
        className={`nav-item ${view === "admin" && adminTab === t ? "active" : ""}`}
        onClick={() => { setView("admin"); setAdminTab(t); }}
        style={{paddingLeft:22}}
      >
        <span className="ni">{icon}</span>{label}
      </button>
    );
    return (
      <div className="sidebar">
        <div className="brand">
          <div className="brand-badge">T</div>
          <div><div className="brand-name">TeleSaved AI</div><div className="brand-ver">v4.5.4</div></div>
        </div>

        <div className="nav-section">
          <div className="nav-section-label">Library</div>
          {nav("library",    "📚", "Library")}
          {nav("watch-later","🕐", "Watch Later")}
          {nav("personal",   "⭐", "Personal")}
          {nav("collections","📂", "Collections")}
          {nav("trash",      "🗑", "Trash")}
        </div>

        <div className="nav-section">
          <div className="nav-section-label">Downloads</div>
          {nav("downloads",  "⬇", "Downloads")}
          {nav("jobs",       "⚙", "Jobs")}
        </div>

        <div className="nav-section">
          <div className="nav-section-label">Administration</div>
          {adm("dashboard",  "📊", "Dashboard")}
          {adm("sources",    "📡", "Sources")}
          {adm("review",     "🔍", "Review Studio")}
          {adm("tags",       "🏷", "Tag Management")}
          {adm("scoring",    "🎯", "Scoring")}
          {adm("users",      "👥", "Users & Groups")}
          {adm("system",     "🔧", "System")}
          {adm("logs",       "📋", "Logs")}
        </div>

        <div className="user-block">
          {currentUser && <div className="user-name">Signed in as <strong>{currentUser}</strong></div>}
          <button className="nav-item" style={{color:"var(--danger)"}} onClick={onLogout}>
            <span className="ni">🚪</span>Sign Out
          </button>
        </div>
      </div>
    );
  }

  /* ─────────── Pagination ─────────── */
  function Pagination({ page, totalPages, onChange }) {
    if (totalPages <= 1) return null;
    const btns = [];
    if (page > 1) { btns.push(<button key="p" className="page-btn" onClick={() => onChange(page-1)}>‹</button>); }
    const lo = Math.max(1, page-2), hi = Math.min(totalPages, page+2);
    for (let p=lo; p<=hi; p++) btns.push(
      <button key={p} className={`page-btn ${p===page?"active":""}`} onClick={() => onChange(p)}>{p}</button>
    );
    if (page < totalPages) { btns.push(<button key="n" className="page-btn" onClick={() => onChange(page+1)}>›</button>); }
    return <div className="pagination">{btns}</div>;
  }

  /* ─────────── VideoCard ─────────── */
  function VideoCard({ item, onOpen, selected, onSelect, onDelete }) {
    const [src, setSrc] = useState(item.thumb_url);
    return (
      <div className={`vcard ${selected ? "selected" : ""}`} onClick={() => onOpen(item.path)}>
        <input className="vcard-select" type="checkbox" checked={selected}
          onClick={e => e.stopPropagation()}
          onChange={() => onSelect(item.path)} />
        {!item.exists && <span className="missing-badge">Missing</span>}
        <div className="vcard-thumb">
          <img src={src} loading="lazy" alt={item.filename}
            onMouseEnter={() => setSrc(item.preview_url)}
            onMouseLeave={() => setSrc(item.thumb_url)}
            onError={() => setSrc("")} />
          <div className="vcard-overlay">
            <div className="vcard-overlay-actions" onClick={e => e.stopPropagation()}>
              <a className="btn btn-secondary btn-sm" href={item.file_url} target="_blank" rel="noreferrer">▶ Open</a>
              <button className="btn btn-danger btn-sm" onClick={() => onDelete(item.path)}>Delete</button>
            </div>
          </div>
        </div>
        <div className="vcard-body">
          <div className="vcard-title" title={item.filename}>{item.filename}</div>
          <div className="vcard-meta">
            <span>{item.size_human || "—"}</span>
            <span>{fmt(item.duration)}</span>
            {item.audio_language && <span>🗣 {item.audio_language}</span>}
            {item.display_tags && item.display_tags.length > 0 && <span>{item.display_tags[0]}</span>}
          </div>
          <div className="vcard-tags">
            {(item.tags || []).slice(0,4).map(t => <span key={t} className="chip">{t}</span>)}
          </div>
        </div>
      </div>
    );
  }

  /* ─────────── ListRow ─────────── */
  function ListRow({ item, onOpen, selected, onSelect, onDelete }) {
    const [src, setSrc] = useState(item.thumb_url);
    return (
      <tr onClick={() => onOpen(item.path)} style={{cursor:"pointer"}}>
        <td onClick={e => e.stopPropagation()}>
          <input type="checkbox" checked={selected} onChange={() => onSelect(item.path)} style={{accentColor:"var(--accent)"}} />
        </td>
        <td>
          <div className="list-file-cell">
            <img className="list-thumb" src={src} loading="lazy" alt={item.filename}
              onMouseEnter={() => setSrc(item.preview_url)}
              onMouseLeave={() => setSrc(item.thumb_url)}
              onError={() => setSrc("")} />
            <div>
              <div className="list-fname">{item.filename}</div>
              <div className="list-path">{item.path}</div>
            </div>
          </div>
        </td>
        <td>{item.size_human || "—"}</td>
        <td>{fmt(item.duration)}</td>
        <td>{item.date || "—"}</td>
        <td>{item.audio_language || "—"}</td>
        <td>{(item.tags||[]).slice(0,3).map(t => <span key={t} className="chip" style={{marginRight:3}}>{t}</span>)}</td>
        <td>{item.final_score != null ? item.final_score.toFixed(3) : "—"}</td>
        <td onClick={e => e.stopPropagation()}>
          <div style={{display:"flex",gap:5}}>
            <a className="btn btn-secondary btn-sm" href={item.file_url} target="_blank" rel="noreferrer">▶</a>
            <button className="btn btn-danger btn-sm" onClick={() => onDelete(item.path)}>Del</button>
          </div>
        </td>
      </tr>
    );
  }

  function SortTh({ col, label, sortBy, setSortBy, sortDir, setSortDir }) {
    const active = sortBy === col;
    function click() {
      if (active) setSortDir(d => d === "asc" ? "desc" : "asc");
      else { setSortBy(col); setSortDir("asc"); }
    }
    return (
      <th className="sortable" onClick={click}>
        {label}
        <span className="sort-arrow">{active ? (sortDir === "asc" ? "▲" : "▼") : "⇅"}</span>
      </th>
    );
  }

  /* ─────────── SetupWizard ─────────── */
  function SetupWizard({ onComplete }) {
    const [step, setStep] = useState(1);
    const [form, setForm] = useState({ api_id: "", api_hash: "", phone: "", base_path: "/opt/telesaved/media", admin_user: "", admin_pass: "" });
    const [err, setErr] = useState("");
    const [loading, setLoading] = useState(false);
    const [diskInfo, setDiskInfo] = useState(null);
    const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

    async function checkDisk(path) {
      // /api/setup/disk-space is not yet exposed; silently skip if absent
      try {
        const r = await api(`/api/setup/disk-space?path=${encodeURIComponent(path)}`);
        if (r && r.free_human) setDiskInfo(r);
      } catch (e) { setDiskInfo(null); }
    }

    async function validateTelegram() {
      setErr(""); setLoading(true);
      try {
        const r = await api("/api/setup/validate-telegram", {
          method: "POST",
          body: JSON.stringify({ api_id: parseInt(form.api_id), api_hash: form.api_hash, phone: form.phone }),
        });
        if (r && r.ok) { setStep(3); checkDisk(form.base_path); }
        else setErr(r?.error || "Validation failed");
      } catch (e) { setErr(e.message); }
      setLoading(false);
    }

    async function finish() {
      setErr(""); setLoading(true);
      try {
        // Step 1: write config.json via /api/setup/save
        const r = await api("/api/setup/save", {
          method: "POST",
          body: JSON.stringify({
            api_id: parseInt(form.api_id), api_hash: form.api_hash,
            base_path: form.base_path,
          }),
        });
        if (!r || !r.ok) { setErr(r?.error || "Setup failed"); setLoading(false); return; }
        // Step 2: create the first Admin account via /api/auth/bootstrap
        const b = await api("/api/auth/bootstrap", {
          method: "POST",
          body: JSON.stringify({ username: form.admin_user, password: form.admin_pass }),
        });
        if (!b || !b.ok) { setErr(b?.error || "Admin account creation failed"); setLoading(false); return; }
        onComplete();
      } catch (e) { setErr(e.message); }
      setLoading(false);
    }

    const steps = ["Welcome", "Credentials", "Vault", "Admin"];
    return (
      <div className="wizard-overlay">
        <div className="wizard-card">
          <div className="wizard-steps">
            {steps.map((s, i) => (
              <React.Fragment key={i}>
                <div className={`wizard-dot ${step > i+1 ? "done" : step === i+1 ? "active" : ""}`}>{step > i+1 ? "✓" : i+1}</div>
                {i < steps.length-1 && <div className="wizard-line" />}
              </React.Fragment>
            ))}
          </div>

                  {loading ? <span className="wizard-spinner" /> : "Validate & Continue →"}
                </button>
              </div>

          {step === 3 && (
            <div>
              <div style={{fontWeight:700,marginBottom:16}}>Vault Path</div>
              <label className="field-label">Media Storage Path</label>
              <input className="field" type="text" value={form.base_path} onChange={e => { set("base_path", e.target.value); checkDisk(e.target.value); }} />
              {diskInfo && (
                <div style={{fontSize:12,color:"var(--muted)",marginTop:6}}>
                  💾 {diskInfo.free_human} free of {diskInfo.total_human} ({diskInfo.percent_used}% used)
                </div>
              )}
              {err && <div className="form-error">{err}</div>}
              <div style={{display:"flex",gap:8,marginTop:16}}>
                <button className="btn btn-secondary" onClick={() => setStep(2)}>← Back</button>
                <button className="btn btn-primary" style={{flex:1}} onClick={() => { setErr(""); setStep(4); }} disabled={!form.base_path}>Next →</button>
              </div>
            </div>
          )}

          {step === 4 && (
            <div>
              <div style={{fontWeight:700,marginBottom:16}}>Create Admin Account</div>
              <label className="field-label">Username</label>
              <input className="field" type="text" value={form.admin_user} onChange={e => set("admin_user", e.target.value)} placeholder="admin" autoComplete="username" />
              <label className="field-label">Password</label>
              <input className="field" type="password" value={form.admin_pass} onChange={e => set("admin_pass", e.target.value)} autoComplete="new-password" />
              {err && <div className="form-error">{err}</div>}
              <div style={{display:"flex",gap:8,marginTop:16}}>
                <button className="btn btn-secondary" onClick={() => setStep(3)}>← Back</button>
                <button className="btn btn-primary" style={{flex:1}} onClick={finish} disabled={loading || !form.admin_user || !form.admin_pass}>

  /* ─────────── LoginPage ─────────── */
  function LoginPage({ bootstrapRequired, onLogin }) {
    const [user, setUser] = useState("");
    const [pass, setPass] = useState("");
    const [err, setErr] = useState("");
    const [loading, setLoading] = useState(false);

    async function submit(e) {
      e.preventDefault();
      setErr(""); setLoading(true);
      try {
        const r = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ username: user, password: pass }),
        });
        if (r && r.ok) onLogin(r.user || user);
        else setErr(r?.error || "Invalid credentials");
      } catch (e2) { setErr(e2.message); }
      setLoading(false);
    }

    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)"}}>
        <div className="login-card">
          <div style={{textAlign:"center",marginBottom:24}}>
            <div style={{width:48,height:48,borderRadius:12,background:"linear-gradient(135deg,var(--accent),var(--accent-2))",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:20,margin:"0 auto 12px"}}>T</div>
            <div style={{fontWeight:800,fontSize:20}}>TeleSaved AI</div>
            {bootstrapRequired && <div style={{color:"var(--warning)",fontSize:12,marginTop:4}}>First run — create your admin account</div>}
          </div>
          <form onSubmit={submit}>
            <label className="field-label">Username</label>
            <input className="field" type="text" value={user} onChange={e => setUser(e.target.value)} autoComplete="username" autoFocus />
            <label className="field-label">Password</label>
            <input className="field" type="password" value={pass} onChange={e => setPass(e.target.value)} autoComplete="current-password" />
            {err && <div className="form-error" style={{marginTop:8}}>{err}</div>}
            <button className="btn btn-primary" style={{width:"100%",marginTop:16}} type="submit" disabled={loading || !user || !pass}>
              {loading ? "Signing in…" : bootstrapRequired ? "Create Account & Sign In" : "Sign In"}
            </button>
          </form>
        </div>
      </div>
    );
  }

  /* ─────────── ConfirmModal ─────────── */
  function ConfirmModal({ message, onConfirm, onCancel }) {
    return (
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9000}}>
        <div style={{background:"var(--panel)",borderRadius:"var(--radius-lg)",padding:"28px 32px",maxWidth:380,width:"90%",boxShadow:"var(--shadow)"}}>
          <div style={{marginBottom:20,lineHeight:1.6}}>{message}</div>
          <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
            <button className="btn btn-secondary" onClick={onCancel}>Cancel</button>
            <button className="btn btn-danger" onClick={onConfirm}>Delete</button>
          </div>
        </div>
      </div>

  /* ─────────── Toast ─────────── */
  function Toast({ message, type, onDismiss }) {
    useEffect(() => { if (!message) return; const t = setTimeout(onDismiss, 4000); return () => clearTimeout(t); }, [message]);
    if (!message) return null;
    const bg = type === "error" ? "var(--danger)" : type === "warning" ? "var(--warning)" : "var(--success)";
    return (
      <div style={{position:"fixed",bottom:24,right:24,background:bg,color:"#fff",padding:"10px 18px",borderRadius:8,zIndex:9999,boxShadow:"var(--shadow)",cursor:"pointer"}} onClick={onDismiss}>
        {message}
      </div>
    );
  }

  /* ─────────── ItemDetailPage ─────────── */
  function ItemDetailPage({ path, onBack, onToast, permissions }) {
    const [item, setItem] = useState(null);
    const [loading, setLoading] = useState(true);
    const [notFound, setNotFound] = useState(false);
    const [tab, setTab] = useState("tags");
    const [tagInput, setTagInput] = useState("");
    const [saving, setSaving] = useState(false);
    const [audioStatus, setAudioStatus] = useState(null);
    const [analyzeLoading, setAnalyzeLoading] = useState(false);
    const [personalForm, setPersonalForm] = useState({ rating: 0, notes: "", favorite: false });
    const [watchLater, setWatchLater] = useState(false);

    const encoded = encodeURIComponent(path);

    async function load() {
      setLoading(true);
      setNotFound(false);
      try {
        const r = await api(`/api/item/${encoded}`);
        setItem(r);
        setTagInput((r.tags || []).join(", "));
        setPersonalForm({ rating: r.personal_rating || 0, notes: r.personal_notes || "", favorite: r.favorite || false });
        setWatchLater(r.watch_later || false);
        setAudioStatus(r.audio);
      } catch (e) {
        if (e.message && (e.message.includes("404") || e.message.toLowerCase().includes("not found"))) {
          setNotFound(true);
        } else {
          onToast(e.message, "error");
        }
      }
      setLoading(false);
    }

    useEffect(() => { load(); }, [path]);

    // Poll audio status while processing
    useInterval(() => {
      if (audioStatus && (audioStatus.status === "processing" || audioStatus.status === "queued")) {
        api(`/api/item/${encoded}`).then(r => { setAudioStatus(r.audio); setItem(r); }).catch(() => {});
      }
    }, audioStatus && (audioStatus.status === "processing" || audioStatus.status === "queued") ? 3000 : null);

    async function saveTags() {
      setSaving(true);
      try {
        const tags = tagInput.split(",").map(t => t.trim()).filter(Boolean);
        await api(`/api/item/${encoded}/tags`, { method: "POST", body: JSON.stringify({ tags }) });
        onToast("Tags saved");
        load();
      } catch (e) { onToast(e.message, "error"); }
      setSaving(false);
    }

    async function clearTags() {
      if (!confirm("Clear manual tag override?")) return;
      try { await api(`/api/item/${encoded}/tags/clear`, { method: "POST" }); onToast("Tags cleared"); load(); }
      catch (e) { onToast(e.message, "error"); }
    }

    async function triggerAudio(force = false) {
      setAnalyzeLoading(true);
      try {
        await api(`/api/item/${encoded}/audio/analyze`, { method: "POST", body: JSON.stringify({ force, transcribe: true }) });
        onToast("Audio analysis started");
        load();
      } catch (e) { onToast(e.message, "error"); }
      setAnalyzeLoading(false);
    }

    async function savePersonal() {
      try {
        await api(`/api/item/${encoded}/personal`, { method: "POST", body: JSON.stringify(personalForm) });
        onToast("Saved");
      } catch (e) { onToast(e.message, "error"); }
    }

    async function toggleWatchLater() {
      try {
        await api(`/api/item/${encoded}/watch-later`, { method: "POST" });
        setWatchLater(w => !w);
        onToast(watchLater ? "Removed from Watch Later" : "Added to Watch Later");
      } catch (e) { onToast(e.message, "error"); }
    }

    async function markWatched() {
      try { await api(`/api/item/${encoded}/watched`, { method: "POST" }); onToast("Marked as watched"); load(); }
      catch (e) { onToast(e.message, "error"); }
    }

    async function reprocess() {
      try { await api(`/api/item/${encoded}/reprocess`, { method: "POST" }); onToast("Reprocessing queued"); }
      catch (e) { onToast(e.message, "error"); }
    }

    if (loading) return <div style={{padding:40,textAlign:"center",color:"var(--muted)"}}>Loading…</div>;
    if (notFound || !item) return (
      <div style={{padding:40,textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:12}}>🔍</div>
        <div style={{fontWeight:700,fontSize:16,marginBottom:8,color:"var(--text)"}}>Item not found</div>
        <div style={{color:"var(--muted)",fontSize:13,marginBottom:20}}>This item may have been deleted or moved to trash.</div>
        <button className="btn btn-secondary btn-sm" onClick={onBack}>← Back to Library</button>
      </div>
    );

    const tabs = ["tags", "audio", "scenes", "similar", "info"];
    const tabLabels = { tags: "Tags", audio: "Audio", scenes: "Scenes", similar: "Similar", info: "Info" };

    return (
      <div style={{padding:24}}>
        <button className="btn btn-secondary btn-sm" onClick={onBack} style={{marginBottom:16}}>← Back</button>

        {/* Hero */}
        <div className="detail-hero">
          <div className="detail-thumb-wrap">
            <img src={item.thumb_url} alt={item.filename} style={{width:"100%",borderRadius:"var(--radius)",display:"block"}} />
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,fontSize:17,marginBottom:6,wordBreak:"break-word"}}>{item.filename}</div>
            <div style={{color:"var(--muted)",fontSize:12,marginBottom:12}}>
              <span>{item.size_human}</span> · <span>{fmt(item.duration)}</span>

              {item.date && <> · <span>{item.date}</span></>}

            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>

        {/* Tab: Tags */}
        {tab === "tags" && (
          <div style={{marginTop:16}}>
            {item.display_tags && item.display_tags.length > 0 && (
              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,color:"var(--muted)",marginBottom:6}}>AI Display Tags</div>

                </div>

            {item.ai_signals && (
              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,color:"var(--muted)",marginBottom:6}}>AI Signals</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {Object.entries(item.ai_signals).filter(([,v]) => v).map(([k,v]) => (
                    <span key={k} className="chip">{k}: {Array.isArray(v) ? v.join(", ") : v}</span>
                  ))}
                </div>
              </div>
            )}
            <div style={{fontSize:12,color:"var(--muted)",marginBottom:6}}>Manual Tags (comma-separated)</div>
            <textarea className="field" rows={3} value={tagInput} onChange={e => setTagInput(e.target.value)} style={{resize:"vertical"}} />
            <div style={{display:"flex",gap:8,marginTop:8}}>

        {/* Tab: Audio */}
        {tab === "audio" && (

              <div style={{color:"var(--warning)"}}>⏳ {audioStatus.status === "queued" ? "Queued" : "Processing"}… (auto-refreshing)</div>
            ) : audioStatus.status === "done" ? (

              />
            ) : audioStatus.status === "error" ? (

                <div style={{color:"var(--danger)",marginBottom:12}}>Analysis failed: {audioStatus.error || "Unknown error"}</div>
                <button className="btn btn-secondary btn-sm" onClick={() => triggerAudio(true)}>Retry</button>

                  {item.scene_timeline.map((scene, i) => (
                    <div key={i} style={{textAlign:"center",flexShrink:0}}>

              <tbody>

                  <tr key={k} style={{borderBottom:"1px solid var(--border)"}}>

  /* ─────────── TranscriptView ─────────── */
  function TranscriptView({ audioStatus, item, encoded, analyzeLoading, onReanalyze, onToast }) {
    const segments = audioStatus.transcript_segments || audioStatus.segments || [];
    const hasSegments = segments.length > 0;
    const speakerMode = audioStatus.transcript_speaker_mode || "";
    const [editIdx, setEditIdx] = useState(null);
    const [editVal, setEditVal] = useState("");
    const [localSegs, setLocalSegs] = useState(null); // overrides if user edits
    const [saving, setSaving] = useState(false);
    const [viewMode, setViewMode] = useState("segments"); // "segments" | "plain"

    const displaySegs = localSegs || segments;

    // Colour-cycle per unique speaker name
    const speakerColorMap = {};
    const palette = ["speaker-1","speaker-2","speaker-3","speaker-4"];
    let colorIdx = 0;
    displaySegs.forEach(seg => {
      const sp = seg.speaker || "Speaker 1";
      if (!speakerColorMap[sp]) speakerColorMap[sp] = palette[colorIdx++ % palette.length];
    });

    function startEdit(i, text) { setEditIdx(i); setEditVal(text); }
    function cancelEdit() { setEditIdx(null); setEditVal(""); }
    function commitEdit(i) {
      const updated = displaySegs.map((seg, idx) => idx === i ? {...seg, text: editVal} : seg);
      setLocalSegs(updated);
      setEditIdx(null);
    }

    async function saveEdits() {
      if (!localSegs) return;
      setSaving(true);
      try {
        await api(`/api/item/${encoded}/audio/transcript`, {
          method: "POST",
          body: JSON.stringify({ segments: localSegs }),
        });
        onToast("Transcript saved");
        setLocalSegs(null); // edits are now persisted — clear local override
      } catch (e) {
        onToast(e.message || "Failed to save transcript", "error");
      }
      setSaving(false);
    }

    const plainText = audioStatus.transcript_script || audioStatus.transcript_text || audioStatus.transcript || "";

    return (
      <div>
        {/* Action bar */}
        <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
          <a className="btn btn-secondary btn-sm" href={`/api/item/${encoded}/transcript.srt`} download>⬇ SRT</a>
          <a className="btn btn-secondary btn-sm" href={`/api/item/${encoded}/transcript.vtt`} download>⬇ VTT</a>
          <button className="btn btn-secondary btn-sm" onClick={onReanalyze} disabled={analyzeLoading}>🔄 Re-analyze</button>
          {hasSegments && (
            <>
              <button className="btn btn-secondary btn-sm" onClick={() => setViewMode(v => v === "segments" ? "plain" : "segments")}>
                {viewMode === "segments" ? "Plain text" : "Segmented"}
              </button>
              {localSegs && <button className="btn btn-primary btn-sm" onClick={saveEdits} disabled={saving}>💾 Save edits</button>}
              {localSegs && <button className="btn btn-secondary btn-sm" onClick={() => setLocalSegs(null)}>Discard</button>}
            </>
          )}
        </div>

        {/* Metadata row */}
        <div style={{display:"flex",gap:16,fontSize:12,color:"var(--muted)",marginBottom:12,flexWrap:"wrap"}}>
          {item.audio_language && <span>🗣 Language: <strong style={{color:"var(--text)"}}>{item.audio_language}</strong></span>}
          {audioStatus.duration_human && <span>⏱ {audioStatus.duration_human}</span>}
          {hasSegments && <span>📝 {displaySegs.length} segment{displaySegs.length !== 1 ? "s" : ""}</span>}
          {speakerMode === "heuristic" && <span title="Speaker labels are estimated by turn-taking heuristic, not true diarization">👤 Heuristic speakers</span>}
          {speakerMode === "native" && <span>👤 Native speaker labels</span>}
        </div>

        {/* Segmented view */}
        {hasSegments && viewMode === "segments" && (
          <div style={{maxHeight:420,overflowY:"auto",background:"var(--panel-2)",borderRadius:"var(--radius)",padding:"8px 12px"}}>
            {displaySegs.map((seg, i) => (
              <div key={i} className="transcript-seg">
                <span className="transcript-ts">{seg.timestamp || seg.start_human || ""}</span>
                <span className="transcript-speaker">
                  <span className={`speaker-badge ${speakerColorMap[seg.speaker || "Speaker 1"] || "speaker-1"}`}>
                    {(seg.speaker || "S1").replace("Speaker ","S")}
                  </span>
                </span>
                <div className="transcript-text" style={{flex:1}}>
                  {editIdx === i ? (
                    <textarea
                      className="transcript-text editing"
                      value={editVal}
                      onChange={e => setEditVal(e.target.value)}
                      onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); commitEdit(i); } if (e.key === "Escape") cancelEdit(); }}
                      rows={Math.max(1, Math.ceil(editVal.length / 60))}
                      autoFocus
                    />
                  ) : (
                    <span
                      style={{cursor:"text"}}
                      title="Click to edit"
                      onDoubleClick={() => startEdit(i, seg.text)}
                    >{seg.text}</span>
                  )}
                </div>
                {editIdx === i && (
                  <div style={{display:"flex",flexDirection:"column",gap:3,marginLeft:6}}>
                    <button className="btn btn-primary btn-sm" style={{padding:"2px 8px",fontSize:11}} onClick={() => commitEdit(i)}>✓</button>
                    <button className="btn btn-secondary btn-sm" style={{padding:"2px 8px",fontSize:11}} onClick={cancelEdit}>✕</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}

        {/* Plain text fallback / toggle */}
        {(!hasSegments || viewMode === "plain") && plainText && (
          <div style={{background:"var(--panel-2)",borderRadius:"var(--radius)",padding:12,maxHeight:360,overflowY:"auto",fontSize:12,lineHeight:1.8,whiteSpace:"pre-wrap",color:"var(--muted)"}}>
            {plainText}
          </div>
        )}

        {!hasSegments && !plainText && (
          <div style={{color:"var(--muted)",fontSize:13}}>Transcript is empty.</div>
        )}

        {hasSegments && <div style={{fontSize:11,color:"var(--muted)",marginTop:6}}>Double-click any segment to edit text.</div>}
      </div>
    );
  }

  function SuggestTagInline({ path, onToast }) {
    const [open, setOpen] = useState(false);
    const [val, setVal] = useState("");
    const [sending, setSending] = useState(false);
    async function submit() {

      setSending(true);
      try {
        await api("/api/tags/suggestions", { method: "POST", body: JSON.stringify({ tag: val.trim(), path: decodeURIComponent(path) }) });

    return (

            <input className="field" style={{flex:1}} type="text" value={val} onChange={e => setVal(e.target.value)} placeholder="New tag name…" onKeyDown={e => e.key === "Enter" && submit()} autoFocus />

          </div>
