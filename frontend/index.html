<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TeleSaved AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    window.showBootError = function(message) {
      try {
        var box = document.getElementById("boot-error");
        if (!box) return;
        box.style.display = "block";
        box.textContent = "TeleSaved frontend failed to start: " + message;
      } catch (e) {}
    };
    window.addEventListener("error", function(event) {
      var target = event.target || {};
      if (target.tagName === "SCRIPT") {
        window.showBootError("Could not load required browser script: " + (target.src || "unknown script"));
      } else if (event.message) {
        window.showBootError(event.message + (event.filename ? " @ " + event.filename + ":" + event.lineno : ""));
      }
    }, true);
    window.addEventListener("unhandledrejection", function(event) {
      var reason = event.reason;
      window.showBootError(reason && reason.message ? reason.message : String(reason || "Unhandled promise rejection"));
    });
  </script>
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js" onerror="showBootError('React failed to load from CDN')"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js" onerror="showBootError('ReactDOM failed to load from CDN')"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" onerror="showBootError('Babel failed to load from CDN')"></script>
  <style>
    :root {
      --bg: #0e1621;
      --panel: #17212b;
      --panel-2: #1f2c3a;
      --border: rgba(255,255,255,0.08);
      --text: #e9edf0;
      --muted: #8fa3b5;
      --accent: #2ea6ff;
      --accent-2: #1c93e3;
      --chip: #223242;
      --shadow: 0 12px 30px rgba(0,0,0,0.28);
      --danger: #d96b6b;
      --success: #49b675;
    }

    * { box-sizing: border-box; }

    html, body, #root {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 260px;
      background: rgba(14,22,33,0.95);
      border-right: 1px solid var(--border);
      padding: 20px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(46,166,255,0.45) rgba(255,255,255,0.04);
    }

    .sidebar-scroll::-webkit-scrollbar {
      width: 8px;
    }

    .sidebar-scroll::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.04);
      border-radius: 999px;
    }

    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: rgba(46,166,255,0.45);
      border-radius: 999px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      flex: 0 0 auto;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.1rem;
    }

    .brand-sub {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .nav-btn, .subnav-btn {
      border: 1px solid var(--border);
      background: var(--chip);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
    }

    .nav-btn.active, .subnav-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: white;
    }

    .subnav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .subnav-group {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,0.025);
      overflow: hidden;
    }

    .subnav-heading {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 10px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.84rem;
      text-align: left;
    }

    .subnav-heading.active {
      color: #8fcbff;
    }

    .subnav-caret {
      color: var(--muted);
      font-size: 0.78rem;
      transition: transform 0.15s ease;
    }

    .subnav-group.open .subnav-caret {
      transform: rotate(90deg);
    }

    .subnav-items {
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 0 8px 8px;
    }

    .subnav-group.open .subnav-items {
      display: flex;
    }

    .subnav-group .subnav-btn {
      width: 100%;
    }

    .main {
      flex: 1;
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(14,22,33,0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 18px 20px 14px;
    }

    .search-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .search-form {
      display: grid;
      grid-template-columns: minmax(220px, 1.7fr) 160px 120px 120px;
      gap: 10px;
      align-items: center;
    }

    .field, .select, .btn {
      height: 46px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline: none;
      font-size: 0.96rem;
      min-width: 0;
    }

    .field, .select {
      background: var(--panel-2);
      color: var(--text);
      padding: 0 14px;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-weight: 700;
      cursor: pointer;
      border: none;
      padding: 0 14px;
    }

    .btn.secondary {
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn.danger, .action-btn.danger {
      background: rgba(217,107,107,0.16);
      color: #ffc2c2;
      border: 1px solid rgba(217,107,107,0.35);
    }

    .controls-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .selection-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .toolbar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
    }

    .duplicate-item {
      display: grid;
      grid-template-columns: 54px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .duplicate-item img {
      width: 54px;
      height: 38px;
      object-fit: cover;
      border-radius: 8px;
      background: #0b1118;
    }

    .storage-bar {
      width: 100%;
      height: 14px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin: 10px 0;
    }

    .storage-fill {
      height: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .storage-fill.low {
      background: linear-gradient(135deg, #d96b6b, #b94a4a);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(73,182,117,0.12);
      color: #9be0b6;
      border: 1px solid rgba(73,182,117,0.2);
      font-size: 0.84rem;
    }

    .status-pill.paused {
      background: rgba(217,107,107,0.14);
      color: #ffc2c2;
      border-color: rgba(217,107,107,0.25);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 18px;
      margin-bottom: 18px;
    }

    .breakdown-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .breakdown-row {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) minmax(140px, 2fr) auto;
      gap: 12px;
      align-items: center;
    }

    .breakdown-label {
      font-weight: 700;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .breakdown-meta {
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .breakdown-bar {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .breakdown-fill {
      height: 100%;
      min-width: 2px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .dashboard-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    .content {
      padding: 20px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      color: var(--muted);
      white-space: nowrap;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 18px 0 16px;
    }

    .muted {
      color: var(--muted);
    }

    .flash {
      background: rgba(73,182,117,0.12);
      border: 1px solid rgba(73,182,117,0.2);
      color: #9be0b6;
      padding: 12px 14px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .card-body {
      padding: 14px;
    }

    .preview-wrap {
      background: #0b1118;
      aspect-ratio: 16 / 10;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .preview-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #0b1118;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
      margin-bottom: 10px;
    }

    .file-title {
      font-weight: 700;
      line-height: 1.3;
      word-break: break-word;
      overflow-wrap: anywhere;
      min-width: 0;
      flex: 1 1 auto;
    }

    .file-date {
      color: var(--muted);
      font-size: 0.84rem;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .tag-row, .score-row, .metric-row, .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(46,166,255,0.12);
      color: #8fcbff;
      font-size: 0.82rem;
      border: 1px solid rgba(46,166,255,0.18);
      white-space: nowrap;
    }

    .mini-badge {
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 0.78rem;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .metric {
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(73,182,117,0.12);
      color: #9be0b6;
      font-size: 0.82rem;
      border: 1px solid rgba(73,182,117,0.2);
      white-space: nowrap;
    }

    .metric.override {
      background: rgba(217,107,107,0.14);
      color: #ffc2c2;
      border: 1px solid rgba(217,107,107,0.25);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      min-width: 112px;
      max-width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--chip);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .settings-table {
      width: 100%;
      border-collapse: collapse;
    }

    .settings-table th,
    .settings-table td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }

    .settings-table th {
      color: var(--muted);
      font-weight: 600;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .label {
      display: block;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .pagination {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 10px;
    }

    .page-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 40px;
      padding: 0 12px;
      border-radius: 12px;
      background: var(--chip);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.9rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .page-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: white;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal {
      width: min(900px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .tag-editor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .tag-check {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .log-box {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.82rem;
      line-height: 1.45;
      background: rgba(0,0,0,0.2);
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      max-height: 420px;
      overflow: auto;
    }


    .transcript-script-box {
      display: grid;
      gap: 8px;
      max-height: 420px;
      overflow: auto;
      background: rgba(0,0,0,0.2);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
    }

    .transcript-line {
      display: grid;
      grid-template-columns: 76px 104px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 9px 10px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
    }

    .transcript-time-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--accent-2);
      padding: 0;
      text-align: left;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .transcript-speaker {
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
    }

    .transcript-quote {
      color: var(--text);
      line-height: 1.5;
      word-break: break-word;
    }

    .transcript-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .segment-table-scroll {
      max-height: 380px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      -webkit-overflow-scrolling: touch;
    }

    .segment-table-scroll .settings-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--panel);
    }

    .segment-table-scroll .settings-table td:nth-child(4) {
      min-width: 340px;
    }

    .empty-state, .error-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    .warning-box {
      background: rgba(245, 158, 11, 0.10);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 18px;
      padding: 16px 18px;
      color: var(--text);
    }

    .warning-box ul {
      margin: 8px 0 0 20px;
      padding: 0;
    }



    .view-toggle {
      display: inline-flex;
      gap: 6px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 5px;
    }

    .view-toggle button {
      height: 36px;
      border: 0;
      border-radius: 10px;
      padding: 0 12px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
    }

    .view-toggle button.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
    }

    .list-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: auto;
      box-shadow: var(--shadow);
    }

    .library-table {
      width: 100%;
      min-width: 1320px;
      border-collapse: collapse;
    }

    .library-table th,
    .library-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    .library-table th {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: rgba(255,255,255,0.03);
    }
    .sort-header {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      font: inherit;
      text-transform: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      text-align: left;
    }

    .sort-header.active {
      color: var(--text);
    }

    .sort-indicator {
      color: var(--accent);
      font-size: 0.78rem;
    }


    .list-file-cell {
      display: flex;
      gap: 12px;
      align-items: center;
      min-width: 360px;
    }

    .list-thumb {
      width: 96px;
      height: 58px;
      border-radius: 10px;
      object-fit: cover;
      background: #0b1118;
      flex: 0 0 auto;
    }

    .path-small {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.78rem;
      max-width: 520px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .source-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
      max-height: 360px;
      overflow: auto;
      padding-right: 4px;
    }

    .source-option {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

    .source-kind {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 2px;
    }



    .detail-shell {
      padding: 20px;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .detail-title {
      font-size: 1.35rem;
      font-weight: 850;
      line-height: 1.25;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .detail-subtitle {
      color: var(--muted);

<body>
  <div id="boot-error" style="display:none;margin:16px;padding:14px;border-radius:12px;background:#3b1f1f;color:#ffd1d1;border:1px solid rgba(255,120,120,.35);font-family:system-ui, sans-serif;white-space:pre-wrap;"></div>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useEffect, useMemo, useState, useRef } = React;

    function storageGet(key, fallbackValue) {
      try {
        if (!window.localStorage) return fallbackValue;
        const value = window.localStorage.getItem(key);
        return value == null || value === "" ? fallbackValue : value;
      } catch (e) {
        return fallbackValue;
      }
    }

    function storageSet(key, value) {
      try {
        if (window.localStorage) window.localStorage.setItem(key, value);
      } catch (e) {
        // Storage may be blocked by browser/privacy settings. Keep the app usable.
      }
    }

    async function api(url, options = {}) {
      const mergedHeaders = { "Content-Type": "application/json", ...(options.headers || {}) };
      const res = await fetch(url, {
        credentials: "same-origin",
        ...options,
        headers: mergedHeaders
      });

      const contentType = res.headers.get("content-type") || "";
      const body = contentType.includes("application/json") ? await res.json() : await res.text();

      if (!res.ok) {
        throw new Error(body?.error || body || "Request failed");
      }
      return body;
    }

    function useInterval(callback, delay) {
      useEffect(() => {
        if (delay == null) return;
        const id = setInterval(callback, delay);
        return () => clearInterval(id);
      }, [callback, delay]);
    }

    function readableDate(value) {
      if (!value) return "—";
      try {
        return new Date(value).toLocaleString();
      } catch (e) {
        return value;
      }
    }

    function shortHash(value) {
      if (!value) return "—";
      const text = String(value);
      return text.length > 18 ? `${text.slice(0, 12)}…${text.slice(-6)}` : text;
    }


    function hasPermission(auth, perm) {
      const perms = auth?.permissions || [];
      return perms.includes("*") || perms.includes(perm);
    }

    function canAdmin(auth) {
      return hasPermission(auth, "admin.view") || hasPermission(auth, "system.admin") || hasPermission(auth, "security.manage") || hasPermission(auth, "sources.manage") || hasPermission(auth, "tags.manage") || hasPermission(auth, "jobs.manage");
    }

    function groupOptionsFromAuthAdmin(data) {
      return Object.keys(data?.groups || {}).sort();
    }

    function LoginPage({ onAuthenticated }) {
      const [username, setUsername] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);

      async function submit(e) {
        e.preventDefault();
        setBusy(true);
        setError("");
        try {
          const res = await api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({ username, password })
          });
          onAuthenticated(res);
        } catch (err) {
          setError(err.message || String(err));
        } finally {
          setBusy(false);
        }
      }

      return (
        <div className="app" style={{display:"grid", placeItems:"center", padding:"24px"}}>
          <form className="panel" style={{width:"min(520px, 100%)"}} onSubmit={submit}>
            <div className="brand" style={{marginBottom:"16px"}}>
              <div className="brand-badge">T</div>
              <div>
                <div className="brand-title">TeleSaved AI</div>
                <div className="brand-sub">Sign in to continue</div>
              </div>
            </div>
            {error && <div className="flash error">{error}</div>}
            <label>Username</label>
            <input className="input" value={username} onChange={e => setUsername(e.target.value)} autoFocus placeholder="Local or LDAP username" />
            <label>Password</label>

    function BootstrapPage({ onAuthenticated }) {
      const [username, setUsername] = useState("admin");
      const [displayName, setDisplayName] = useState("TeleSaved Administrator");
      const [password, setPassword] = useState("");
      const [confirmPassword, setConfirmPassword] = useState("");
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);

      async function submit(e) {
        e.preventDefault();
        setError("");
        if (password !== confirmPassword) {
          setError("Passwords do not match.");
          return;
        }
        setBusy(true);
        try {
          const res = await api("/api/auth/bootstrap", {
            method: "POST",
            body: JSON.stringify({ username, display_name: displayName, password })
          });
          onAuthenticated(res);
        } catch (err) {
          setError(err.message || String(err));
        } finally {
          setBusy(false);
        }
      }

      return (
        <div className="app" style={{display:"grid", placeItems:"center", padding:"24px"}}>
          <form className="panel" style={{width:"min(620px, 100%)"}} onSubmit={submit}>

            <label>Confirm Password</label>

    function Pagination({ page, totalPages, onChange }) {
      if (totalPages <= 1) return null;

      const buttons = [];
      const start = Math.max(1, page - 2);
      const end = Math.min(totalPages, page + 2);

      if (page > 1) {
        buttons.push(<button key="first" className="page-btn" onClick={() => onChange(1)}>First</button>);
        buttons.push(<button key="prev" className="page-btn" onClick={() => onChange(page - 1)}>Prev</button>);
      }

      for (let p = start; p <= end; p++) {
        buttons.push(
          <button key={p} className={`page-btn ${page === p ? "active" : ""}`} onClick={() => onChange(p)}>
            {p}
          </button>
        );
      }

      if (page < totalPages) {
        buttons.push(<button key="next" className="page-btn" onClick={() => onChange(page + 1)}>Next</button>);
        buttons.push(<button key="last" className="page-btn" onClick={() => onChange(totalPages)}>Last</button>);
      }

      return <div className="pagination">{buttons}</div>;
    }

      const [renameValue, setRenameValue] = useState("");

        setLoading(true);

          const data = await api(`/api/item/${encodeURIComponent(path)}`);
          setItem(data);
          setSelected(data.effective_tags || []);
          setRenameValue(data.filename || "");

          setError(e.message);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => { load(); }, [path]);

      function toggle(tag) {
        setSelected(prev => prev.includes(tag) ? prev.filter(t => t !== tag) : [...prev, tag]);

            body: JSON.stringify({ filename: renameValue })

          setError(e.message);

      async function loadSuggestions() {
        try {
          const res = await api("/api/librarian/suggestions");
          setSuggestions(res.suggestions || []);
          setCapabilities(res.capabilities || []);
        } catch (e) {
          setSuggestions([
            "Show me long movies from Saved Messages",
            "Find short clips tagged Gay sorted by newest",
            "Show me videos that probably need review",
            "Find missing files in the index"
          ]);
        }
      }

      useEffect(() => { loadSuggestions(); }, []);
      useEffect(() => { storageSet("telesaved_librarian_prompt", prompt); }, [prompt]);

      async function ask(text = prompt) {
        const clean = String(text || "").trim();
        if (!clean) {
          setFlash("Ask the AI Librarian something first");
          return;
        }
        try {
          setLoading(true);
          const res = await api("/api/librarian/ask", {
            method: "POST",
            body: JSON.stringify({ prompt: clean, limit })
          });
          setResult(res);
        } catch (e) {
          setFlash(e.message);
        } finally {
          setLoading(false);
        }
      }

      async function trashItem(path) {
        if (!confirm(`Move this video to Trash?\n\n${path}`)) return;
        try {
          await api(`/api/item/${encodeURIComponent(path)}`, { method: "DELETE" });
          setFlash("Moved to Trash");
          if (result?.prompt) await ask(result.prompt);
        } catch (e) {
          setFlash(e.message);
        }
      }

      function useSuggestion(text) {
        setPrompt(text);
        ask(text);
      }

      function filterBadges(filters) {
        if (!filters) return [];
        const badges = [];
        if (filters.q) badges.push(["Semantic", filters.q]);
        if (filters.tags?.length) badges.push(["Tags", filters.tags.join(", ")]);
        if (filters.source_filter) badges.push(["Source", filters.source_filter]);
        if (filters.duration_min != null) badges.push(["Min duration", filters.duration_min]);
        if (filters.duration_max != null) badges.push(["Max duration", filters.duration_max]);
        if (filters.size_min_mb != null) badges.push(["Min size", `${Number(filters.size_min_mb).toFixed(1)} MB`]);
        if (filters.size_max_mb != null) badges.push(["Max size", `${Number(filters.size_max_mb).toFixed(1)} MB`]);
        if (filters.exists === false) badges.push(["File status", "Missing"]);
        if (filters.exists === true) badges.push(["File status", "Exists"]);
        badges.push(["Sort", `${filters.sort_by || "path"} ${filters.sort_dir || "asc"}`]);
        badges.push(["Mode", filters.mode || "search"]);
        return badges;
      }

      return (
        <div className="content">
          {flash && <div className="flash">{flash}</div>}

          <div className="librarian-hero">
            <div className="panel">
              <div className="section-title">AI Librarian Mode</div>
              <div className="muted" style={{marginBottom:"12px"}}>
                Ask in plain English. TeleSaved translates your request into private local filters, semantic search, review checks, duplicate queries, and cleanup views.
              </div>
              <textarea
                className="librarian-prompt"
                value={prompt}
                onChange={e => setPrompt(e.target.value)}
                placeholder="Example: Show me long movies from Saved Messages sorted by newest"
              />
              <div className="controls-row">
                <button className="btn" onClick={() => ask()} disabled={loading}>{loading ? "Thinking…" : "Ask Librarian"}</button>
                <select className="select" value={limit} onChange={e => setLimit(e.target.value)} style={{maxWidth:"170px"}}>
                  <option value="12">Return 12</option>
                  <option value="24">Return 24</option>
                  <option value="48">Return 48</option>
                  <option value="100">Return 100</option>
                </select>
              </div>
              <div className="suggestion-grid">
                {suggestions.map(s => <button key={s} className="suggestion-chip" onClick={() => useSuggestion(s)}>{s}</button>)}
              </div>
            </div>

            <div className="panel">
              <div className="section-title">What it can do</div>
              <div className="tag-row">
                {(capabilities.length ? capabilities : ["Natural language library queries", "Semantic video search", "Tag/source/duration filters", "Review and cleanup intent detection"]).map(item => (
                  <span key={item} className="mini-badge">{item}</span>
                ))}
              </div>
            </div>
          </div>

          {result && (
            <>
              <div className="panel">
                <div className="section-title">Librarian Answer</div>
                <div className="librarian-answer">{result.answer}</div>
                <div className="filter-grid">
                  {filterBadges(result.filters).map(([k,v]) => <span key={k} className="metric">{k}: {String(v)}</span>)}
                </div>
                {!!result.reasons?.length && (
                  <div className="score-row">
                    {result.reasons.map((reason, idx) => <span key={idx} className="mini-badge">{reason}</span>)}
                  </div>
                )}
              </div>

              <div className="stats">
                <div className="stat">Matches: <strong>{result.total_items || 0}</strong></div>
                <div className="stat">Returned: <strong>{result.returned_items || 0}</strong></div>
                <div className="stat">Prompt: <strong>{result.prompt}</strong></div>
              </div>

              {result.items?.length ? (
                <div className="grid">
                  {result.items.map(item => (
                    <Card
                      key={item.path}
                      item={item}
                      selected={false}
                      onSelect={() => {}}
                      onEdit={() => onDetail(item.path)}
                      onDetail={onDetail}
                      onDelete={trashItem}
                    />
                  ))}
                </div>
              ) : (
                <div className="empty-state">
                  <div className="section-title">No results</div>
                  <div className="muted">Try fewer filters, remove source restrictions, or use broader search language.</div>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function LibraryPage({ flash, setFlash, tagsList, onDetail }) {
      const [q, setQ] = useState("");
      const [tag, setTag] = useState("");
      const [source, setSource] = useState("");
      const [nameFilter, setNameFilter] = useState("");
      const [dateFrom, setDateFrom] = useState("");
      const [dateTo, setDateTo] = useState("");
      const [dateExact, setDateExact] = useState("");
      const [durationMin, setDurationMin] = useState("");
      const [durationMax, setDurationMax] = useState("");
      const [stateFilter, setStateFilter] = useState("");
      const [favoriteFilter, setFavoriteFilter] = useState("");
      const [ratingMin, setRatingMin] = useState("");
      const [watchedFilter, setWatchedFilter] = useState("");
      const [watchLaterFilter, setWatchLaterFilter] = useState("");
      const [existsFilter, setExistsFilter] = useState("");
      const [tagsAll, setTagsAll] = useState("");
      const [tagsAny, setTagsAny] = useState("");
      const [tagsExclude, setTagsExclude] = useState("");
      const [showAdvanced, setShowAdvanced] = useState(() => storageGet("telesaved_advanced_search_open", "1") === "1");
      const [min, setMin] = useState("0");
      const [page, setPage] = useState(1);
      const [viewMode, setViewMode] = useState(() => storageGet("telesaved_view_mode", "grid"));
      const [sortBy, setSortBy] = useState(() => storageGet("telesaved_sort_by", "path"));
      const [sortDir, setSortDir] = useState(() => storageGet("telesaved_sort_dir", "asc"));
      const [data, setData] = useState({ items: [], page: 1, total_pages: 1, total_items: 0, sort: "path", dir: "asc" });
      const [loading, setLoading] = useState(true);
      const [editPath, setEditPath] = useState(null);
      const [selected, setSelected] = useState([]);
      const [deleteTag, setDeleteTag] = useState("");
      const [bulkTag, setBulkTag] = useState("");
      const [bulkAction, setBulkAction] = useState("add");
      const [collections, setCollections] = useState([]);
      const [collectionCounts, setCollectionCounts] = useState({});
      const [collectionId, setCollectionId] = useState("");
      const [visibleColumns, setVisibleColumns] = useState(() => parseColumnPrefs(storageGet("telesaved_list_columns", "")));

      async function loadCollections() {
        try {
          const res = await api("/api/collections");
          setCollections(res.collections || []);
          setCollectionCounts(res.counts || {});
        } catch (e) {
          // Keep Library usable even if collections fail.
        }
      }

      function libraryQueryString(targetPage = page) {
        const params = new URLSearchParams();
        params.set("q", q);
        params.set("tag", tag);
        params.set("source", source);
        params.set("name", nameFilter);
        params.set("date_from", dateFrom);
        params.set("date_to", dateTo);
        params.set("date_exact", dateExact);
        params.set("duration_min", durationMin);
        params.set("duration_max", durationMax);
        params.set("state", stateFilter);
        params.set("favorite", favoriteFilter);
        params.set("rating_min", ratingMin);
        params.set("watched", watchedFilter);
        params.set("watch_later", watchLaterFilter);
        params.set("exists", existsFilter);
        params.set("tags_all", tagsAll);
        params.set("tags_any", tagsAny);
        params.set("tags_exclude", tagsExclude);
        params.set("min", min);
        params.set("page", targetPage);
        params.set("sort", sortBy);
        params.set("dir", sortDir);
        return params.toString();
      }

      async function load(targetPage = page) {
        setLoading(true);
        try {
          const url = collectionId
            ? `/api/collections/${encodeURIComponent(collectionId)}/items?page=${targetPage}&sort=${encodeURIComponent(sortBy)}&dir=${encodeURIComponent(sortDir)}`
            : `/api/library?${libraryQueryString(targetPage)}`;
          const res = await api(url);
          setData(res);
        } catch (e) {
          setFlash(e.message);
        } finally {
          setLoading(false);
        }
      }

      const searchDeps = [q, tag, source, nameFilter, dateFrom, dateTo, dateExact, durationMin, durationMax, stateFilter, favoriteFilter, ratingMin, watchedFilter, watchLaterFilter, existsFilter, tagsAll, tagsAny, tagsExclude, min];
      useEffect(() => { loadCollections(); }, []);
      useEffect(() => { load(); }, [page, sortBy, sortDir, collectionId]);
      useEffect(() => { setPage(1); setSelected([]); }, searchDeps);
      useEffect(() => { storageSet("telesaved_advanced_search_open", showAdvanced ? "1" : "0"); }, [showAdvanced]);
      useEffect(() => { storageSet("telesaved_view_mode", viewMode); }, [viewMode]);
      useEffect(() => { storageSet("telesaved_sort_by", sortBy); storageSet("telesaved_sort_dir", sortDir); }, [sortBy, sortDir]);
      useEffect(() => { storageSet("telesaved_list_columns", JSON.stringify(visibleColumns)); }, [visibleColumns]);

      function doSearch(e) {
        e.preventDefault();
        setCollectionId("");
        setPage(1);
        setSelected([]);
        load(1);
      }

      function clearAllFilters() {
        setCollectionId("");
        setQ("");
        setTag("");
        setSource("");
        setNameFilter("");
        setDateFrom("");
        setDateTo("");
        setDateExact("");
        setDurationMin("");
        setDurationMax("");
        setStateFilter("");
        setFavoriteFilter("");
        setRatingMin("");
        setWatchedFilter("");
        setWatchLaterFilter("");
        setExistsFilter("");
        setTagsAll("");
        setTagsAny("");
        setTagsExclude("");
        setMin("0");
        setPage(1);
        setSelected([]);
      }

      function applyQuickDate(value) {
        setDateExact(value || "");
        setDateFrom("");
        setDateTo("");
        setPage(1);
      }

      function handleSort(column) {
        setSelected([]);
        if (sortBy === column) {
          setSortDir(prev => prev === "asc" ? "desc" : "asc");
        } else {
          setSortBy(column);
          setSortDir(["size", "duration", "score", "modified", "manual"].includes(column) ? "desc" : "asc");
        }
        setPage(1);
      }

      function toggleColumn(column) {
        setVisibleColumns(prev => {
          if (prev.includes(column)) {
            const next = prev.filter(key => key !== column);
            return next.length ? next : prev;
          }
          return LIBRARY_COLUMN_DEFS.filter(def => def.key === column || prev.includes(def.key)).map(def => def.key);
        });
      }

      function resetColumns() {
        setVisibleColumns(DEFAULT_LIBRARY_COLUMNS);
      }

      function toggleSelected(path) {
        setSelected(prev => prev.includes(path) ? prev.filter(p => p !== path) : [...prev, path]);
      }

      function selectAllVisible() {
        const visible = data.items.map(item => item.path);
        const allSelected = visible.length && visible.every(path => selected.includes(path));
        setSelected(allSelected ? selected.filter(path => !visible.includes(path)) : Array.from(new Set([...selected, ...visible])));
      }

      async function deleteOne(path) {
        if (!confirm(`Move this video to Trash? You can restore it later.\n\n${path}`)) return;
        try {
          await api(`/api/item/${encodeURIComponent(path)}`, { method: "DELETE" });
          setFlash("Video moved to Trash");
          setSelected(prev => prev.filter(p => p !== path));
          load();
        } catch (e) {
          setFlash(e.message);
        }
      }

      async function deleteSelected() {
        if (!selected.length) {
          setFlash("No videos selected");
          return;
        }
        if (!confirm(`Move ${selected.length} selected video(s) to Trash? You can restore them later from Administration → Trash.`)) return;
        try {
          const res = await api("/api/delete-bulk", {
            method: "POST",
            body: JSON.stringify({ paths: selected })
          });
          setFlash(`Moved ${res.deleted} video(s) to Trash. Failed: ${res.failed?.length || 0}`);
          setSelected([]);
          load();
        } catch (e) {
          setFlash(e.message);
        }
      }

      async function deleteByTag() {
        if (!deleteTag) {
          setFlash("Choose a tag first");
          return;
        }
        if (!confirm(`Move ALL videos tagged ${deleteTag} to Trash? You can restore them later from Administration → Trash.`)) return;
        try {
          const res = await api("/api/delete-tag", {
            method: "POST",
            body: JSON.stringify({ tag: deleteTag })
          });
          setFlash(`Moved ${res.deleted} video(s) tagged ${deleteTag} to Trash. Failed: ${res.failed?.length || 0}`);
          setSelected([]);
          load();
        } catch (e) {
          setFlash(e.message);
        }
      }

      async function applyBulkTags() {
        if (!selected.length) {
          setFlash("No videos selected");
          return;
        }
        if (!bulkTag) {
          setFlash("Choose a tag for the bulk edit");
          return;
        }
        try {
          const res = await api("/api/bulk/tags", {
            method: "POST",
            body: JSON.stringify({ paths: selected, tags: [bulkTag], action: bulkAction })
          });
          setFlash(`Bulk tag ${res.action}: updated ${res.updated} video(s). Failed: ${res.failed?.length || 0}`);
          load();
        } catch (e) {
          setFlash(e.message);
        }
      }

      async function reprocessSelected() {
        if (!selected.length) {
          setFlash("No videos selected");
          return;
        }
        if (!confirm(`Reprocess ${selected.length} selected video(s)? This runs in the background.`)) return;
        try {
          const res = await api("/api/bulk/reprocess", {
            method: "POST",
            body: JSON.stringify({ paths: selected })
          });
          setFlash(`Queued ${res.queued} selected video(s) for reprocessing`);
        } catch (e) {
          setFlash(e.message);
        }
      }

      async function saveCurrentCollection() {
        const collectionName = prompt("Name this smart collection:");
        if (!collectionName) return;
        try {
          const res = await api("/api/collections", {
            method: "POST",
            body: JSON.stringify({ name: collectionName, q, tag, source, search_name: nameFilter, name_filter: nameFilter, file_name: nameFilter, date_from: dateFrom, date_to: dateTo, date_exact: dateExact, duration_min: durationMin, duration_max: durationMax, state: stateFilter, favorite: favoriteFilter, rating_min: ratingMin, watched: watchedFilter, watch_later: watchLaterFilter, exists: existsFilter, tags_all: tagsAll, tags_any: tagsAny, tags_exclude: tagsExclude, min, sort: sortBy, dir: sortDir })
          });
          setFlash(`Saved smart collection: ${res.collection?.name || collectionName}`);
          await loadCollections();
          setCollectionId(res.collection?.id || "");
          setPage(1);
        } catch (e) {
          setFlash(e.message);
        }
      }

      function applyCollection(id) {
        setCollectionId(id);
        setSelected([]);
        setPage(1);
      }

      const activeCollection = collections.find(c => c.id === collectionId);
      const visiblePaths = data.items.map(item => item.path);
      const allVisibleSelected = visiblePaths.length && visiblePaths.every(path => selected.includes(path));
      const activeFilterSummary = [
        q && ["Search", q], tag && ["Tag", tag], source && ["Source", source], nameFilter && ["Name", nameFilter],
        dateExact && ["Date", dateExact], dateFrom && ["From", dateFrom], dateTo && ["To", dateTo],
        durationMin && ["Min duration", durationMin], durationMax && ["Max duration", durationMax],
        stateFilter && ["State", stateFilter], favoriteFilter && ["Favorite", favoriteFilter], ratingMin && ["Rating ≥", ratingMin],
        watchedFilter && ["Watched", watchedFilter], watchLaterFilter && ["Watch later", watchLaterFilter], existsFilter && ["Exists", existsFilter],
        tagsAll && ["Tags all", tagsAll], tagsAny && ["Tags any", tagsAny], tagsExclude && ["Exclude tags", tagsExclude],
      ].filter(Boolean);

      return (
        <>
          <div className="topbar">
            <div className="search-panel">
              <form className="search-form" onSubmit={doSearch}>
                <input className="field" value={q} onChange={e => setQ(e.target.value)} placeholder={'Search filenames, dates, sources, tags, state, or plain language…'} />
                <select className="select" value={tag} onChange={e => setTag(e.target.value)}>
                  <option value="">All tags</option>
                  {tagsList.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
                <input className="field" value={source} onChange={e => setSource(e.target.value)} placeholder="Source contains…" />
                <button className="btn" type="submit">Search</button>
                <button className="btn secondary" type="button" onClick={() => setShowAdvanced(v => !v)}>{showAdvanced ? "Hide Advanced" : "Advanced"}</button>
              </form>

              {showAdvanced && (
                <div className="panel" style={{marginTop:"12px"}}>
                  <div className="section-title">Granular Search</div>
                  <div className="muted">Use the main box for natural language or filename prefixes. Use these fields when you need exact control.</div>
                  <div className="filter-grid" style={{marginTop:"12px"}}>
                    <div><label className="label">Filename / path contains</label><input className="field" value={nameFilter} onChange={e => setNameFilter(e.target.value)} placeholder="document_2026-03-19" /></div>
                    <div><label className="label">Exact date</label><input className="field" type="date" value={dateExact} onChange={e => applyQuickDate(e.target.value)} /></div>
                    <div><label className="label">Date from</label><input className="field" type="date" value={dateFrom} onChange={e => { setDateFrom(e.target.value); setDateExact(""); }} /></div>
                    <div><label className="label">Date to</label><input className="field" type="date" value={dateTo} onChange={e => { setDateTo(e.target.value); setDateExact(""); }} /></div>
                    <div><label className="label">Min duration</label><input className="field" value={durationMin} onChange={e => setDurationMin(e.target.value)} placeholder="30s, 5m, 1:20" /></div>
                    <div><label className="label">Max duration</label><input className="field" value={durationMax} onChange={e => setDurationMax(e.target.value)} placeholder="10m, 0:45" /></div>
                    <div><label className="label">Personal state</label><select className="select" value={stateFilter} onChange={e => setStateFilter(e.target.value)}>
                      <option value="">Any state</option><option value="unreviewed">Unreviewed</option><option value="watch_next">Watch Next</option><option value="keep">Keep</option><option value="maybe">Maybe</option><option value="delete_candidate">Delete Candidate</option><option value="archived">Archived</option>
                    </select></div>
                    <div><label className="label">Favorite</label><select className="select" value={favoriteFilter} onChange={e => setFavoriteFilter(e.target.value)}><option value="">Any</option><option value="true">Favorites only</option><option value="false">Not favorite</option></select></div>
                    <div><label className="label">Minimum rating</label><select className="select" value={ratingMin} onChange={e => setRatingMin(e.target.value)}><option value="">Any</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option><option value="5">5</option></select></div>
                    <div><label className="label">Watched</label><select className="select" value={watchedFilter} onChange={e => setWatchedFilter(e.target.value)}><option value="">Any</option><option value="true">Watched</option><option value="false">Unwatched</option></select></div>
                    <div><label className="label">Watch later</label><select className="select" value={watchLaterFilter} onChange={e => setWatchLaterFilter(e.target.value)}><option value="">Any</option><option value="true">Watch later only</option><option value="false">Not watch later</option></select></div>
                    <div><label className="label">File exists</label><select className="select" value={existsFilter} onChange={e => setExistsFilter(e.target.value)}><option value="">Any</option><option value="true">Existing files</option><option value="false">Missing files</option></select></div>
                    <div><label className="label">Must include all tags</label><input className="field" value={tagsAll} onChange={e => setTagsAll(e.target.value)} placeholder="Movie,Gay" /></div>
                    <div><label className="label">Include any tag</label><input className="field" value={tagsAny} onChange={e => setTagsAny(e.target.value)} placeholder="Clip,Movie" /></div>
                    <div><label className="label">Exclude tags</label><input className="field" value={tagsExclude} onChange={e => setTagsExclude(e.target.value)} placeholder="Archived,Delete" /></div>
                    <div><label className="label">Min semantic score</label><input className="field" value={min} onChange={e => setMin(e.target.value)} placeholder="0" /></div>
                  </div>
                  <div className="muted" style={{marginTop:"10px"}}>Examples: <code>document_2026-03-19</code>, <code>date:2026-03-19</code>, <code>source:"Saved Messages" duration:&gt;5m</code>, <code>favorites rating:4</code>, <code>watch next from March 19 2026</code>.</div>
                </div>
              )}

              <div className="action-row" style={{marginTop:"12px"}}>
                <select className="select" value={collectionId} onChange={e => applyCollection(e.target.value)}>
                  <option value="">No smart collection</option>
                  {collections.map(c => <option key={c.id} value={c.id}>{c.name} ({collectionCounts[c.id] ?? "—"})</option>)}
                </select>
                <button className="btn secondary" type="button" onClick={saveCurrentCollection}>Save Current Search</button>
              </div>
              <div className="action-row" style={{marginTop:"12px", justifyContent:"space-between"}}>
                <button className="btn secondary" onClick={clearAllFilters}>Clear Filters</button>
                <div className="view-toggle">
                  <button className={viewMode === "grid" ? "active" : ""} onClick={() => setViewMode("grid")}>Grid</button>
                  <button className={viewMode === "list" ? "active" : ""} onClick={() => setViewMode("list")}>Detailed List</button>
                </div>
              </div>
              {!!activeFilterSummary.length && (
                <div className="score-row" style={{marginTop:"12px"}}>
                  {activeFilterSummary.map(([k,v]) => <span key={k + v} className="mini-badge">{k}: {String(v)}</span>)}
                </div>
              )}
              {!!data.filters?.natural_language?.length && (
                <div className="score-row" style={{marginTop:"8px"}}>
                  {data.filters.natural_language.map((reason, idx) => <span key={idx} className="metric">Parsed: {reason}</span>)}
                </div>
              )}
            </div>
          </div>

          <div className="content">
            {flash && <div className="flash">{flash}</div>}

            <div className="stats">
              <div className="stat">Results: <strong>{data.total_items}</strong></div>
              <div className="stat">Page: <strong>{data.page}</strong> / <strong>{data.total_pages}</strong></div>
              <div className="stat">Tag: <strong>{tag || "All"}</strong></div>
              <div className="stat">Source: <strong>{source || "All"}</strong></div>
              <div className="stat">Selected: <strong>{selected.length}</strong></div>
              <div className="stat">View: <strong>{viewMode === "list" ? "Detailed List" : "Grid"}</strong></div>
              <div className="stat">Sort: <strong>{sortBy}</strong> <strong>{sortDir === "asc" ? "↑" : "↓"}</strong></div>
              {activeCollection && <div className="stat">Collection: <strong>{activeCollection.name}</strong></div>}
            </div>

            <div className="toolbar">
              <div className="controls-row">
                <button className="btn secondary" onClick={selectAllVisible}>{allVisibleSelected ? "Unselect Visible" : "Select Visible"}</button>
                <button className="btn danger" onClick={deleteSelected}>Move Selected to Trash</button>
                <select className="select" value={deleteTag} onChange={e => setDeleteTag(e.target.value)}>
                  <option value="">Trash by tag…</option>
                  {tagsList.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
                <button className="btn danger" onClick={deleteByTag}>Trash Tag Group</button>
              </div>
              <div className="controls-row" style={{marginTop:"10px"}}>
                <select className="select" value={bulkAction} onChange={e => setBulkAction(e.target.value)}>
                  <option value="add">Bulk add tag</option>
                  <option value="remove">Bulk remove tag</option>
                  <option value="set">Bulk set only this tag</option>
                </select>
                <select className="select" value={bulkTag} onChange={e => setBulkTag(e.target.value)}>
                  <option value="">Choose tag…</option>
                  {tagsList.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
                <button className="btn" onClick={applyBulkTags}>Apply Bulk Tag Edit</button>
                <button className="btn secondary" onClick={reprocessSelected}>Reprocess Selected</button>
              </div>
            </div>

            {viewMode === "list" && (
              <div className="panel">
                <div className="section-title">Detailed List Columns</div>
                <div className="muted">Choose which columns appear in detailed list view. Preferences are saved in this browser.</div>
                <div className="column-picker">
                  {LIBRARY_COLUMN_DEFS.map(col => (
                    <label className="column-chip" key={col.key}>
                      <input type="checkbox" checked={visibleColumns.includes(col.key)} onChange={() => toggleColumn(col.key)} />
                      <span>{col.label}</span>
                    </label>
                  ))}
                </div>
                <div className="controls-row"><button className="btn secondary" onClick={resetColumns}>Reset Columns</button></div>
              </div>
            )}

            {loading ? (
              <div className="muted">Loading…</div>
            ) : data.items.length ? (
              <>
                <div className="section-title">{activeCollection ? `Collection: ${activeCollection.name}` : (activeFilterSummary.length ? "Search Results" : "Library")}</div>
                <div className="muted">Showing page {data.page} of {data.total_pages} • {data.total_items} total items</div>
                <Pagination page={data.page} totalPages={data.total_pages} onChange={setPage} />

                {viewMode === "list" ? (
                  <div className="list-wrap">
                    <table className="library-table">
                      <thead>
                        <tr>
                          <th></th>
                          {LIBRARY_COLUMN_DEFS.filter(col => visibleColumns.includes(col.key)).map(col => (
                            <th key={col.key}><SortHeader label={col.label} column={col.sort} sortBy={sortBy} sortDir={sortDir} onSort={handleSort} /></th>
                          ))}
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        {data.items.map(item => (
                          <ListRow
                            key={item.path}
                            item={item}
                            onEdit={setEditPath}
                            onDetail={onDetail}
                            selected={selected.includes(item.path)}
                            onSelect={toggleSelected}
                            onDelete={deleteOne}
                            visibleColumns={visibleColumns}
                          />
                        ))}
                      </tbody>
                    </table>
                  </div>
                ) : (
                  <div className="grid">
                    {data.items.map(item => (
                      <Card
                        key={item.path}
                        item={item}
                        onEdit={setEditPath}
                        onDetail={onDetail}
                        selected={selected.includes(item.path)}
                        onSelect={toggleSelected}
                        onDelete={deleteOne}
                      />
                    ))}
                  </div>
                )}

                <Pagination page={data.page} totalPages={data.total_pages} onChange={setPage} />
              </>
            ) : (
              <div className="empty-state">
                <div className="section-title">No matching files</div>
                <div className="muted">Try broader search words or a different tag.</div>
              </div>

              onClose={() => setEditPath(null)}
              onSaved={(msg) => { setFlash(msg); setEditPath(null); load(); }}

        </>
      );

      const [selectedTags, setSelectedTags] = useState([]);
      const [renameValue, setRenameValue] = useState("");
      const [notes, setNotes] = useState("");
      const [favorite, setFavorite] = useState(false);

      function seekBy(seconds) {
        const video = currentVideo();
        if (!video) return;
        video.currentTime = Math.max(0, Math.min((video.duration || video.currentTime + seconds), video.currentTime + seconds));
        setPlayerStatus(`${seconds > 0 ? "+" : ""}${seconds}s`);

      function seekTo(seconds) {
        const video = currentVideo();

    function transcriptTime(seconds) {
      const total = Math.max(0, Math.round(Number(seconds || 0)));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const sec = total % 60;
      if (h) return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
      return `${m}:${String(sec).padStart(2, "0")}`;
    }

    function normalizeSpeaker(value, fallback="Speaker 1") {
      const text = String(value || "").trim();
      if (!text) return fallback;
      if (/^speaker[_\s-]*\d+$/i.test(text)) {
        const n = parseInt(text.replace(/\D+/g, ""), 10);
        return `Speaker ${n || 1}`;
      }
      if (/^\d+$/.test(text)) return `Speaker ${Math.max(1, parseInt(text, 10))}`;
      return text.slice(0, 32);
    }

    function enrichTranscriptSegmentsForDisplay(segments) {
      const rows = Array.isArray(segments) ? segments : [];
      if (!rows.length) return [];
      const hasSpeakers = rows.some(seg => seg && (seg.speaker || seg.speaker_label || seg.speaker_id));
      let currentSpeaker = 0;
      let previousEnd = null;
      let previousStart = 0;
      let previousText = "";
      return rows.map((seg, idx) => {
        const start = Number(seg?.start || 0);
        const end = Number(seg?.end || start);
        const text = String(seg?.text || "").trim();
        let speaker = seg?.speaker || seg?.speaker_label || seg?.speaker_id || "";
        let speakerMode = seg?.speaker_mode || "";
        if (hasSpeakers && speaker !== "") {
          speaker = normalizeSpeaker(speaker, `Speaker ${currentSpeaker + 1}`);
          speakerMode = speakerMode || "native";
        } else {
          if (idx > 0) {
            const gap = Math.max(0, start - Number(previousEnd ?? start));
            const previousDuration = Math.max(0, Number(previousEnd ?? start) - previousStart);
            const previousWords = previousText.split(/\s+/).filter(Boolean).length;
            const currentWords = text.split(/\s+/).filter(Boolean).length;
            let turnBreak = false;
            if (gap >= 1.8) turnBreak = true;
            else if (gap >= 1.0 && /[?!]$/.test(previousText)) turnBreak = true;
            else if (previousDuration >= 12 && previousWords >= 18 && currentWords <= 18) turnBreak = true;
            else if (previousWords >= 35 && /^[A-Z]/.test(text)) turnBreak = true;
            if (turnBreak) currentSpeaker = (currentSpeaker + 1) % 2;
          }
          speaker = `Speaker ${currentSpeaker + 1}`;
          speakerMode = speakerMode || "heuristic";
        }
        previousEnd = end;
        previousStart = start;
        previousText = text;
        return {
          ...(seg || {}),
          start,
          end,
          text,
          speaker,
          speaker_mode: speakerMode,
          timestamp: seg?.timestamp || seg?.start_human || transcriptTime(start),
          end_timestamp: seg?.end_timestamp || seg?.end_human || transcriptTime(end),
          duration_human: seg?.duration_human || transcriptTime(Math.max(0, end - start)),
        };
      }).filter(seg => seg.text);
    }

    function TranscriptTimeButton({ seconds, label, onSeek }) {
      const safeLabel = label || transcriptTime(seconds);
      if (!onSeek) return <span>{safeLabel}</span>;
      return <button className="transcript-time-btn" onClick={() => onSeek(seconds)} title={`Seek to ${safeLabel}`}>{safeLabel}</button>;
    }

    function AudioPanel({ audio, onAnalyze, onTranscribe, onSeek }) {
      const data = audio || {};
      const transcript = data.transcript_text || "";
      const silenceSegments = data.segments || [];
      const transcriptSegments = enrichTranscriptSegmentsForDisplay(data.transcript_segments || []);
      const scriptLines = transcriptSegments.length
        ? transcriptSegments.map(seg => ({
            start: Number(seg.start || 0),
            timestamp: seg.timestamp || transcriptTime(seg.start),
            speaker: normalizeSpeaker(seg.speaker),
            text: seg.text || "",
          }))
        : [];
      const speakerMode = data.transcript_speaker_mode || (transcriptSegments.some(seg => seg.speaker_mode === "native") ? "native" : (transcriptSegments.length ? "heuristic" : ""));
      const qualityWarnings = Array.isArray(data.transcript_quality_warnings) ? data.transcript_quality_warnings : [];
      const filteredCount = Number(data.transcript_filtered_segment_count || 0);
      const rawSegmentCount = Number(data.transcript_raw_segment_count || 0);
      return (
        <div className="panel">
          <div className="section-title">Audio Intelligence</div>
          <div className="stats">
            <div className="stat">Status: <strong>{data.status || "not_analyzed"}</strong></div>
            <div className="stat">Audio: <strong>{data.has_audio ? "Detected" : "Not detected"}</strong></div>
            <div className="stat">Codec: <strong>{data.codec || "—"}</strong></div>

    function CommandPalette({ open, onClose, setView, setAdminTab, openDetail, setFlash }) {
      const [query, setQuery] = useState("");
      const [active, setActive] = useState(0);
      const inputRef = useRef(null);

      const actions = useMemo(() => [
        {label:"Open Library", hint:"Go to the main library", run:() => setView("library")},
        {label:"Open Downloads", hint:"View active and recent downloads", run:() => setView("downloads")},
        {label:"AI Librarian", hint:"Natural-language library search", run:() => setView("librarian")},
        {label:"Visual Library Map", hint:"Map library by directory, source, tag, month, state, and rating", run:() => { setView("admin"); setAdminTab("libraryMap"); }},
        {label:"Favorites / Ratings", hint:"Open your personal library layer", run:() => { setView("admin"); setAdminTab("favorites"); }},
        {label:"Jobs", hint:"Background worker and job history", run:() => { setView("admin"); setAdminTab("jobs"); }},
        {label:"Audio Intelligence", hint:"Whisper, transcripts, audio analysis", run:() => { setView("admin"); setAdminTab("audio"); }},
        {label:"Cleanup Studio", hint:"Guided cleanup workflow", run:() => { setView("admin"); setAdminTab("cleanupStudio"); }},
        {label:"Review Studio", hint:"Human review queue", run:() => { setView("admin"); setAdminTab("review"); }},
        {label:"Duplicate Intelligence", hint:"Exact and possible duplicate review", run:() => { setView("admin"); setAdminTab("duplicates"); }},
        {label:"Sources", hint:"Telegram sources and pipelines", run:() => { setView("admin"); setAdminTab("sources"); }},
        {label:"Logs", hint:"Application and Whisper diagnostic logs", run:() => { setView("admin"); setAdminTab("logs"); }},
        {label:"About TeleSaved AI", hint:"Version, author, license, credits", run:() => { setView("admin"); setAdminTab("about"); }},
        {label:"Open detail by path…", hint:"Paste a relative media path", run:() => { const path = prompt("Relative video path:"); if (path) openDetail(path); }},
      ], [setView, setAdminTab, openDetail]);

      const filtered = actions.filter(action => `${action.label} ${action.hint}`.toLowerCase().includes(query.toLowerCase().trim()));

      useEffect(() => {
        if (!open) return;
        setQuery("");
        setActive(0);
        setTimeout(() => inputRef.current && inputRef.current.focus(), 25);
      }, [open]);

      function runAction(action) {
        if (!action) return;
        action.run();
        onClose();
        if (setFlash) setFlash(action.label);
      }

      function onKeyDown(e) {
        if (e.key === "Escape") { e.preventDefault(); onClose(); }
        if (e.key === "ArrowDown") { e.preventDefault(); setActive(prev => Math.min(prev + 1, Math.max(filtered.length - 1, 0))); }
        if (e.key === "ArrowUp") { e.preventDefault(); setActive(prev => Math.max(prev - 1, 0)); }
        if (e.key === "Enter") { e.preventDefault(); runAction(filtered[active] || filtered[0]); }
      }

      if (!open) return null;
      return (
        <div className="command-backdrop" onClick={onClose}>
          <div className="command-panel" onClick={e => e.stopPropagation()}>
            <input ref={inputRef} className="command-input" value={query} onChange={e => { setQuery(e.target.value); setActive(0); }} onKeyDown={onKeyDown} placeholder="Type a command…" />
            <div className="command-list">
              {filtered.length ? filtered.map((action, idx) => (
                <button key={action.label} className={`command-row ${idx === active ? "active" : ""}`} onMouseEnter={() => setActive(idx)} onClick={() => runAction(action)}>
                  <span><strong>{action.label}</strong><br /><span className="muted">{action.hint}</span></span>
                  <span className="command-kbd">Enter</span>
                </button>
              )) : <div className="empty-state"><div className="muted">No matching commands.</div></div>}
            </div>
          </div>
        </div>
      );
    }

          const val = String(v || "").trim();
          if (!val) return;
          const key = val.toLowerCase();
          if (!seen.has(key)) {
            out.push(val);
            seen.add(key);
          }
        });
        return out.length ? out : ["me"];
      }

      function ensureProfile(ref, title) {
        setProfiles(prev => ({ ...prev, [ref]: prev[ref] || defaultProfile(ref, title) }));
      }

      function toggleSource(ref, title) {
        setSources(prev => {
          const exists = prev.some(x => String(x).toLowerCase() === String(ref).toLowerCase());
          if (!exists) ensureProfile(ref, title);
          return normalize(exists ? prev.filter(x => String(x).toLowerCase() !== String(ref).toLowerCase()) : [...prev, ref]);
        });
      }

      function addManual() {
        const pieces = manual.split(/[\n,]+/).map(x => x.trim()).filter(Boolean);
        if (!pieces.length) return;
        pieces.forEach(ref => ensureProfile(ref));
        setSources(prev => normalize([...prev, ...pieces]));
        setManual("");
      }

      function updateProfile(ref, patch) {
        setProfiles(prev => ({ ...prev, [ref]: { ...(prev[ref] || defaultProfile(ref)), ...patch, ref } }));
      }

      async function save() {
        try {
          const payloadProfiles = sources.map(ref => profiles[ref] || defaultProfile(ref));
          const res = await api("/api/sources", {
            method: "POST",
            body: JSON.stringify({ profiles: payloadProfiles })
          });
          setSources(res.sources || sources);
          setProfiles(res.profiles || profiles);
          setFlash("Source pipeline settings saved.");
          try { setPipelineData(await api("/api/admin/source-pipelines")); } catch (_) {}
        } catch (e) {
          setFlash(e.message);
        }
      }

      async function runPipeline(ref) {
        try {
          setPipelineRunning(ref);
          const profile = profiles[ref] || defaultProfile(ref);
          const res = await api("/api/admin/source-pipelines/run", {
            method: "POST",
            body: JSON.stringify({ source_ref: ref, max_messages: profile.max_messages_per_run || 500 })
          });
          setFlash(`Source pipeline started: ${res.job?.title || ref}`);
          try { setPipelineData(await api("/api/admin/source-pipelines")); } catch (_) {}
        } catch (e) {
          setFlash(e.message);
        } finally {
          setPipelineRunning("");
        }
      }

      async function backfillMetadata() {
        try {
          const res = await api("/api/admin/telegram-metadata/backfill", {
            method: "POST",
            body: JSON.stringify({ limit: backfillLimit })
          });
          setFlash(`Telegram metadata backfill started: ${res.job?.id || "job queued"}`);
          try { setMetadataData(await api("/api/admin/telegram-metadata")); } catch (_) {}
        } catch (e) {
          setFlash(e.message);
        }
      }

      function pipelineRow(ref) {
        return (pipelineData?.pipelines || []).find(row => String(row.ref).toLowerCase() === String(ref).toLowerCase()) || {};
      }

      const metadataSummary = metadataData?.summary || {};

      return (
        <div className="content">
          <div className="panel">
            <div className="section-title">Telegram Video Sources</div>
            <div className="muted" style={{marginBottom:"12px"}}>
              Each source can now have its own enable/sync flags, destination folder, date range, size limits, and auto-tag setting.
            </div>
            {error && <div className="flash" style={{background:"rgba(217,107,107,0.14)", color:"#ffc2c2", borderColor:"rgba(217,107,107,0.25)"}}>Dialog list warning: {error}</div>}

            <div className="stats">
              <div className="stat">Configured sources: <strong>{sources.length}</strong></div>
              <div className="stat">Available dialogs shown: <strong>{dialogs.length}</strong></div>
              <div className="stat">Enabled sources: <strong>{sources.filter(src => (profiles[src] || {}).enabled !== false).length}</strong></div>
            </div>

            <div className="controls-row" style={{marginBottom:"14px"}}>
              <button className="btn secondary" onClick={() => toggleSource("me", "Saved Messages")}>{sources.includes("me") ? "Remove Saved Messages" : "Add Saved Messages"}</button>
              <button className="btn secondary" onClick={load}>Refresh Dialog List</button>
              <button className="btn" onClick={save}>Save Source Settings</button>
            </div>

            <label className="label">Enter sources manually, separated by commas or new lines</label>
            <textarea className="field" style={{height:"110px", width:"100%"}} value={manual} onChange={e => setManual(e.target.value)} placeholder="me, @channelusername, -1001234567890" />
            <div className="controls-row">
              <button className="btn secondary" onClick={addManual}>Add Manual Sources</button>
            </div>
          </div>

          <div className="panel">
            <div className="section-title">Source Pipelines 2.0</div>
            <div className="muted" style={{marginBottom:"12px"}}>
              Bundle 2 adds per-source pipeline controls and preserves Telegram-specific metadata such as captions, sender identity, forwards, replies, reactions, views, grouped message IDs, and Telegram links.
            </div>
            <div className="stats">
              <div className="stat">Pipeline sources: <strong>{pipelineData?.summary?.source_count || sources.length}</strong></div>
              <div className="stat">Pipeline enabled: <strong>{pipelineData?.summary?.pipeline_enabled ?? sources.length}</strong></div>
              <div className="stat">Metadata coverage: <strong>{metadataSummary.coverage_percent || 0}%</strong></div>
              <div className="stat">Preserved metadata: <strong>{metadataSummary.with_telegram_metadata || 0}</strong></div>
              <div className="stat">Missing metadata: <strong>{metadataSummary.missing_telegram_metadata || 0}</strong></div>
            </div>
            <div className="form-grid" style={{marginTop:"12px"}}>
              <div><label className="label">Backfill Limit</label><input className="field" value={backfillLimit} onChange={e => setBackfillLimit(e.target.value)} placeholder="500" /></div>
            </div>
            <div className="controls-row">
              <button className="btn secondary" onClick={async () => { try { setPipelineData(await api("/api/admin/source-pipelines")); setMetadataData(await api("/api/admin/telegram-metadata")); setFlash("Source pipeline status refreshed"); } catch (e) { setFlash(e.message); } }}>Refresh Pipeline Status</button>
              <button className="btn" onClick={backfillMetadata}>Backfill Telegram Metadata</button>
            </div>
            {metadataData?.missing_examples?.length ? (
              <div style={{marginTop:"12px"}}>
                <div className="label">Missing metadata examples</div>
                <div className="mini-table-wrap" style={{maxHeight:"160px", overflow:"auto"}}>
                  <table className="mini-table"><thead><tr><th>Path</th><th>Source</th><th>Message</th></tr></thead><tbody>
                    {metadataData.missing_examples.map(row => <tr key={row.path}><td className="mono-small">{row.path}</td><td>{row.source}</td><td>{row.message_id || row.message_key || "—"}</td></tr>)}
                  </tbody></table>
                </div>
              </div>
            ) : null}
          </div>

          <div className="panel">
            <div className="section-title">Source-Level Rules</div>
            {sources.map(ref => {
              const profile = profiles[ref] || defaultProfile(ref);
              return (
                <div className="panel" key={ref} style={{boxShadow:"none", marginBottom:"14px"}}>
                  <div className="title-row">
                    <div>
                      <div className="file-title">{profile.title || ref}</div>
                      <div className="muted">{ref}</div>
                    </div>
                    <button className="action-btn danger" onClick={() => setSources(prev => normalize(prev.filter(x => x !== ref)))}>Remove</button>
                  </div>

                  <div className="tag-editor-grid" style={{marginBottom:"14px"}}>
                    <label className="tag-check"><input type="checkbox" checked={profile.enabled !== false} onChange={e => updateProfile(ref, {enabled: e.target.checked})} /> Enabled</label>
                    <label className="tag-check"><input type="checkbox" checked={profile.sync_enabled !== false} onChange={e => updateProfile(ref, {sync_enabled: e.target.checked})} /> Startup Sync</label>
                    <label className="tag-check"><input type="checkbox" checked={profile.download_videos !== false} onChange={e => updateProfile(ref, {download_videos: e.target.checked})} /> Download Videos</label>
