  }


  /* ─────────── AILibrarian ─────────── */
  function AILibrarian({ onOpen, onClose }) {
    const [messages, setMessages] = useState([]);   // [{role:"user"|"assistant", text, items, reasons}]
    const [input, setInput] = useState("");
    const [loading, setLoading] = useState(false);
    const [suggestions, setSuggestions] = useState([]);
    const bodyRef = useRef(null);

    useEffect(() => {
      api("/api/librarian/suggestions")
        .then(r => setSuggestions(r.suggestions || []))
        .catch(() => {});
    }, []);

    useEffect(() => {
      if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
    }, [messages]);

    async function ask(prompt) {
      const q = (prompt || input).trim();
      if (!q) return;
      setInput("");
      setMessages(m => [...m, { role: "user", text: q }]);
      setLoading(true);
      try {
        const r = await api("/api/librarian/ask", {
          method: "POST",
          body: JSON.stringify({ prompt: q }),
        });
        if (r && r.ok) {
          setMessages(m => [...m, {
            role: "assistant",
            text: r.answer,
            items: r.items || [],
            reasons: r.reasons || {},
            total: r.total_items,
          }]);
        } else {
          setMessages(m => [...m, { role: "assistant", text: r?.error || "Something went wrong." }]);
        }
      } catch (e) {
        setMessages(m => [...m, { role: "assistant", text: e.message }]);
      }
      setLoading(false);
    }

    function reasonChips(reasons) {
      if (!reasons || typeof reasons !== "object") return null;
      const chips = Object.entries(reasons).filter(([,v]) => v).map(([k,v]) =>
        `${k}: ${Array.isArray(v) ? v.join(", ") : v}`
      );
      if (!chips.length) return null;
      return (
        <div className="librarian-reasons">
          {chips.map((c,i) => <span key={i} className="librarian-chip">{c}</span>)}
        </div>
      );
    }

    return (
      <>
        <div className="librarian-overlay-bg" onClick={onClose} />
        <div className="librarian-panel">
          <div className="librarian-header">
            <div style={{fontWeight:700,fontSize:15}}>✨ AI Librarian</div>
            <button className="btn btn-secondary btn-sm" onClick={onClose}>✕ Close</button>
          </div>

          <div className="librarian-body" ref={bodyRef}>
            {/* Empty state — show suggestions */}
            {messages.length === 0 && (
              <div>
                <div style={{color:"var(--muted)",fontSize:13,marginBottom:12}}>
                  Ask me anything about your library in plain English.
                </div>
                {suggestions.map((s, i) => (
                  <div key={i} className="librarian-suggestion" onClick={() => ask(s)}>{s}</div>
                ))}
              </div>
            )}

            {/* Conversation */}
            {messages.map((msg, i) => (
              <div key={i}>
                <div className={`librarian-bubble ${msg.role}`}>
                  {msg.text}
                  {msg.role === "assistant" && msg.total != null && (
                    <div style={{fontSize:11,color:"var(--muted)",marginTop:4}}>
                      {msg.total} result{msg.total !== 1 ? "s" : ""}
                      {msg.items && msg.items.length < msg.total ? ` (showing ${msg.items.length})` : ""}
                    </div>
                  )}
                  {msg.role === "assistant" && reasonChips(msg.reasons)}
                </div>
                {msg.items && msg.items.length > 0 && (
                  <div className="librarian-results">
                    {msg.items.slice(0,12).map(item => (
                      <div key={item.path} className="librarian-result-row" onClick={() => { onOpen(item.path); onClose(); }}>
                        <img className="librarian-result-thumb" src={item.thumb_url} alt={item.filename}
                          onError={e => e.target.style.display="none"} />
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:12,fontWeight:500}}>{item.filename}</div>
                          <div style={{fontSize:11,color:"var(--muted)"}}>{item.size_human} · {item.duration ? fmt(item.duration) : "—"}</div>
                        </div>
                      </div>
                    ))}
                    {msg.items.length > 12 && (
                      <div style={{fontSize:11,color:"var(--muted)",textAlign:"center",padding:"4px 0"}}>+{msg.items.length-12} more</div>
                    )}
                  </div>
                )}
              </div>
            ))}

            {loading && (
              <div className="librarian-bubble assistant" style={{color:"var(--muted)"}}>
                <span className="wizard-spinner" /> Thinking…
              </div>
            )}
          </div>

          <div className="librarian-input-row">
            <input className="field" style={{flex:1}} type="text" value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && !loading && ask()}
              placeholder="Show me long videos tagged Oral…"
              autoFocus />
            <button className="btn btn-primary btn-sm" onClick={() => ask()} disabled={loading || !input.trim()}>Ask</button>
          </div>
        </div>
      </>
    );
  }


  /* ─────────── LibraryPage ─────────── */
  function LibraryPage({ onOpen, onToast }) {
    const [items, setItems] = useState([]);
    const [total, setTotal] = useState(0);
    const [page, setPage] = useState(1);
    const [totalPages, setTotalPages] = useState(1);
    const [loading, setLoading] = useState(false);
    const [viewMode, setViewMode] = useState("grid");
    const [showLibrarian, setShowLibrarian] = useState(false);
    const [selected, setSelected] = useState(new Set());
    const [q, setQ] = useState("");
    const [qDraft, setQDraft] = useState("");
    const [sortBy, setSortBy] = useState("date");
    const [sortDir, setSortDir] = useState("desc");
    const [showFilters, setShowFilters] = useState(false);
    const [filters, setFilters] = useState({ tag: "", source: "", min: "", audio_language: "", scene_composition: "", performer_presentation: "", act_tag: "", duration_min: "", duration_max: "" });
    const [sources, setSources] = useState([]);
    const [deleteTarget, setDeleteTarget] = useState(null);

    const setF = (k, v) => setFilters(f => ({...f, [k]: v}));

    async function loadSources() {
      try { const r = await api("/api/sources"); setSources(r.sources || []); } catch {}
    }
    useEffect(() => { loadSources(); }, []);

    async function load(pg = page) {
      setLoading(true);
      try {
        const params = new URLSearchParams({ page: pg, sort: sortBy, dir: sortDir });
        if (q) params.set("q", q);
        if (filters.tag) params.set("tag", filters.tag);
        if (filters.source) params.set("source", filters.source);
        if (filters.min) params.set("min", filters.min);
        if (filters.audio_language) params.set("audio_language", filters.audio_language);
        if (filters.scene_composition) params.set("scene_composition", filters.scene_composition);
        if (filters.performer_presentation) params.set("performer_presentation", filters.performer_presentation);
        if (filters.act_tag) params.set("act_tag", filters.act_tag);
        if (filters.duration_min) params.set("duration_min", filters.duration_min);
        if (filters.duration_max) params.set("duration_max", filters.duration_max);
        const r = await api(`/api/library?${params}`);
        setItems(r.items || []);
        setTotal(r.total || 0);
        setTotalPages(r.total_pages || 1);
        setSelected(new Set());
      } catch (e) { onToast(e.message, "error"); }
      setLoading(false);
    }

    useEffect(() => { load(page); }, [page, sortBy, sortDir, q]);

    function handleSearch(e) { e.preventDefault(); setPage(1); setQ(qDraft); }

    function toggleSelect(path) {
      setSelected(s => { const n = new Set(s); n.has(path) ? n.delete(path) : n.add(path); return n; });
    }
    function selectAll() { setSelected(new Set(items.map(i => i.path))); }
    function clearSelect() { setSelected(new Set()); }

    async function bulkDelete() {
      if (!selected.size) return;
      if (!confirm(`Delete ${selected.size} item(s)?`)) return;
      try {
        await api("/api/delete-bulk", { method: "POST", body: JSON.stringify({ paths: [...selected] }) });
        onToast(`Deleted ${selected.size} item(s)`);
        load(page);
      } catch (e) { onToast(e.message, "error"); }
    }

    async function doDelete(path) {
      try {
        await api(`/api/item/${encodeURIComponent(path)}`, { method: "DELETE" });
        onToast("Moved to trash");
        setDeleteTarget(null);
        load(page);
      } catch (e) { onToast(e.message, "error"); setDeleteTarget(null); }
    }

    const sortProps = { sortBy, setSortBy, sortDir, setSortDir };

    return (
      <div style={{padding:24}}>
        {deleteTarget && <ConfirmModal message={`Move "${deleteTarget}" to trash?`} onConfirm={() => doDelete(deleteTarget)} onCancel={() => setDeleteTarget(null)} />}

        {/* AI Librarian slide-in */}
        {showLibrarian && <AILibrarian onOpen={onOpen} onClose={() => setShowLibrarian(false)} />}

        {/* Topbar */}
        <div className="topbar">
          <form onSubmit={handleSearch} style={{flex:1,display:"flex",gap:8}}>
            <input className="topbar-search" type="text" value={qDraft} onChange={e => setQDraft(e.target.value)} placeholder="Search videos… (name, tag, #source)" />
            <button className="btn btn-primary btn-sm" type="submit">Search</button>
          </form>
          <button className="btn btn-secondary btn-sm" onClick={() => setShowFilters(f => !f)}>⚙ Filters</button>
          <button className="btn btn-secondary btn-sm" title="AI Librarian" onClick={() => setShowLibrarian(l => !l)} style={{color:"var(--accent)"}}>✨ Ask AI</button>
          <button className="btn btn-secondary btn-sm" title="Grid view" onClick={() => setViewMode("grid")} style={{opacity: viewMode==="grid"?1:0.5}}>⊞</button>
          <button className="btn btn-secondary btn-sm" title="List view" onClick={() => setViewMode("list")} style={{opacity: viewMode==="list"?1:0.5}}>≡</button>
        </div>

        {/* Filters panel */}
        {showFilters && (
          <div style={{background:"var(--panel-2)",borderRadius:"var(--radius)",padding:16,marginBottom:16,display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:10}}>
            <div>
              <div className="field-label">Source</div>
              <select className="field" value={filters.source} onChange={e => setF("source", e.target.value)}>
                <option value="">All sources</option>
                {sources.map(s => <option key={s.id || s.name} value={s.name}>{s.name}</option>)}
              </select>
            </div>
            <div>
              <div className="field-label">Tag</div>
              <input className="field" type="text" value={filters.tag} onChange={e => setF("tag", e.target.value)} placeholder="any tag" />
            </div>
            <div>
              <div className="field-label">Act Tag</div>
              <input className="field" type="text" value={filters.act_tag} onChange={e => setF("act_tag", e.target.value)} placeholder="Oral, Anal…" />
            </div>
            <div>
              <div className="field-label">Language</div>
              <input className="field" type="text" value={filters.audio_language} onChange={e => setF("audio_language", e.target.value)} placeholder="en, es…" />
            </div>
            <div>
              <div className="field-label">Scene Composition</div>
              <input className="field" type="text" value={filters.scene_composition} onChange={e => setF("scene_composition", e.target.value)} placeholder="duo_mm…" />
            </div>
            <div>
              <div className="field-label">Performers</div>
              <input className="field" type="text" value={filters.performer_presentation} onChange={e => setF("performer_presentation", e.target.value)} placeholder="female, male…" />
            </div>
            <div>
              <div className="field-label">Min score</div>
              <input className="field" type="number" step="0.01" min={0} max={1} value={filters.min} onChange={e => setF("min", e.target.value)} placeholder="0.5" />
            </div>
            <div>
              <div className="field-label">Duration (s) min</div>
              <input className="field" type="number" value={filters.duration_min} onChange={e => setF("duration_min", e.target.value)} placeholder="60" />
            </div>
            <div>
              <div className="field-label">Duration (s) max</div>
              <input className="field" type="number" value={filters.duration_max} onChange={e => setF("duration_max", e.target.value)} placeholder="3600" />
            </div>
            <div style={{alignSelf:"flex-end"}}>
              <button className="btn btn-primary btn-sm" style={{width:"100%"}} onClick={() => { setPage(1); load(1); }}>Apply</button>
            </div>
          </div>
        )}

        {/* Bulk actions */}
        {selected.size > 0 && (
          <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12,background:"var(--panel-2)",padding:"8px 12px",borderRadius:"var(--radius)"}}>
            <span style={{color:"var(--muted)",fontSize:13}}>{selected.size} selected</span>
            <button className="btn btn-danger btn-sm" onClick={bulkDelete}>🗑 Delete selected</button>
            <button className="btn btn-secondary btn-sm" onClick={clearSelect}>Clear</button>
            <button className="btn btn-secondary btn-sm" onClick={selectAll}>Select all on page</button>
          </div>
        )}

        {/* Summary */}
        <div style={{color:"var(--muted)",fontSize:12,marginBottom:12}}>{loading ? "Loading…" : `${total} videos`}</div>

        {/* Loading skeleton */}
        {loading && (
          <div className="video-grid" aria-busy="true" aria-label="Loading library…">
            {Array.from({length: 12}).map((_, i) => (
              <div key={i} style={{borderRadius:"var(--radius-lg)",background:"var(--panel)",overflow:"hidden",animation:"pulse 1.4s ease-in-out infinite",animationDelay:`${i*0.07}s`}}>
                <div style={{width:"100%",paddingBottom:"56.25%",background:"var(--panel-2)"}} />
                <div style={{padding:"10px 12px 12px"}}>
                  <div style={{height:12,borderRadius:4,background:"var(--panel-2)",marginBottom:8,width:"80%"}} />
                  <div style={{height:10,borderRadius:4,background:"var(--panel-2)",width:"50%"}} />
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Empty state */}
        {!loading && items.length === 0 && (
          <div className="empty">
            <div className="empty-icon">🎬</div>
            <div className="empty-title">No videos found</div>
            <div style={{color:"var(--muted)",fontSize:13}}>Try adjusting your search or filters, or add a Telegram source in Administration → Sources.</div>
          </div>
        )}

        {/* Grid view */}
        {!loading && viewMode === "grid" && items.length > 0 && (
          <div className="video-grid">
            {items.map(item => (
              <VideoCard key={item.path} item={item} onOpen={onOpen}
                selected={selected.has(item.path)} onSelect={toggleSelect}
                onDelete={p => setDeleteTarget(p)} />
            ))}
          </div>
        )}

        {/* List view */}
        {!loading && viewMode === "list" && items.length > 0 && (
          <div style={{overflowX:"auto"}}>
            <table className="lib-table">
              <thead>
                <tr>
                  <th style={{width:32}}></th>
                  <SortTh col="filename" label="File" {...sortProps} />
                  <SortTh col="size" label="Size" {...sortProps} />
                  <SortTh col="duration" label="Duration" {...sortProps} />
                  <SortTh col="date" label="Date" {...sortProps} />
                  <SortTh col="audio_language" label="Lang" {...sortProps} />
                  <th>Tags</th>
                  <SortTh col="score" label="Score" {...sortProps} />
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {items.map(item => (
                  <ListRow key={item.path} item={item} onOpen={onOpen}
                    selected={selected.has(item.path)} onSelect={toggleSelect}
                    onDelete={p => setDeleteTarget(p)} />
                ))}
              </tbody>
            </table>
          </div>
        )}

        <Pagination page={page} totalPages={totalPages} onChange={p => setPage(p)} />
      </div>
    );
  }

  /* ─────────── CollectionsPage ─────────── */
  function CollectionsPage({ onToast }) {
    const [collections, setCollections] = useState([]);
    const [loading, setLoading] = useState(true);
    const [creating, setCreating] = useState(false);
    const [newName, setNewName] = useState("");
    const [newQuery, setNewQuery] = useState("");
    async function load() {
      setLoading(true);
      try { const r = await api("/api/collections"); setCollections(r.collections || r || []); }
      catch (e) { onToast(e.message, "error"); }
      setLoading(false);
    }
    useEffect(() => { load(); }, []);
    async function create() {
      if (!newName.trim()) return;
      try {
        await api("/api/collections", { method: "POST", body: JSON.stringify({ name: newName.trim(), query: newQuery.trim() }) });

      } catch (e) { onToast(e.message, "error"); }
    }

      if (!confirm("Delete this collection?")) return;
      try { await api(`/api/collections/${id}`, { method: "DELETE" }); onToast("Deleted"); load(); }
      catch (e) { onToast(e.message, "error"); }

  /* ─────────── AdminReviewStudio ─────────── */
  function AdminReviewStudio({ onToast, permissions }) {
    const [item, setItem] = useState(null);
    const [loading, setLoading] = useState(true);
    const [acting, setActing] = useState(false);

    async function loadNext() {
      setLoading(true); setItem(null);
      try {
        const r = await api("/api/admin/review/studio");
        setItem(r.item || r || null);
      } catch (e) { onToast(e.message, "error"); }
      setLoading(false);
    }
    useEffect(() => { loadNext(); }, []);

    async function act(action) {
      if (!item || acting) return;
      setActing(true);
      try {
        await api(`/api/review/${encodeURIComponent(item.path)}/${action}`, { method: "POST" });
        onToast(action === "accept" ? "Accepted ✓" : "Skipped");
        await loadNext();
      } catch (e) { onToast(e.message, "error"); }
      setActing(false);
    }

    return (
      <div style={{padding:24}}>
        <div style={{fontWeight:700,fontSize:18,marginBottom:16}}>🔍 Review Studio</div>
        {loading && <div style={{color:"var(--muted)"}}>Loading…</div>}
        {!loading && !item && (
          <div className="empty"><div className="empty-icon">✓</div><div className="empty-title">All caught up — nothing to review</div></div>
        )}
        {item && (
          <div style={{maxWidth:600}}>

            )}
            <div style={{display:"flex",gap:10,marginBottom:16}}>
              <button className="btn btn-primary" style={{flex:1}} onClick={() => act("accept")} disabled={acting}>✓ Accept</button>
              <button className="btn btn-secondary" style={{flex:1}} onClick={() => act("skip")} disabled={acting}>→ Skip</button>
            </div>
            {permissions && permissions.includes("tags.manage") && (
              <SuggestTagInline path={encodeURIComponent(item.path)} onToast={onToast} />
            )}
          </div>
        )}
      </div>
    );
  }

  /* ─────────── AdminTagManagement ─────────── */
  function AdminTagManagement({ onToast }) {
    const [suggestions, setSuggestions] = useState([]);
    const [mappings, setMappings] = useState("");
    const [tab, setTab] = useState("suggestions");
    const [savingMappings, setSavingMappings] = useState(false);
    const [migrating, setMigrating] = useState(false);

    async function loadSuggestions() {
      try { const r = await api("/api/tags/suggestions"); setSuggestions(r.suggestions || r || []); }
      catch (e) { onToast(e.message, "error"); }
    }
    async function loadMappings() {
      try { const r = await api("/api/tags/mappings"); setMappings(typeof r === "string" ? r : JSON.stringify(r, null, 2)); }
      catch (e) { onToast(e.message, "error"); }
    }
    useEffect(() => { loadSuggestions(); loadMappings(); }, []);

    async function approve(id, canonical) {
      try {
        await api(`/api/tags/suggestions/${id}/approve`, { method: "POST", body: JSON.stringify({ canonical_tag: canonical || undefined }) });
        onToast("Approved"); loadSuggestions();
      } catch (e) { onToast(e.message, "error"); }
    }
    async function reject(id) {
      try { await api(`/api/tags/suggestions/${id}/reject`, { method: "POST" }); onToast("Rejected"); loadSuggestions(); }
      catch (e) { onToast(e.message, "error"); }
    }
    async function saveMappings() {
      setSavingMappings(true);
      try {
        const parsed = JSON.parse(mappings);
        await api("/api/tags/mappings", { method: "POST", body: JSON.stringify(parsed) });
        onToast("Mappings saved");
      } catch (e) { onToast(e.message === "Unexpected token" ? "Invalid JSON" : e.message, "error"); }
      setSavingMappings(false);
    }
    async function runMigration() {
      if (!confirm("Bulk-assign ai_inferred label_source to all legacy tag assignments?")) return;
      setMigrating(true);
      try {
        await api("/api/tags/migrate", { method: "POST", body: JSON.stringify({ label_source: "ai_inferred" }) });
        onToast("Migration complete");
      } catch (e) { onToast(e.message, "error"); }
      setMigrating(false);
    }

    return (
      <div style={{padding:24}}>
        <div style={{fontWeight:700,fontSize:18,marginBottom:16}}>🏷 Tag Management</div>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {["suggestions","mappings","migration"].map(t => (
            <button key={t} className={`btn btn-sm ${tab===t?"btn-primary":"btn-secondary"}`} onClick={() => setTab(t)}>
              {t === "suggestions" ? "Pending Suggestions" : t === "mappings" ? "Display Mappings" : "Legacy Migration"}
            </button>
          ))}
        </div>

        {tab === "suggestions" && (
          suggestions.length === 0 ? (
            <div className="empty"><div className="empty-icon">✓</div><div className="empty-title">No pending suggestions</div></div>
          ) : suggestions.map(s => (
            <div key={s.id} className="suggestion-row">
              <div style={{flex:1}}>
                <div style={{fontWeight:600}}>{s.tag}</div>
                <div style={{fontSize:12,color:"var(--muted)"}}>Suggested by {s.suggested_by || "user"} · {s.video_path || ""}</div>
              </div>
              <button className="btn btn-primary btn-sm" onClick={() => approve(s.id, s.tag)}>Approve</button>
              <button className="btn btn-secondary btn-sm" onClick={() => {
                const canonical = prompt("Merge into existing tag (leave blank to approve as-is):", "");
                if (canonical !== null) approve(s.id, canonical || s.tag);
              }}>Merge</button>
              <button className="btn btn-danger btn-sm" onClick={() => reject(s.id)}>Reject</button>
            </div>
          ))
        )}

        {tab === "mappings" && (
          <div>
            <div style={{fontSize:12,color:"var(--muted)",marginBottom:8}}>Edit the JSON mapping of ai_signals values to display tags. Changes take effect on next library load.</div>
            <textarea className="field" rows={16} value={mappings} onChange={e => setMappings(e.target.value)} style={{fontFamily:"monospace",fontSize:12,resize:"vertical"}} />
            <button className="btn btn-primary btn-sm" style={{marginTop:8}} onClick={saveMappings} disabled={savingMappings}>Save Mappings</button>
          </div>
        )}

        {tab === "migration" && (
          <div>
            <div style={{marginBottom:12,color:"var(--muted)",fontSize:13}}>
              Bulk-assign <code>label_source</code> to legacy video tags that predate v4.5.0. This is a one-time convenience tool — it does not affect normal app operation.
            </div>
            <button className="btn btn-warning btn-sm" onClick={runMigration} disabled={migrating}>
              {migrating ? "Running…" : "Mark all legacy tags as ai_inferred"}
            </button>
          </div>
        )}
      </div>
    );
  }

  /* ─────────── AdminScoring ─────────── */
  function AdminScoring({ onToast }) {
    const [scoring, setScoring] = useState(null);
    const [saving, setSaving] = useState(false);
    async function load() {
      try { const r = await api("/api/admin/scoring"); setScoring(r); }
      catch (e) { onToast(e.message, "error"); }
    }
    useEffect(() => { load(); }, []);
    async function save() {
      setSaving(true);
      try { await api("/api/admin/scoring", { method: "POST", body: JSON.stringify(scoring) }); onToast("Scoring saved"); }
      catch (e) { onToast(e.message, "error"); }
      setSaving(false);
    }
    async function reset() {
      if (!confirm("Reset scoring to defaults?")) return;
      try { await api("/api/admin/scoring/reset", { method: "POST" }); onToast("Reset to defaults"); load(); }
      catch (e) { onToast(e.message, "error"); }
    }
    if (!scoring) return <div style={{padding:24,color:"var(--muted)"}}>Loading…</div>;
    const setS = (k, v) => setScoring(s => ({...s, [k]: v}));
    return (
      <div style={{padding:24}}>
        <div style={{fontWeight:700,fontSize:18,marginBottom:16}}>🎯 Scoring</div>
        <div style={{background:"var(--panel-2)",borderRadius:"var(--radius)",padding:16,marginBottom:16}}>
          {Object.entries(scoring).filter(([k]) => !k.startsWith("_")).map(([k, v]) => (
            <div key={k} style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
              <label style={{width:220,fontSize:13,color:"var(--muted)"}}>{k}</label>
              <input className="field" type="number" step="0.01" value={v} onChange={e => setS(k, parseFloat(e.target.value)||0)} style={{width:100}} />
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn btn-primary btn-sm" onClick={save} disabled={saving}>Save</button>
          <button className="btn btn-secondary btn-sm" onClick={reset}>Reset Defaults</button>
        </div>
      </div>
    );
  }

  /* ─────────── AdminUsers ─────────── */
  function AdminUsers({ onToast }) {
    const [users, setUsers] = useState([]);
    const [loading, setLoading] = useState(true);
    const [creating, setCreating] = useState(false);
    const [form, setForm] = useState({ username: "", password: "", role: "viewer" });
    const setF = (k, v) => setForm(f => ({...f, [k]: v}));
    async function load() {
      setLoading(true);
      try { const r = await api("/api/auth/users"); setUsers(r.users || r || []); }
      catch (e) { onToast(e.message, "error"); }
      setLoading(false);
    }
    useEffect(() => { load(); }, []);
    async function create() {
      try {
        await api("/api/auth/users", { method: "POST", body: JSON.stringify(form) });
        onToast("User created"); setCreating(false); setForm({username:"",password:"",role:"viewer"}); load();
      } catch (e) { onToast(e.message, "error"); }
    }
    async function disable(id) {
      try { await api(`/api/auth/users/${id}`, { method: "PUT", body: JSON.stringify({ active: false }) }); onToast("Disabled"); load(); }
      catch (e) { onToast(e.message, "error"); }
    }
    async function del(id) {
      if (!confirm("Delete this user?")) return;
      try { await api(`/api/auth/users/${id}`, { method: "DELETE" }); onToast("Deleted"); load(); }
      catch (e) { onToast(e.message, "error"); }
    }
    return (
      <div style={{padding:24}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:18}}>👥 Users & Groups</div>
          <button className="btn btn-primary btn-sm" onClick={() => setCreating(c => !c)}>+ Add User</button>
        </div>
        {creating && (
          <div style={{background:"var(--panel-2)",borderRadius:"var(--radius)",padding:16,marginBottom:16}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
              <div><label className="field-label">Username</label><input className="field" value={form.username} onChange={e => setF("username",e.target.value)} /></div>
              <div><label className="field-label">Password</label><input className="field" type="password" value={form.password} onChange={e => setF("password",e.target.value)} /></div>
              <div>
                <label className="field-label">Role</label>
                <select className="field" value={form.role} onChange={e => setF("role",e.target.value)}>
                  <option value="admin">Admin</option>
                  <option value="manager">Manager</option>
                  <option value="viewer">Viewer</option>
                </select>
              </div>
            </div>
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <button className="btn btn-primary btn-sm" onClick={create}>Create</button>
              <button className="btn btn-secondary btn-sm" onClick={() => setCreating(false)}>Cancel</button>
            </div>
          </div>
        )}
        {loading && <div style={{color:"var(--muted)"}}>Loading…</div>}
        {users.map(u => (
          <div key={u.id || u.username} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:600}}>{u.username}</div>
              <div style={{fontSize:12,color:"var(--muted)"}}>{u.role || u.group} {u.active === false ? "· disabled" : ""}</div>
            </div>
            {u.active !== false && <button className="btn btn-secondary btn-sm" onClick={() => disable(u.id || u.username)}>Disable</button>}
            <button className="btn btn-danger btn-sm" onClick={() => del(u.id || u.username)}>Delete</button>
          </div>
        ))}
      </div>
    );
  }

  /* ─────────── AdminSystem ─────────── */
  function AdminSystem({ onToast }) {
    const [settings, setSettings] = useState(null);
    const [saving, setSaving] = useState(false);
    async function load() {
      try { const r = await api("/api/admin/system"); setSettings(r); }
      catch (e) { onToast(e.message, "error"); }
    }
    useEffect(() => { load(); }, []);
    async function save() {
      setSaving(true);
      try { await api("/api/admin/system", { method: "POST", body: JSON.stringify(settings) }); onToast("Settings saved"); }
      catch (e) { onToast(e.message, "error"); }
      setSaving(false);
    }
    if (!settings) return <div style={{padding:24,color:"var(--muted)"}}>Loading…</div>;
    const setS = (k, v) => setSettings(s => ({...s, [k]: v}));
    return (
      <div style={{padding:24}}>
        <div style={{fontWeight:700,fontSize:18,marginBottom:16}}>🔧 System Settings</div>
        <div style={{background:"var(--panel-2)",borderRadius:"var(--radius)",padding:16,marginBottom:16}}>
          {Object.entries(settings).filter(([k]) => !k.startsWith("_")).map(([k, v]) => (
            <div key={k} style={{marginBottom:12}}>
              <label className="field-label">{k.replace(/_/g," ")}</label>
              {typeof v === "boolean" ? (
                <label style={{display:"flex",gap:8,alignItems:"center",cursor:"pointer"}}>
                  <input type="checkbox" checked={v} onChange={e => setS(k, e.target.checked)} style={{accentColor:"var(--accent)"}} />
                  {v ? "Enabled" : "Disabled"}
                </label>
              ) : (
                <input className="field" type={typeof v === "number" ? "number" : "text"} value={v == null ? "" : v} onChange={e => setS(k, typeof v === "number" ? (parseFloat(e.target.value)||0) : e.target.value)} />
              )}
            </div>
          ))}
        </div>
        <button className="btn btn-primary btn-sm" onClick={save} disabled={saving}>Save Settings</button>
      </div>
    );
  }

  /* ─────────── AdminLogs ─────────── */
  function AdminLogs({ onToast }) {
    const [logs, setLogs] = useState("");
    const [feedback, setFeedback] = useState([]);
    const [tab, setTab] = useState("logs");
    async function loadLogs() {
      try { const r = await api("/api/admin/logs"); setLogs(typeof r === "string" ? r : JSON.stringify(r, null, 2)); }
      catch (e) { onToast(e.message, "error"); }
    }
    async function loadFeedback() {
      try { const r = await api("/api/admin/feedback"); setFeedback(r.feedback || r || []); }
      catch (e) { onToast(e.message, "error"); }
    }
    useEffect(() => { loadLogs(); loadFeedback(); }, []);
    return (
      <div style={{padding:24}}>
        <div style={{fontWeight:700,fontSize:18,marginBottom:16}}>📋 Logs</div>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          <button className={`btn btn-sm ${tab==="logs"?"btn-primary":"btn-secondary"}`} onClick={() => setTab("logs")}>System Logs</button>
          <button className={`btn btn-sm ${tab==="feedback"?"btn-primary":"btn-secondary"}`} onClick={() => setTab("feedback")}>Feedback</button>
        </div>
        {tab === "logs" && (
          <div>
            <button className="btn btn-secondary btn-sm" style={{marginBottom:8}} onClick={loadLogs}>↻ Refresh</button>
            <pre style={{background:"var(--panel-2)",borderRadius:"var(--radius)",padding:12,maxHeight:500,overflowY:"auto",fontSize:11,lineHeight:1.7,whiteSpace:"pre-wrap",wordBreak:"break-all",color:"var(--muted)"}}>{logs || "No log data"}</pre>
          </div>
        )}
        {tab === "feedback" && (
          feedback.length === 0 ? <div style={{color:"var(--muted)"}}>No feedback yet.</div>
          : feedback.map((f, i) => (
            <div key={i} style={{padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
              <div style={{fontSize:13}}>{f.message || JSON.stringify(f)}</div>
              <div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>{f.created_at || ""}</div>
            </div>
          ))
        )}
      </div>
    );
  }

  /* ─────────── AdminPage router ─────────── */
  function AdminPage({ adminTab, setAdminTab, onToast, permissions }) {
    switch (adminTab) {
      case "dashboard":  return <AdminDashboard onToast={onToast} />;
      case "sources":    return <AdminSources onToast={onToast} />;
      case "review":     return <AdminReviewStudio onToast={onToast} permissions={permissions} />;
      case "tags":       return <AdminTagManagement onToast={onToast} />;
      case "scoring":    return <AdminScoring onToast={onToast} />;
      case "users":      return <AdminUsers onToast={onToast} />;
      case "system":     return <AdminSystem onToast={onToast} />;
      case "logs":       return <AdminLogs onToast={onToast} />;
      default:           return <AdminDashboard onToast={onToast} />;
    }
  }

  /* ─────────── ConnectivityBanner ─────────── */
  function ConnectivityBanner({ status }) {
    if (!status || status === "online" || status === "ok" || status === "connected") return null;
    return (
      <div style={{background:"var(--warning)",color:"#000",padding:"8px 16px",fontSize:13,fontWeight:500,display:"flex",alignItems:"center",gap:8,position:"relative"}}>
        ⚠ No internet connection — Telegram sync paused. Your library is still available.
      </div>
    );
  }

  /* ─────────── App ─────────── */
  /* ─────────── hash router helpers ─────────── */
  function parseHash() {
    // Hash format: #/view  or  #/item/ENCODED_PATH  or  #/admin/TAB
    const hash = window.location.hash.replace(/^#\/?/, "");
    if (!hash) return { view: "library", adminTab: "dashboard", detailPath: null };
    const parts = hash.split("/");
    const view = parts[0] || "library";
    if (view === "item") {
      const encoded = parts.slice(1).join("/");
      return { view: "detail", adminTab: "dashboard", detailPath: encoded ? decodeURIComponent(encoded) : null };
    }
    if (view === "admin") {
      return { view: "admin", adminTab: parts[1] || "dashboard", detailPath: null };
    }
    return { view, adminTab: "dashboard", detailPath: null };
  }

  function buildHash(view, { adminTab, detailPath } = {}) {
    if (view === "detail" && detailPath) return `#/item/${encodeURIComponent(detailPath)}`;
    if (view === "admin" && adminTab) return `#/admin/${adminTab}`;
    return `#/${view}`;
  }

  function App() {
    const initial = parseHash();
    const [appState, setAppState] = useState("loading"); // loading | setup | login | ready | error
    const [authError, setAuthError] = useState("");
    const [bootstrapRequired, setBootstrapRequired] = useState(false);
    const [currentUser, setCurrentUser] = useState(null);
    const [permissions, setPermissions] = useState([]);
    const [connectivityStatus, setConnectivityStatus] = useState(null);
    const [view, setViewState] = useState(initial.view);
    const [adminTab, setAdminTabState] = useState(initial.adminTab);
    const [detailPath, setDetailPath] = useState(initial.detailPath);
    const [toast, setToast] = useState({ message: "", type: "success" });

    function showToast(message, type = "success") {
      setToast({ message, type });
    }

    // Keep hash in sync whenever view/adminTab/detailPath change
    function setView(v, opts = {}) {
      setViewState(v);
      if (v !== "detail") setDetailPath(null);
      const hash = buildHash(v, { adminTab: opts.adminTab || adminTab, detailPath: opts.detailPath || null });
      window.history.pushState(null, "", hash);
    }
    function setAdminTab(t) {
      setAdminTabState(t);
      window.history.pushState(null, "", buildHash("admin", { adminTab: t }));
    }

    // Listen for browser back/forward
    useEffect(() => {
      function onPop() {
        const { view: v, adminTab: t, detailPath: p } = parseHash();
        setViewState(v);
        setAdminTabState(t);
        setDetailPath(p);
      }
      window.addEventListener("popstate", onPop);
      return () => window.removeEventListener("popstate", onPop);
    }, []);

    async function checkAuth(retries = 2) {
      try {
        const health = await api("/api/health");
        if (health && health.setup_required) { setAppState("setup"); return; }
        setConnectivityStatus(health?.connectivity_status || null);
        const auth = await api("/api/auth/status");
        if (!auth || auth.bootstrap_required) { setBootstrapRequired(true); setAppState("login"); return; }
        if (!auth.authenticated) { setBootstrapRequired(false); setAppState("login"); return; }
        setCurrentUser(auth.user || auth.username || "user");
        setPermissions(auth.permissions || []);
        setAuthError("");
        setAppState("ready");
      } catch (e) {
        if (e instanceof AuthError) { setAppState("login"); return; }
        // Retry once on transient network errors (e.g. backend still starting)
        if (retries > 0) {
          await new Promise(r => setTimeout(r, 2000));
          return checkAuth(retries - 1);
        }
        setAuthError(e.message || "Cannot reach server");
        setAppState("error");
      }
    }

    useEffect(() => { checkAuth(); }, []);

    // Poll connectivity with exponential backoff — catch AuthError to redirect
    const _pollBackoff = useRef(30000);
    useInterval(async () => {
      if (appState !== "ready") return;
      try {
        const h = await api("/api/health");
        setConnectivityStatus(h?.connectivity_status || null);
        _pollBackoff.current = 30000; // reset on success
      } catch (e) {
        if (e instanceof AuthError) { setAppState("login"); return; }
        // Back off up to 5 min on repeated failures
        _pollBackoff.current = Math.min(_pollBackoff.current * 2, 300000);
      }
    }, _pollBackoff.current);

    async function handleLogin(username) {
      setCurrentUser(username);
      await checkAuth();
    }

    async function handleLogout() {
      try { await api("/api/auth/logout", { method: "POST" }); } catch {}
      setCurrentUser(null);
      setPermissions([]);
      setAppState("login");
      window.history.pushState(null, "", "#/library");
    }

    function openItem(path) {
      setDetailPath(path);
      setViewState("detail");
      window.history.pushState(null, "", buildHash("detail", { detailPath: path }));
    }
    function closeItem() {
      setDetailPath(null);
      setViewState("library");
      window.history.pushState(null, "", "#/library");
    }

    // Loading
    if (appState === "loading") {
      return (
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)"}}>
          <div style={{textAlign:"center",color:"var(--muted)"}}>
            <div style={{width:48,height:48,borderRadius:12,background:"linear-gradient(135deg,var(--accent),var(--accent-2))",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:20,margin:"0 auto 16px"}}>T</div>
            <div>Loading TeleSaved AI…</div>
          </div>
        </div>
      );
    }

    // Server unreachable — after retries
    if (appState === "error") {
      return (
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)"}}>
          <div style={{textAlign:"center",maxWidth:400}}>
            <div style={{width:48,height:48,borderRadius:12,background:"var(--danger)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:20,margin:"0 auto 16px",opacity:0.85}}>!</div>
            <div style={{fontWeight:700,fontSize:16,marginBottom:8}}>Cannot connect to TeleSaved</div>
            <div style={{color:"var(--muted)",fontSize:13,marginBottom:20}}>{authError || "The backend is not responding. Check that the service is running."}</div>
            <button className="btn btn-primary btn-sm" onClick={() => { setAppState("loading"); checkAuth(); }}>Retry</button>
          </div>
        </div>
      );
    }

    // Setup wizard
    if (appState === "setup") {
      return <SetupWizard onComplete={() => checkAuth()} />;
    }

    // Login
    if (appState === "login") {
      return <LoginPage bootstrapRequired={bootstrapRequired} onLogin={handleLogin} />;
    }

    // Main app shell
    return (
      <div className="app">
        <Sidebar view={view} setView={v => setView(v)}
          adminTab={adminTab} setAdminTab={setAdminTab}
          currentUser={currentUser} onLogout={handleLogout} />
        <div className="main">
          <ConnectivityBanner status={connectivityStatus} />
          <Toast message={toast.message} type={toast.type} onDismiss={() => setToast({ message: "", type: "success" })} />

          {view === "detail" && detailPath && (
            <ItemDetailPage path={detailPath} onBack={closeItem} onToast={showToast} permissions={permissions} />
          )}
          {view === "library" && (
            <LibraryPage onOpen={openItem} onToast={showToast} />
          )}
          {view === "watch-later" && <WatchLaterPage onOpen={openItem} onToast={showToast} />}
          {view === "personal"    && <PersonalPage onOpen={openItem} onToast={showToast} />}
          {view === "collections" && <CollectionsPage onToast={showToast} />}
          {view === "trash"       && <TrashPage onToast={showToast} />}
          {view === "downloads"   && <DownloadsPage onToast={showToast} />}
          {view === "jobs"        && <JobsPage onToast={showToast} />}
          {view === "admin"       && <AdminPage adminTab={adminTab} setAdminTab={setAdminTab} onToast={showToast} permissions={permissions} />}
        </div>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>
</body>
</html>
